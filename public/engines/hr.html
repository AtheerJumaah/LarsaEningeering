.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 6px 20px rgba(15,23,42,.04);padding:18px;animation:rise .3s var(--ease) both}.card:hover{box-shadow:0 16px 40px rgba(15,23,42,.10)}body.dark .card:hover{box-shadow:0 16px 40px rgba(0,0,0,.55)}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.cardHeader{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.cardTitle{font-size:17px;font-weight:950;margin:0;letter-spacing:-.02em}.subtitle{color:var(--muted);font-size:13px;font-weight:700}.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:13px;padding:10px 14px;font-weight:900;display:inline-flex;gap:7px;align-items:center;justify-content:center;min-height:40px;transition:.18s var(--ease)}.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(0,0,0,.08)}.btn.primary{background:#000;color:#fff;border-color:#000}.btn.ok{background:#ecfdf3;color:#166534;border-color:#bbf7d0}.btn.warn{background:#fff7ed;color:#9a3412;border-color:#fed7aa}.btn.danger{background:#fef2f2;color:#b91c1c;border-color:#fecaca}.btn.small{font-size:12px;padding:7px 10px;min-height:32px;border-radius:10px}.btn.icon{width:38px;padding:0}.rowActions{display:flex;gap:7px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;background:var(--soft);color:var(--muted);white-space:nowrap}.badge.black{background:#000;color:#fff}.badge.ok{background:#dcfce7;color:#166534}.badge.info{background:#dbeafe;color:#1e40af}.badge.warn{background:#ffedd5;color:#9a3412}.kpi{padding:17px;background:var(--panel);border:1px solid var(--line);border-radius:18px;position:relative;overflow:hidden}.kpi::before{content:"";position:absolute;inset:0 auto auto 0;height:3px;width:100%;background:linear-gradient(90deg,var(--chart1),transparent 70%)}.kpi .label{color:var(--muted);font-weight:950;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.kpi .value{font-size:31px;font-weight:950;letter-spacing:-.05em;margin-top:3px;line-height:1}.kpi .delta{font-size:12px;font-weight:850;color:var(--muted)}

.chartBars{display:grid;gap:9px}.barRow{display:grid;grid-template-columns:minmax(120px,185px) 1fr 44px;gap:10px;align-items:center}.barLabel{font-size:12px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.barTrack{height:17px;background:var(--soft);border-radius:999px;overflow:hidden;border:1px solid var(--line)}.barFill{height:100%;background:var(--chart1);border-radius:999px;transition:width .4s var(--ease)}.barCount{font-weight:950;font-variant-numeric:tabular-nums;text-align:right}.donutWrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.donut{width:150px;height:150px;border-radius:50%;position:relative;background:var(--soft);flex:none}.donut:after{content:"";position:absolute;inset:43px;background:var(--panel);border-radius:50%;border:1px solid var(--line)}.donutCenter{position:absolute;inset:0;display:grid;place-items:center;text-align:center;z-index:1;font-weight:950}.donutCenter span{font-size:11px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.06em}.legendV{display:grid;gap:8px;min-width:190px;flex:1}.legendRow{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px;font-weight:850}.legendRow i{width:12px;height:12px;border-radius:4px}.legendRow b{font-variant-numeric:tabular-nums}.miniGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.miniStat{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:12px}.miniStat .n{font-size:26px;font-weight:950;letter-spacing:-.04em}.miniStat .l{font-size:12px;color:var(--muted);font-weight:900}.categoryCard{display:grid;gap:13px}.categoryTitle{display:flex;align-items:center;justify-content:space-between;gap:10px}.itemGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}.itemCountCard{border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--panel);display:grid;gap:8px}.itemTop{display:flex;justify-cont px}.menuBtn{border:1px solid #333;background:#111;color:#fff;border-radius:12px;padding:8px 10px}

const STORE='larsa_hr_visual_counts_v5';
let state = loadState();
let page='dashboard';
let searchText='';
const $=id=>document.getElementById(id);
function clone(x){return JSON.parse(JSON.stringify(x))}
function loadState(){try{const saved=localStorage.getItem(STORE);if(saved)return JSON.parse(saved)}catch(e){}return clone(DEFAULT_DATA)}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function esc(v){return String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function slug(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')}
function categories(){return state.categories||[]}
function catById(id){return categories().find(c=>c.id===id)}
function activePeople(){return state.people||[]}
function itemName(catId,itemId){const c=catById(catId);return c?.items?.find(i=>i.id===itemId)?.name||itemId||'—'}
function singleVal(p,catId){return p.selections?.[catId]||''}
function hasItem(p,catId,itemId){const c=catById(catId);if(!c)return false;if(c.kind==='single')return singleVal(p,catId)===itemId;return !!(p.selections?.[catId]&&p.selections[catId][itemId])}
function countItem(catId,itemId){return activePeople().filter(p=>hasItem(p,catId,itemId)).length}
function categoryRows(catId){const c=catById(catId);return (c?.items||[]).map(i=>({id:i.id,name:i.name,count:countItem(catId,i.id)})).sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name))}
function totalItems(){return categories().reduce((a,c)=>a+(c.items?.length||0),0)}
function categoryTotal(catId){return categoryRows(catId).reduce((a,r)=>a+r.count,0)}
function percent(n,d){return d?Math.round((n/d)*100):0}
function maxCount(rows){return Math.max(1,...rows.map(r=>r.count||0))}
function currentFirstCategory(){return categories()[0]?.id||''}
function topRows(kind,n=8){return categoryRows(kind).slice(0,n)}
function toggleSidebar(){$('sidebar').classList.toggle('open')}
function toggleDark(){document.body.classList.toggle('dark');localStorage.setItem('larsa_hr_dark_v5',document.body.classList.contains('dark')?'1':'0')}
if(localStorage.getItem('larsa_hr_dark_v5')==='1')document.body.classList.add('dark');
const navItems=[['dashboard','▣','Dashboard','Charts and counts'],['people','◉','People','Editable employee files'],['matrix','▦','Visual Matrix','Counts by category'],['reports','◎','Reports','Compact HR report']];
function renderNav(){const nav=$('nav');nav.innerHTML=navItems.map(n=>`<button class="${page===n[0]?'active':''}" onclick="go('${n[0]}')"><span>${n[1]}</span><span>${n[2]}<small>${n[3]}</small></span></button>`).join('')}
function go(p){page=p;render();$('sidebar').classList.remove('open')}
function setTitle(h,p){$('pageH').textContent=h;$('pageP').textContent=p}
function render(){renderNav(); if(page==='dashboard')renderDashboard(); else if(page==='people')renderPeople(); else if(page==='matrix')renderMatrix(); else renderReports()}
function kpi(label,value,delta){return `<div class="kpi"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div><div class="delta">${esc(delta||'')}</div></div>`}
function barChart(catId,limit=8){const c=catById(catId);if(!c)return '<div class="empty">No data</div>';const rows=categoryRows(catId).slice(0,limit);const max=maxCount(rows);if(!rows.length)return '<div class="empty">No items yet</div>';return `<div class="chartBars">${rows.map(r=>`<div class="barRow"><div class="barLabel" title="${esc(r.name)}">${esc(r.name)}</div><div class="barTrack"><div class="barFill" style="width:${percent(r.count,max)}%"></div></div><div class="barCount">${r.count}</div></div>`).join('')}</div>`}
function chartCard(title,sub,html){return `<section class="card"><div class="cardHeader"><div><h3 class="cardTitle">${esc(title)}</h3><div class="subtitle">${esc(sub)}</div></div></div>${html}</section>`}
function donutCard(catId){const c=catById(catId);const rows=categoryRows(catId).filter(r=>r.count>0);const total=rows.reduce((a,r)=>a+r.count,0);let acc=0;const colors=['var(--chart1)','var(--chart2)','var(--chart3)','var(--chart4)','var(--chart5)','var(--chart6)'];let gradient='var(--soft) 0 100%';if(total>0){gradient=rows.slice(0,6).map((r,i)=>{const start=acc/total*100;acc+=r.count;const end=acc/total*100;return `${colors[i%colors.length]} ${start}% ${end}%`}).join(',')}
return `<div class="donutWrap"><div class="donut" style="background:conic-gradient(${gradient})"><div class="donutCenter"><div>${total}<br><span>Total</span></div></div></div><div class="legendV">${rows.slice(0,6).map((r,i)=>`<div class="legendRow"><i style="background:${colors[i%colors.length]}"></i><span>${esc(r.name)}</span><b>${r.count}</b></div>`).join('')||'<div class="empty">No data</div>'}</div></div>`}
function renderDashboard(){setTitle('Dashboard','Visual HR statistics: how many people have each skill, software, degree, discipline, credential, or rank.');const staff=activePeople().length;const tech=categoryTotal('technical');const soft=categoryTotal('software');const cred=categoryTotal('credentials');$('content').innerHTML=`<div class="visualHero"><section class="heroCard"><h2>Larsa HR Visual Matrix</h2><p>Binary HR statistics only: knows / has / is. No ratings, no performance score, no leave, no time clock, no accounting.</p><div class="heroPills"><span class="badge">Editable categories</span><span class="badge">Editable items</span><span class="badge">Counts only</span><span class="badge">Compact reports</span></div><div class="metricStrip"><div class="metricMini"><b>${staff}</b><span>Staff files</span></div><div class="metricMini"><b>${categories().length}</b><span>Matrix categories</span></div><div class="metricMini"><b>${totalItems()}</b><span>Tracked items</span></div></div></section><section class="card"><div class="cardHeader"><div><h3 class="cardTitle">Smart HR Scope</h3><div class="subtitle">This is not a duplicate of other platforms.</div></div></div><div class="smartNote"><i>✓</i><div><strong>Only compact HR data</strong><span>Employee files, classifications, skills/software yes-no matrix, credentials, degree, discipline, and HR arrangement notes.</span></div></div><div class="miniGrid mt"><div class="miniStat"><div class="n">${tech}</div><div class="l">Skill hits</div></div><div class="miniStat"><div class="n">${soft}</div><div class="l">Software hits</div></div><div class="miniStat"><div class="n">${cred}</div><div class="l">Credential hits</div></div></div></section></div><div class="grid cols4 mt">${kpi('STAAD.Pro',countItem('software','staad'),'people know it')}${kpi('RISA-3D',countItem('software','risa'),'people know it')}${kpi('Revit',countItem('software','revit'),'people know it')}${kpi('Wood / Timber',countItem('technical','timber'),'people know it')}</div><div class="grid cols2 mt">${chartCard('Software Coverage','Number of people who know each software. No ranking levels.',barChart('software',10))}${chartCard('Technical Skills Coverage','Number of people who know each skill. No rating values.',barChart('technical',10))}${chartCard('Degree Distribution','Counts by highest degree.',donutCard('degree'))}${chartCard('Discipline Distribution','Counts by discipline.',donutCard('discipline'))}${chartCard('Credentials / Tags','Counts by credential or tag.',barChart('credentials',10))}${chartCard('Academic Rank','Counts by academic rank.',donutCard('academic'))}</div>`}
function renderPeople(){setTitle('People','Compact employee files. Add, edit, delete, and update yes/no matrix selections.');const q=searchText.toLowerCase();const people=activePeople().filter(p=>!q||[p.name,p.role,itemName('department',singleVal(p,'department')),itemName('discipline',singleVal(p,'discipline')),itemName('degree',singleVal(p,'degree'))].join(' ').toLowerCase().includes(q));$('content').innerHTML=`<div class="toolbar"><div class="field"><label>Search</label><input class="searchInput" value="${esc(searchText)}" oninput="searchText=this.value;renderPeople()" placeholder="Search name, role, department, discipline..."></div><button class="btn primary" onclick="openPersonModal()">＋ Add Employee</button></div><div class="personGrid">${people.map(personCard).join('')||'<div class="empty">No people found</div>'}</div>`}
function initials(name){return String(name||'?').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join('')||'?'}
function selectedMultiNames(p,catId,limit=4){const c=catById(catId);return (c?.items||[]).filter(i=>hasItem(p,catId,i.id)).map(i=>i.name).slice(0,limit)}
function personCard(p){const dept=itemName('department',singleVal(p,'department'));const degree=itemName('degree',singleVal(p,'degree'));const disc=itemName('discipline',singleVal(p,'discipline'));const tech=selectedMultiNames(p,'technical',4);const soft=selectedMultiNames(p,'software',4);return `<section class="personCard"><div class="personTop"><div class="avatar">${esc(initials(p.name))}</div><div><div class="personName">${esc(p.name)}</div><div class="personRole">${esc(p.role)}</div></div></div><div class="tagLine"><span class="badge black">${esc(dept)}</span><span class="badge info">${esc(degree)}</span><span class="badge">${esc(disc)}</span></div><div class="smallMuted">Top selections</div><div class="pillRow">${[...tech,...soft].slice(0,7).map(x=>`<span class="badge">${esc(x)}</span>`).join('')||'<span class="muted small">No selections</span>'}</div><div class="rowActions"><button class="btn small" onclick="openPersonModal('${esc(p.id)}')">Edit</button><button class="btn small danger" onclick="deletePerson('${esc(p.id)}')">Delete</button></div></section>`}
function renderMatrix(){setTitle('Visual Matrix','Counts only. Every category and item is editable; no people names and no skill ratings.');$('content').innerHTML=`<div class="grid cols3">${kpi('Categories',categories().length,'editable')}${kpi('Items',totalItems(),'editable')}${kpi('Employees',activePeople().length,'count basis')}</div><div class="grid cols2 mt">${categories().map(categoryCard).join('')}</div>`}
function categoryCard(c){const rows=categoryRows(c.id);const max=maxCount(rows);return `<section class="card categoryCard"><div class="categoryTitle"><div><h3 class="cardTitle">${esc(c.name)}</h3><div class="subtitle">${c.kind==='single'?'One selection per employee':'Yes / no selections'} · ${esc(c.verb||'Count')}</div></div><div class="rowActions"><button class="btn small" onclick="openItemModal('${esc(c.id)}')">＋ Item</button><button class="btn small" onclick="openCategoryModal('${esc(c.id)}')">Edit</button></div></div><div class="itemGrid">${rows.map(r=>`<div class="itemCountCard"><div class="itemTop"><div><div class="itemName">${esc(r.name)}</div><div class="smallMuted">${r.count} of ${activePeople().length} people</div></div><div class="itemBtns"><button class="btn small icon" onclick="openItemModal('${esc(c.id)}','${esc(r.id)}')">✎</button><button class="btn small icon danger" onclick="deleteItem('${esc(c.id)}','${esc(r.id)}')">×</button></div></div><div><span class="countBig">${r.count}</span> <span class="smallMuted">people</span></div><div class="percentLine"><div class="percentFill" style="width:${percent(r.count,max)}%"></div></div></div>`).join('')||'<div class="empty">No items. Add one.</div>'}</div></section>`}
function renderReports(){setTitle('Reports','Compact HR report. The report summarizes each employee without scores or ratings.');const cols=['Name','Role','Department','Discipline','Degree','Academic rank','Technical skills','Software','Credentials','Arrangement note'];$('content').innerHTML=`<div class="grid cols4">${kpi('Staff',activePeople().length,'in report')}${kpi('Software Items',catById('software')?.items?.length||0,'tracked')}${kpi('Technical Items',catById('technical')?.items?.length||0,'tracked')}${kpi('Credentials',catById('credentials')?.items?.length||0,'tracked')}</div><div class="grid cols2 mt">${chartCard('Software Counts','How many people know each software.',barChart('software',12))}${chartCard('Skill Counts','How many people know each technical skill.',barChart('technical',12))}</div><section class="card mt"><div class="cardHeader"><div><h3 class="cardTitle">Compact HR Report</h3><div class="subtitle">Employee profile summary. No payroll, no leave, no time clock, no performance values.</div></div><div class="rowActions"><button class="btn" onclick="exportCSV()">Export CSV</button><button class="btn primary" onclick="window.print()">Print</button></div></div><div class="tableWrap"><table class="table"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${activePeople().map(p=>`<tr>${reportRow(p).map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`}
function reportRow(p){return [p.name,p.role,itemName('department',singleVal(p,'department')),itemName('discipline',singleVal(p,'discipline')),itemName('degree',singleVal(p,'degree')),itemName('academic',singleVal(p,'academic')),selectedMultiNames(p,'technical',99).join('; '),selectedMultiNames(p,'software',99).join('; '),selectedMultiNames(p,'credentials',99).join('; '),p.attendanceNote||'']}
function openPersonModal(id=''){const existing=id?activePeople().find(p=>p.id===id):null;const p=existing?clone(existing):{id:'EMP'+Date.now().toString().slice(-6),name:'',role:'',email:'',phone:'',location:'Mosul',manager:'Atheer Jumaah',join:new Date().toISOString().slice(0,10),attendanceNote:'',selections:{}};categories().forEach(c=>{if(!p.selections)p.selections={};if(c.kind==='multi'&&!p.selections[c.id])p.selections[c.id]={};if(c.kind==='single'&&!p.selections[c.id])p.selections[c.id]=c.items[0]?.id||''});$('modalTitle').textContent=existing?'Edit Employee HR File':'Add Employee HR File';$('modalBody').innerHTML=`<div class="drawerGrid">${field('Name','name',p.name)}${field('Role','role',p.role)}${field('Location','location',p.location)}${field('Manager','manager',p.manager)}${field('Join Date','join',p.join,'date')}${field('Email','email',p.email)}${field('Phone','phone',p.phone)}</div><div class="field"><label>Office / attendance arrangement note only</label><input id="f_attendanceNote" class="input" value="${esc(p.attendanceNote||'')}" placeholder="Example: 3 office days / remote / Saturday suitable"></div>${categories().map(c=>personCategoryInput(c,p)).join('')}`;$('modalFooter').innerHTML=`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="savePerson('${esc(id)}','${esc(p.id)}')">Save</button>`;showModal()}
function field(label,id,value,type='text'){return `<div class="field"><label>${esc(label)}</label><input id="f_${esc(id)}" type="${type}" class="input" value="${esc(value||'')}"></div>`}
function personCategoryInput(c,p){if(c.kind==='single'){return `<div class="field"><label>${esc(c.name)}</label><select id="sel_${esc(c.id)}" class="select">${(c.items||[]).map(i=>`<option value="${esc(i.id)}" ${singleVal(p,c.id)===i.id?'selected':''}>${esc(i.name)}</option>`).join('')}</select></div>`}return `<div class="sectionLabel">${esc(c.name)} — yes / no</div><div class="checkGrid">${(c.items||[]).map(i=>`<label class="checkLine"><input id="chk_${esc(c.id)}_${esc(i.id)}" type="checkbox" ${hasItem(p,c.id,i.id)?'checked':''}>${esc(i.name)}</label>`).join('')||'<div class="empty">No items</div>'}</div>`}
function savePerson(oldId,newId){let p=oldId?state.people.find(x=>x.id===oldId):{id:newId};if(!p)return;['name','role','email','phone','location','manager','join','attendanceNote'].forEach(k=>p[k]=$('f_'+k).value.trim());p.selections=p.selections||{};categories().forEach(c=>{if(c.kind==='single'){p.selections[c.id]=$('sel_'+c.id)?.value||''}else{p.selections[c.id]={};(c.items||[]).forEach(i=>{if($('chk_'+c.id+'_'+i.id)?.checked)p.selections[c.id][i.id]=1})}});if(!oldId)state.people.push(p);save();closeModal();render();toast('Employee saved')}
function deletePerson(id){const p=activePeople().find(x=>x.id===id);if(!p||!confirm('Delete '+p.name+'?'))return;state.people=activePeople().filter(x=>x.id!==id);save();render();toast('Employee deleted')}
function openCategoryModal(id=''){const existing=id?catById(id):null;const c=existing?clone(existing):{id:'',name:'',kind:'multi',verb:'Know',items:[]};$('modalTitle').textContent=existing?'Edit Category':'Add Category';$('modalBody').innerHTML=`<div class="drawerGrid"><div class="field"><label>Category name</label><input id="c_name" class="input" value="${esc(c.name)}" placeholder="Example: Licenses, Languages, Countries"></div><div class="field"><label>Category code</label><input id="c_id" class="input" value="${esc(c.id)}" ${existing?'disabled':''} placeholder="Auto if empty"></div><div class="field"><label>Type</label><select id="c_kind" class="select"><option value="multi" ${c.kind==='multi'?'selected':''}>Multiple yes/no selections</option><option value="single" ${c.kind==='single'?'selected':''}>Single classification per employee</option></select></div><div class="field"><label>Verb</label><input id="c_verb" class="input" value="${esc(c.verb||'Know')}" placeholder="Know / Has / Is / In"></div></div><div class="smartNote"><i>i</i><div><strong>Category is visual statistics only</strong><span>Every item will be counted. No rating, no ranking, no score.</span></div></div>`;$('modalFooter').innerHTML=`<button class="btn" onclick="closeModal()">Cancel</button>${existing?`<button class="btn danger" onclick="deleteCategory('${esc(id)}')">Delete</button>`:''}<button class="btn primary" onclick="saveCategory('${esc(id)}')">Save</button>`;showModal()}
function saveCategory(oldId=''){const name=$('c_name').value.trim();const id=oldId||slug($('c_id').value.trim()||name);const kind=$('c_kind').value;const verb=$('c_verb').value.trim()||'Count';if(!name||!id){toast('Category name is required');return}if(oldId){const c=catById(oldId);if(!c)return;c.name=name;c.kind=kind;c.verb=verb;if(!c.items)c.items=[]}else{if(catById(id)){toast('Category code already exists');return}state.categories.push({id,name,kind,verb,items:[]});state.people.forEach(p=>{p.selections=p.selections||{};p.selections[id]=kind==='single'?'':{}})}save();closeModal();render();toast('Category saved')}
function deleteCategory(id){const c=catById(id);if(!c||!confirm('Delete category '+c.name+'?'))return;state.categories=categories().filter(x=>x.id!==id);state.people.forEach(p=>{if(p.selections)delete p.selections[id]});save();closeModal();render();toast('Category deleted')}
function openItemModal(catId='',itemId=''){const c=catById(catId)||categories()[0];if(!c){toast('Add a category first');return}const it=itemId?(c.items||[]).find(x=>x.id===itemId):null;$('modalTitle').textContent=it?'Edit Matrix Item':'Add Matrix Item';$('modalBody').innerHTML=`<div class="drawerGrid"><div class="field"><label>Category</label><select id="i_cat" class="select" ${it?'disabled':''}>${categories().map(x=>`<option value="${esc(x.id)}" ${x.id===c.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Item name</label><input id="i_name" class="input" value="${esc(it?.name||'')}" placeholder="Example: SAFE, English, PE Texas"></div><div class="field"><label>Item code</label><input id="i_id" class="input" value="${esc(it?.id||'')}" ${it?'disabled':''} placeholder="Auto if empty"></div></div><div class="smartNote"><i>✓</i><div><strong>Counts only</strong><span>This item will appear in charts as number of people who match it. No levels or grades.</span></div></div>`;$('modalFooter').innerHTML=`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveItem('${esc(c.id)}','${esc(itemId)}')">Save</button>`;showModal()}
function saveItem(oldCatId='',oldItemId=''){const catId=oldItemId?oldCatId:$('i_cat').value;const c=catById(catId);if(!c)return;const name=$('i_name').value.trim();const id=oldItemId||slug($('i_id').value.trim()||name);if(!name||!id){toast('Item name is required');return}if(oldItemId){const it=(c.items||[]).find(x=>x.id===oldItemId);if(!it)return;it.name=name}else{if((c.items||[]).some(x=>x.id===id)){toast('Item code already exists');return}c.items.push({id,name})}save();closeModal();render();toast('Item saved')}
function deleteItem(catId,itemId){const c=catById(catId);const it=c?.items?.find(x=>x.id===itemId);if(!c||!it||!confirm('Delete '+it.name+'?'))return;c.items=c.items.filter(x=>x.id!==itemId);state.people.forEach(p=>{if(p.selections){if(c.kind==='multi'&&p.selections[catId])delete p.selections[catId][itemId];if(c.kind==='single'&&p.selections[catId]===itemId)p.selections[catId]=''}});save();render();toast('Item deleted')}
function exportCSV(){const rows=[['Name','Role','Department','Discipline','Degree','Academic Rank','Technical Skills','Software','Credentials','Arrangement Note'],...activePeople().map(reportRow)];const csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');download('larsa_hr_compact_report_v5.csv',csv,'text/csv')}
function exportJSON(){download('larsa_hr_visual_matrix_v5_backup.json',JSON.stringify(state,null,2),'application/json')}
function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function showModal(){$('modalLayer').classList.add('show')}
function closeModal(){$('modalLayer').classList.remove('show')}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;$('toastArea').appendChild(t);setTimeout(()=>t.remove(),2600)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
</script>
</body>
</html>
