      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};

            const ds = new DecompressionStream('gzip');

            const reader = ds.readable.getReader();
            writer.write(bytes);

            while (true) {
              const { done, value } = await reader.read();

              chunks.push(value);

    setStatus('Rendering...');

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

In'?'ok':'danger'}\">${l.status}<\/span><\/td><td>${planMatch(l)}<\/td><\/tr>`).join('')||'<tr><td colspan=\"4\">No activity yet.<\/td><\/tr>'}<\/tbody><\/table><\/div><\/div>\n <\/div>`}\nfunction clockToggle(type){let latest=state.logs.filter(l=>l.uid===currentUser.id).sort((a,b)=>new Date(b.time)-new Date(a.time))[0];let status=(latest&&latest.status==='In')?'Out':'In';state.logs.push({id:'l'+Date.now(),uid:currentUser.id,type,status,time:new Date().toISOString(),active:status==='In',lastSeen:new Date().toISOString()});save();toast(`${status==='In'?'Clocked in':'Clocked out'} · ${type}`);renderClock()}\nfunction plannedHours(uid){let day=ALL_DAYS[new Date().getDay()==0?1:new Date().getDay()+1]||'Monday';let entries=state.schedule[uid]?.[day]||[];return Number(entries.reduce((a,s)=>a+hours(s.start,s.end),0).toFixed(1))}\nfunction actualHours(uid){return Number((state.logs.filter(l=>l.uid===uid).length*2.25).toFixed(1))}\nfunction planMatch(l){return l.type==='Office'?'<span class=\"badge ok\">Office plan checked<\/span>':l.type==='Remote'?'<span class=\"badge info\">Remote work<\/span>':'<span class=\"badge black\">Site work<\/span>'}\nfunction fmt(iso){return new Date(iso).toLocaleString([], {weekday:'short',hour:'2-digit',minute:'2-digit',month:'short',day:'numeric'})}\nfunction renderLive(){let logs=activeLogs();let groups={Office:logs.filter(l=>l.type==='Office'),Remote:logs.filter(l=>l.type==='Remote'),Site:logs.filter(l=>l.type==='Site')};byId('content').innerHTML=`\n <div class=\"grid cols4\">${kpi('Active Total',logs.length,'office + remote + site')}${kpi('Office',groups.Office.length,'inside office')}${kpi('Remote',groups.Remote.length,'online \/ WFH')}${kpi('Site',groups.Site.length,'field')}<\/div>\n <div class=\"card\" style=\"margin-top:16px\"><div class=\"cardHeader\"><h3 class=\"cardTitle\">Live Presence Board<\/h3><span class=\"badge info\">auto-refresh demo<\/span><\/div><div class=\"liveCards\">${logs.map(personCard).join('')||'<div class=\"empty\">No active users.<\/div>'}<\/div><\/div>\n <div class=\"card\" style=\"margin-top:16px\"><div class=\"cardHeader\"><h3 class=\"cardTitle\">Office Coverage by Time<\/h3><span class=\"badge black\">Visual<\/span><\/div>${coverageTimeline()}<\/div>`}\nfunction personCard(l){let u=state.users.find(x=>x.id===l.uid);if(!u)return '';let idle=(Date.now()-new Date(l.lastSeen||l.time).getTime())>45*60000;return `<div class=\"personCard\"><div class=\"personTop\"><div class=\"avatar\">${initials(u.name)}<\/div><div><div class=\"personName\">${esc(u.name)}<\/div><div class=\"personRole\">${esc(u.role)}<\/div><\/div><\/div><div class=\"statusPills\"><span class=\"badge ${l.type==='Office'?'black':l.type==='Remote'?'info':'ok'}\">${l.type}<\/span><span class=\"badge ${idle?'warn':'ok'}\">${idle?'Idle':'Active'}<\/span><span class=\"badge\">${fmt(l.time)}<\/span><\/div><\/div>`}\nfunction coverageTimeline(){let rows=['Saturday','Sunday','Monday','Tuesday','Wednesday','Thursday'].map(d=>{let cells=[];for(let h=9;h<=20;h++){let n=0;state.users.forEach(u=>(state.schedule[u.id]?.[d]||[]).forEach(s=>{let [a,b]=[toMin(s.start),toMin(s.end)];if(h*60>=a&&h*60<b)n++}));cells.push(`<div class=\"timeCell ${n>=7?'on':n>=4?'remote':''}\" title=\"${d} ${h}:00 · ${n} employees\"><\/div>`)}return `<div class=\"timeLabel\">${d}<\/div>${cells.join('')}`}).join('');return `<div class=\"timeline\"><div><\/div>${Array.from({length:12},(_,i)=>`<div class=\"timeLabel\">${i+9}<\/div>`).join('')}${rows}<\/div>`}\nfunction renderSchedule(){byId('content').innerHTML=`\n <div class=\"card\"><div class=\"cardHeader\"><h3 class=\"cardTitle\">Shift Builder Palette<\/h3><div class=\"rowActions\"><button class=\"btn small\" onclick=\"openShiftModal()\">Add Shift<\/button><button class=\"btn small info\" onclick=\"autoSchedule()\">Auto Schedule<\/button><\/div><\/div><div class=\"palette\">${state.shifts.map(shiftToken).join('')}<\/div><\/div>\n <div class=\"card\" style=\"margin-top:16px\"><div class=\"cardHeader\"><h3 class=\"cardTitle\">Office Attendance Weekly Schedule<\/h3><span class=\"badge black\">Saturday to Thursday<\/span><\/div>${scheduleGrid()}<\/div>`}\nfunction shiftToken(s){return `<div class=\"shiftToken\" draggable=\"true\" ondragstart=\"dragShift(event,'${s.id}')\" style=\"background:${s.bg};color:${s.text}\"><div><b>${esc(s.code)} · ${esc(s.name)}<\/b><small>${esc(s.dayTag||'Any')} · ${s.start}–${s.end}<\/small><\/div><div class=\"rowActions\"><button class=\"btn small\" onclick=\"openShiftModal('${s.id}')\">Edit<\/button><button class=\"btn small danger\" onclick=\"openDelete('Delete shift?', 'This removes the shift from the palette and weekly schedule.', ()=>deleteShift('${s.id}'))\">Delete<\/button><\/div><\/div>`}\nfunction scheduleGrid(){let html='<div class=\"scheduleGrid\"><div class=\"schedHead\">Engineer<\/div>'+OFFICE_DAYS.map(d=>`<div class=\"schedHead\">${d}<\/div>`).join('');state.users.filter(u=>u.enabled).slice(0,22).forEach(u=>{html+=`<div class=\"nameCell\">${esc(u.name)}<small>${esc(u.department)} · ${esc(u.role)}<\/small><\/div>`;OFFICE_DAYS.forEach(d=>{html+=`<div class=\"dayCell\"><div class=\"dropzone\" ondragover=\"event.preventDefault();this.classList.add('dragOver')\" ondragleave=\"this.classList.remove('dragOver')\" ondrop=\"dropShift(event,'${u.id}','${d}')\">${(state.schedule[u.id]?.[d]||[]).map(s=>schedShift(u.id,d,s)).join('')}<\/div><\/div>`})});return html+'<\/div>'}\nfunction schedShift(uid,day,s){return `<div class=\"scheduledShift\" style=\"background:${s.bg};color:${s.text}\"><span>${esc(s.code)} <small>${s.start}–${s.end}<\/small><\/span><button class=\"x\" onclick=\"removeScheduled('${uid}','${day}','${s.instance}')\">×<\/button><\/div>`}\nfunction dragShift(ev,id){ev.dataTransfer.setData('shift',id)}\nfunction dropShift(ev,uid,day){ev.preventDefault();ev.currentTarget.classList.remove('dragOver');let sid=ev.dataTransfer.getData('shift');let s=state.shifts.find(x=>x.id===sid);if(!s)return;if(s.dayTag&&s.dayTag!=='Any'&&s.dayTag!==day)return toast(`${s.name} is tagged for ${s.dayTag}.`);let u=state.users.find(x=>x.id===uid);let conflict=(u.constraints||[]).some(c=>(c.day==='Any'||c.day===day)&&c.type==='Unavailable'&&overlap(c.from,c.to,s.start,s.end));if(conflict){toast(`${u.name} has an unavailable constraint for this time. Manual override still allowed.`)}state.schedule[uid][day].push({...s,instance:'i'+Date.now()+Math.random()});save();renderSchedule()}\nfunction removeScheduled(uid,day,instance){state.schedule[uid][day]=state.schedule[uid][day].filter(s=>s.instance!==instance);save();renderSchedule()}\nfunction deleteShift(id){state.shifts=state.shifts.filter(s=>s.id!==id);Object.values(state.schedule).forEach(days=>Object.keys(days).forEach(d=>days[d]=days[d].filter(s=>s.id!==id)));save();closeModal();render()}\nfunction autoSchedule(){let ids=state.users.filter(u=>u.enabled).slice(0,14).map(u=>u.id);OFFICE_DAYS.forEach((d,i)=>ids.slice(i,i+7).forEach((uid,j)=>{if(!(state.schedule[uid][d]||[]).length){let s=state.shifts[(i+j)%3];state.schedule[uid][d].push({...s,instance:'i'+Date.now()+Math.random()})}}));save();toast('Auto schedule created with current constraints checked.');render()}\nfunction approveWeek(){toast('Weekly office schedule approved. Notification demo queued.');}\nfunction renderPerformance(){let rows=filteredPerf();let byEmp=groupSum(rows,'Engineer','Approved Points'),byType=groupSum(rows,'Work Category','Approved Points'),byDept=groupSum(rows,'Department','Approved Points');byId('content').innerHTML=`\n <div class=\"card\"><div class=\"cardHeader\"><h3 class=\"cardTitle\">Performance Filters<\/h3><button class=\"btn small\" onclick=\"resetPerfFilters()\">Reset<\/button><\/div><div class=\"grid cols5\"><div class=\"field\"><label>Employee<\/label><select class=\"select\" id=\"pfEmp\" onchange=\"sessionStorage.pfEmp=this.value;renderPerformance()\"><option value=\"All\">All Employees<\/option>${state.users.map(u=>`<option ${sessionStorage.pfEmp===u.name?'se ">${Object.keys(byType).slice(0,6).map((k,i)=>`<span><i class=\"swatch\" style=\"background:var(--chart${(i%5)+1})\"><\/i>${esc(k)}<\/span>`).join('')}<\/div><\/div><div class=\"card\"><div class=\"cardHeader\"><h3 class=\"cardTitle\">By Department<\/h3><span class=\"badge black\">Bar<\/span><\/div>${barChart(byDept,230)}<\/div><\/div>\n <div class=\"card\" style=\"margin-top:16px\"><div class=\"cardHeader\"><h3 class=\"cardTitle\">Employee Performance Sheet<\/h3><div class=\"rowActions\"><button class=\"btn small\" onclick=\"openPerfRowModal()\">Add Row<\/button><button class=\"btn small\" onclick=\"openColumnModal()\">Add Column<\/button><\/div><\/div><div class=\"tableWrap\"><table class=\"table\"><thead><tr>${state.columns.map(c=>`<th>${esc(c)}<\/th>`).join('')}<th>Actions<\/th><\/tr><\/thead><tbody>${rows.map(r=>perfRow(r)).join('')||'<tr><td colspan=\"99\">No performance rows.<\/td><\/tr>'}<\/tbody><\/table><\/div><\/div>`;persistPerfFilters()}\nfunction persistPerfFilters(){['pfEmp','pfDept','pfStatus','pfSearch'].forEach(id=>{let el=byId(id);if(el)sessionStorage[id]=el.value})}\nfunction filteredPerf(){let emp=sessionStorage.pfEmp||'All',dept=sessionStorage.pfDept||'All',stat=sessionStorage.pfStatus||'All',search=(sessionStorage.pfSearch||'').toLowerCase();return state.performance.filter(r=>(emp==='All'||r.Engineer===emp)&&(dept==='All'||r.Department===dept)&&(stat==='All'||r.Status===stat)&&(!search||JSON.stringify(r).toLowerCase().includes(search)))}\nfunction perfRow(r){return `<tr>${state.columns.map(c=>`<td>${esc(r[c])}<\/td>`).join('')}<td><div class=\"rowActions\"><button class=\"btn small\" onclick=\"openPerfRowModal('${r.id}')\">Edit<\/button><button class=\"btn small ok\" onclick=\"approvePerf('${r.id}')\">Approve<\/button><button class=\"btn small danger\" onclick=\"openDelete('Delete performance row?', 'This row will be removed from the sheet.', ()=>deletePerf('${r.id}'))\">Delete<\/button><\/div><\/td><\/tr>`}\nfunction approvePerf(id){let r=state.performance.find(x=>x.id===id);if(r){r.Status='Approved';r['Approved Points']=Number(r['Submitted Points'])||Number(r['Estimated Points'])||0;save();renderPerformance()}}\nfunction deletePerf(id){state.performance=state.performance.filter(r=>r.id!==id);save();closeModal();renderPerformance()}\nfunction sumRows(rows,key){return rows.reduce((a,r)=>a+(Number(r[key])||0),0)}\nfunction percent(a,b){return b?Math.round(a\/b*100):0}\nfunction pieFromObj(obj){let colors=['var(--chart1)','var(--chart2)','var(--chart3)','var(--chart4)','var(--chart5)'];return pieGradient(Object.values(obj).map((v,i)=>({v,c:colors[i%colors.length]})))}\nfunction unique(a){return [...new Set(a.filter(Boolean))]}\nfunction opts(arr,selected){return arr.map(x=>`<option ${selected===x?'selected':''}>${esc(x)}<\/option>`).join('')}\nfunction resetPerfFilters(){['pfEmp','pfDept','pfStatus','pfSearch'].forEach(k=>sessionStorage.removeItem(k));renderPerformance()}\nfunction renderApprovals(){byId('content').innerHTML=`\n <div class=\"grid cols2\">\n  <div class=\"card\"><div class=\"cardHeader\"><h3 class=\"cardTitle\">Approval Queue<\/h3><span class=\"badge warn\">${pendingRequests().length} pending<\/span><\/div><div class=\"grid\">${state.approvals.map(requestCard).join('')||'<div class=\"empty\">No requests.<\/div>'}<\/div><\/div>\n  <div class=\"card\"><div class=\"cardHeader\"><h3 class=\"cardTitle\">Approval Flow Setup<\/h3><button class=\"btn small\" onclick=\"saveFlowFromForm()\">Save Flow<\/button><\/div>${flowEditor()}<\/div>\n <\/div>`}\nfunction miniRequest(r){return `<div class=\"requestCard\"><div><b>${esc(r.type)}<\/b> · ${esc(nameOf(r.uid))}<\/div><div class=\"subtitle\">${esc(r.requestType)} · ${esc(r.date)} ${r.from?esc(r.from+'–'+r.to):''}<\/div><div>${esc(r.reason)}<\/div><div>${flowHtml(r)}<\/div><\/div>`}\nfunction requestCard(r){return `<div class=\"requestCard\"><div class=\"cardHeader\"><h3 class=\"cardTitle\">${esc(r.type)} · ${esc(nameOf(r.uid))}<\/h3><span class=\"badge button class=\"btn primary\" onclick=\"saveColumn()\">Add Column<\/button>`)}\nfunction saveColumn(){let c=val('newCol').trim();if(!c)return;if(!state.columns.includes(c))state.columns.push(c);state.performance.forEach(r=>{if(!(c in r))r[c]=''});save();closeModal();renderPerformance()}\nfunction submitPerformance(){state.performance.filter(r=>r.uid===currentUser.id||r.Engineer===currentUser.name).forEach(r=>{if(r.Status==='Draft')r.Status='Submitted'});let flow=state.flowConfig[currentUser.id]?.Performance||['u1'];state.approvals.unshift(request('r'+Date.now(),'Performance',currentUser.id,'Week',new Date().toISOString().slice(0,10),'','','Weekly performance points submitted','Pending',flow,0));save();toast('Weekly points submitted for approval.');renderPerformance()}\nfunction safe(c){return c.replace(\/\\W\/g,'_')}\nfunction sendNotifications(){toast('Notification demo: app and email reminders queued for alerts and pending approvals.')}\nfunction downloadBackup(){download('larsa_staff_control_backup.json',JSON.stringify(state,null,2),'application\/json')}\nfunction restoreBackup(ev){let file=ev.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{state=JSON.parse(reader.result);save();toast('Backup restored.');render()}catch(e){toast('Invalid backup file.')}};reader.readAsText(file)}\nfunction downloadCSV(type){let rows=[];if(type==='performance')rows=state.performance;if(type==='attendance')rows=state.logs.map(l=>({Employee:nameOf(l.uid),Type:l.type,Status:l.status,Time:l.time}));if(type==='schedule'){state.users.forEach(u=>OFFICE_DAYS.forEach(d=>(state.schedule[u.id]?.[d]||[]).forEach(s=>rows.push({Employee:u.name,Day:d,Shift:s.name,Code:s.code,Start:s.start,End:s.end}))))}download(`larsa_${type}.csv`,toCSV(rows),'text\/csv')}\nfunction exportCurrentReportCSV(){downloadCSV('performance')}\nfunction download(name,content,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}\nfunction toCSV(rows){if(!rows.length)return '';let cols=[...new Set(rows.flatMap(r=>Object.keys(r)))];return [cols.join(','),...rows.map(r=>cols.map(c=>`\"${String(r[c]??'').replace(\/\"\/g,'\"\"')}\"`).join(','))].join('\\n')}\nfunction importCSVText(){let txt=val('csvPaste');if(!txt.trim())return toast('Paste CSV first.');let rows=parseCSV(txt);if(!rows.length)return toast('No rows found.');let cols=Object.keys(rows[0]);cols.forEach(c=>{if(!state.columns.includes(c))state.columns.push(c)});rows.forEach(r=>{r.id='p'+Date.now()+Math.random();r.uid=state.users.find(u=>u.name===r.Engineer)?.id||'';state.performance.push(r)});save();toast(`${rows.length} performance rows imported with all columns preserved.`);renderBackup()}\nfunction parseCSV(txt){let lines=txt.trim().split(\/\\r?\\n\/);let headers=lines.shift().split(',').map(x=>x.replace(\/^\"|\"$\/g,''));return lines.map(line=>{let vals=line.match(\/(\"([^\"]|\"\")*\"|[^,]*)\/g).filter((_,i)=>i%2===0).map(v=>v.replace(\/^\"|\"$\/g,'').replace(\/\"\"\/g,'\"'));let o={};headers.forEach((h,i)=>o[h]=vals[i]||'');return o})}\nfunction toMin(t){let [h,m]=String(t).split(':').map(Number);return h*60+(m||0)}\nfunction hours(a,b){return Math.max(0,(toMin(b)-toMin(a))\/60)}\nfunction overlap(a,b,c,d){return Math.max(toMin(a),toMin(c))<Math.min(toMin(b),toMin(d))}\nbyId('modalLayer').addEventListener('click',e=>{if(e.target.id==='modalLayer')closeModal()});\nsetInterval(()=>{if(!currentUser||activePage!=='live')return;state.logs.forEach(l=>{if(l.status==='In'&&Math.random()>.72)l.lastSeen=new Date().toISOString()});save();renderLive()},15000);\n\n\n\/* ================================================================\n   LARSA STAFF CONTROL — v9 ENHANCEMENT LAYER (purely additive)\n   Wraps the existing render pipeline. No original code removed.\n   Namespaced under LX to avoid collisions.\n   ================================================================ *\/\n(function(){\n'use strict';\nconst LX = window.LX = {};\n\n\/* ---------------- small utilities ---------------- *\/\nconst $ = s => document.querySelector(s);\nconst enabledUsers = () => state.users.filter(u=>u.enabled);\nfunction ago(iso){\n  const s=(Date.now()-new Date(iso).getTime())\/1000;\n  if(s<45) return 'just now';\n  const m=s\/60; if(m<60) return Math.round(m)+'m ago';\n  const h=m\/60; if(h<24) return Math.round(h)+'h ago';\n  return Math.round(h\/24)+'d ago';\n}\nfunction todayName(){ const map=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']; return map[new Date().getDay()]; }\nfunction num(v){ return Number(v)||0; }\n\n\/* sparkline (inline svg) *\/\nfunction spark(vals,w=130,h=38){\n  if(!vals||!vals.length) vals=[0,0];\n  const max=Math.max(1,...vals), min=Math.min(...vals), rng=(max-min)||1;\n  const pts=vals.map((v,i)=>{\n    const x=(i\/((vals.length-1)||1))*(w-6)+3;\n    const y=h-5-((v-min)\/rng)*(h-10);\n    return x.toFixed(1)+','+y.toFixed(1);\n  });\n  const area=`M3,${h} L`+pts.join(' L')+` L${w-3},${h} Z`;\n  const line='M'+pts.join(' L');\n  const last=pts[pts.length-1].split(',');\n  const gid='lg'+Math.random().toString(36).slice(2,7);\n  return `<svg class=\"spark\" viewBox=\"0 0 ${w} ${h}\" width=\"${w}\" height=\"${h}\" preserveAspectRatio=\"none\">\n    <defs><linearGradient id=\"${gid}\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\">\n      <stop offset=\"0\" stop-color=\"var(--chart1)\" stop-opacity=\".22\"\/>\n      <stop offset=\"1\" stop-color=\"var(--chart1)\" stop-opacity=\"0\"\/><\/linearGradient><\/defs>\n    <path d=\"${area}\" fill=\"url(#${gid})\"\/>\n    <path d=\"${line}\" fill=\"none\" stroke=\"var(--chart1)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\/>\n    <circle cx=\"${last[0]}\" cy=\"${last[1]}\" r=\"2.8\" fill=\"var(--chart1)\"\/><\/svg>`;\n}\n\n\/* progress ring *\/\nfunction ring(pct,big,sub){\n  pct=Math.max(0,Math.min(100,pct));\n  const r=54,c=2*Math.PI*r,off=c*(1-pct\/100);\n  return `<div class=\"ringWrap\"><svg viewBox=\"0 0 130 130\" class=\"ringSvg\">\n    <circle cx=\"65\" cy=\"65\" r=\"${r}\" fill=\"none\" stroke=\"var(--ring-track)\" stroke-width=\"13\"\/>\n    <circle cx=\"65\" cy=\"65\" r=\"${r}\" fill=\"none\" stroke=\"var(--chart1)\" stroke-width=\"13\"\n      stroke-linecap=\"round\" stroke-dasharray=\"${c.toFixed(1)}\" stroke-dashoffset=\"${off.toFixed(1)}\"\n      transform=\"rotate(-90 65 65)\"\/>\n    <text x=\"65\" y=\"61\" text-anchor=\"middle\" class=\"ringVal\">${big}<\/text>\n    <text x=\"65\" y=\"84\" text-anchor=\"middle\" class=\"ringSub\">${esc(sub||'')}<\/text><\/svg><\/div>`;\n}\n\n\/* donut from {label:{v,c}} entries *\/\nfunction donut(parts,centerBig,centerSub){\n  const total=parts.reduce((a,p)=>a+p.v,0)||1; let cur=0;\n  const stops=parts.map(p=>{const a=cur\/total*100;cur+=p.v;const b=cur\/total*100;return `${p.c} ${a}% ${b}%`}).join(',');\n  const legend=parts.map(p=>`<div class=\"row\"><i style=\"background:${p.c}\"><\/i>${esc(p.label)}<b>${p.v}<\/b><\/div>`).join('');\n  return `<div class=\"lx-donutRow\">\n    <div class=\"lx-donut\" style=\"background:conic-gradient(${stops})\">\n      <div class=\"lx-donutCenter\"><b>${centerBig}<\/b><span>${esc(centerSub||'')}<\/span><\/div><\/div>\n    <div class=\"lx-legendV\">${legend}<\/div><\/div>`;\n}\n\nconst CH=['var(--chart1)','var(--chart2)','var(--chart3)','var(--chart4)','var(--chart5)'];\n\n\/* count-up animation for numeric KPI values *\/\nfunction countUp(scope){\n  (scope||document).querySelectorAll('.kpi .value').forEach(el=>{\n    if(el.dataset.lxc) return;\n    const raw=el.textContent.trim();\n    if(!\/^-?\\d+$\/.test(raw)) return;\n    el.dataset.lxc='1';\n    const end=+raw; const start=performance.now(), dur=520;\n    (function tick(t){\n      const p=Math.min(1,(t-start)\/dur);\n      el.textContent=Math.round(end*(1-Math.pow(1-p,3)));\n      if(p<1) requestAnimationFrame(tick);\n    })(performance.now());\n  });\n}\n\n\/* append a card block into #content *\/\nfunction push(html){\n  const c=$('#content'); if(c) c.insertAdjacentHTML('beforeend',html);\n}\n\n\/* ================================================================\n   1. PERSISTENT CHROME  (live clock, notification bell, palette)\n   ================================================================ *\/\nfunction injectChrome(){\n  const bar=$('.topbar');\n  if(bar && !$('#lxClock')){\n    const clock=document.createElement('div');\n    clock.className='lx-clock'; clock.id='lxClock';\n    const actions=$('#actions');\n    bar.insertBefore(clock, actions);\n    tickClock();\n    if(!window.__lxClockInt) window.__lxClockInt=setInterval(tickClock,1000);\n  }\n  \/\/ notification bell lives inside the actions row start\n  const act=$('#actions');\n  if(act && !$('#lxBell')){\n    const b=document.createElement('button');\n    b.id='lxBell'; b.className='lx-bell'; b.title='Activity & alerts';\n    b.innerHTML='<span>◔<\/span><span class=\"lx-bellCount\" id=\"lxBellCount\" style=\"display:none\">0<\/span>';\n    b.onclick=openDrawer;\n    act.insertBefore(b, act.firstChild);\n  }\n  refreshBell();\n  buildDrawer();\n  buildPalette();\n}\nfunction tickClock(){\n  const el=$('#lxClock'); if(!el) return;\n  const d=new Date();\n  const t=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});\n  const day=d.toLocaleDateString([], {weekday:'long',month:'short',day:'numeric'});\n  el.innerHTML=`<b>${t}<\/b><span>${day}<\/span>`;\n}\nfunction refreshBell(){\n  const c=$('#lxBellCount'); if(!c) return;\n  const n=pendingRequests().length + usageAlerts().length;\n  if(n>0){ c.textContent=n; c.style.display='grid'; } else c.style.display='none';\n}\n\n\/* ---- activity drawer ---- *\/\nfunction buildDrawer(){\n  if($('#lxDrawer')) return;\n  const scrim=document.createElement('div'); scrim.className='lx-scrim'; scrim.id='lxScrim'; scrim.onclick=closeDrawer;\n  const d=document.createElement('aside'); d.className='lx-drawer'; d.id='lxDrawer';\n  d.innerHTML=`<div class=\"lx-drawerHead\"><h3>Activity Center<\/h3>\n      <button class=\"closeX\" onclick=\"LX.closeDrawer()\">×<\/button><\/div>\n      <div class=\"lx-drawerBody\" id=\"lxDrawerBody\"><\/div>`;\n  document.body.appendChild(scrim); document.body.appendChild(d);\n}\nfunction openDrawer(){\n  const body=$('#lxDrawerBody'); if(!body) return;\n  const pend=pendingRequests(), alerts=usageAlerts();\n  const logs=state.logs.slice().sort((a,b)=>new Date(b.time)-new Date(a.time)).slice(0,8);\n  let html='';\n  html+=`<div><div class=\"lx-sectionTitle\" style=\"margin-top:0\">Pending Approvals <span class=\"lx-pill\">${pend.length}<\/span><\/div>`;\n  html+= pend.length ? pend.map(r=>`<div class=\"lx-miniAlert\"><div class=\"lx-mi\">◷<\/div>\n      <div><b>${esc(r.type)}<\/b> · ${esc(nameOf(r.uid))}<br><span class=\"lx-feedMeta\">${esc(r.requestType||'')} · ${esc(r.date||'')}<\/span><\/div><\/div>`).join('')\n      : `<div class=\"empty\">Nothing awaiting approval.<\/div>`;\n  html+=`<\/div>`;\n  html+=`<div><div class=\"lx-sectionTitle\">Usage Alerts <span class=\"lx-pill\">${alerts.length}<\/span><\/div>`;\n  html+= alerts.length ? alerts.map(a=>`<div class=\"lx-miniAlert\"><div class=\"lx-mi\">⚠<\/div><div>${esc(a)}<\/div><\/div>`).join('')\n      : `<div class=\"empty\">No usage alerts.<\/div>`;\n  html+=`<\/div>`;\n  html+=`<div><div class=\"lx-sectionTitle\">Recent Clock Activity<\/div><div class=\"lx-feed\">`;\n  html+= logs.map(l=>{\n    const cls=l.status==='In'?'in':'out';\n    return `<div class=\"lx-feedItem\"><div class=\"lx-feedDot ${cls}\">${l.status==='In'?'▲':'▼'}<\/div>\n      <div class=\"lx-feedBody\"><b>${esc(nameOf(l.uid))}<\/b> ${l.status==='In'?'clocked in':'clocked out'}\n      <div class=\"lx-feedMeta\">${esc(l.type)}<\/div><\/div><div class=\"lx-feedTime\">${ago(l.time)}<\/div><\/div>`;\n  }).join('') || `<div class=\"empty\">No activity.<\/div>`;\n  html+=`<\/div><\/div>`;\n  body.innerHTML=html;\n  $('#lxDrawer').classList.add('open'); $('#lxScrim').classList.add('open');\n}\nfunction closeDrawer(){ $('#lxDrawer')?.classList.remove('open'); $('#lxScrim')?.classList.remove('open'); }\nLX.closeDrawer=closeDrawer;\n\n\/* ---- command palette ---- *\/\nfunction buildPalette(){\n  if($('#lxCmdk')) return;\n  const p=document.createElement('div'); p.className='lx-cmdk'; p.id='lxCmdk';\n  p.innerHTML=`<div class=\"lx-cmdkBox\">\n      <input class=\"lx-cmdkInput\" id=\"lxCmdkInput\" placeholder=\"Search pages and actions…\" autocomplete=\"off\">\n      <div class=\"lx-cmdkList\" id=\"lxCmdkList\"><\/div>\n      <div class=\"lx-cmdkFoot\"><span><kbd>↑<\/kbd><kbd>↓<\/kbd> navigate<\/span><span><kbd>↵<\/kbd> open<\/span><span><kbd>esc<\/kbd> close<\/span><\/div>\n    <\/div>`;\n  p.onclick=e=>{ if(e.target===p) closePalette(); };\n  document.body.appendChild(p);\n  $('#lxCmdkInput').addEventListener('input',renderPalette);\n  $('#lxCmdkInput').addEventListener('keydown',paletteKeys);\n}\nlet paletteSel=0, paletteItems=[];\nfunction paletteCommands(){\n  const cmds=[];\n  (typeof pages!=='undefined'?pages:[]).forEach(([id,title,desc,perm],i)=>{\n    if(has(perm)) cmds.push({icon:['▦','◷','●','▤','◫','⇄','♙','☑','▣','⇅'][i]||'◆',title, sub:desc, run:()=>{activePage=id;$('#sidebar')?.classList.remove('open');render();}});\n  });\n  cmds.push({icon:'◐',title:'Toggle Day \/ Night',sub:'Switch theme',run:()=>toggleMode()});\n  if(has('Backup Manage')) cmds.push({icon:'⇓',title:'Download Backup',sub:'Full JSON export',run:()=>downloadBackup()});\n  if(has('Send Notifications')) cmds.push({icon:'✉',title:'Send Notifications',sub:'Queue reminders',run:()=>sendNotifications()});\n  cmds.push({icon:'⎋',title:'Log Out',sub:'End session',run:()=>logout()});\n  return cmds;\n}\nfunction renderPalette(){\n  const q=($('#lxCmdkInput')?.value||'').toLowerCase().trim();\n  paletteItems=paletteCommands().filter(c=>!q||(c.title+' '+c.sub).toLowerCase().includes(q));\n  paletteSel=0;\n  const list=$('#lxCmdkList');\n  list.innerHTML=paletteItems.map((c,i)=>`<div class=\"lx-cmdkItem ${i===0?'sel':''}\" data-i=\"${i}\">\n      <span class=\"k\">${c.icon}<\/span><div>${esc(c.title)}<small>${esc(c.sub)}<\/small><\/div><\/div>`).join('')\n      || `<div class=\"empty\" style=\"margin:6px\">No matches.<\/div>`;\n  list.querySelectorAll('.lx-cmdkItem').forEach(el=>{\n    el.onclick=()=>runPalette(+el.dataset.i);\n    el.onmousemove=()=>{ paletteSel=+el.dataset.i; markSel(); };\n  });\n}\nfunction markSel(){ $('#lxCmdkList')?.querySelectorAll('.lx-cmdkItem').forEach((el,i)=>el.classList.toggle('sel',i===paletteSel)); }\nfunction paletteKeys(e){\n  if(e.key==='ArrowDown'){e.preventDefault();paletteSel=Math.min(paletteItems.length-1,paletteSel+1);markSel();scrollSel();}\n  else if(e.key==='ArrowUp'){e.preventDefault();paletteSel=Math.max(0,paletteSel-1);markSel();scrollSel();}\n  else if(e.key==='Enter'){e.preventDefault();runPalette(paletteSel);}\n  else if(e.key==='Escape'){closePalette();}\n}\nfunction scrollSel(){ $('#lxCmdkList')?.querySelectorAll('.lx-cmdkItem')[paletteSel]?.scrollIntoView({block:'nearest'}); }\nfunction runPalette(i){ const c=paletteItems[i]; if(c){ closePalette(); c.run(); } }\nfunction openPalette(){ if(!currentUser) return; $('#lxCmdk')?.classList.add('open'); const inp=$('#lxCmdkInput'); if(inp){inp.value='';renderPalette();setTimeout(()=>inp.focus(),30);} }\nfunction closePalette(){ $('#lxCmdk')?.classList.remove('open'); }\ndocument.addEventListener('keydown',e=>{\n  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); const open=$('#lxCmdk')?.classList.contains('open'); open?closePalette():openPalette(); }\n  else if(e.key==='Escape'){ closePalette(); closeDrawer(); }\n});\n\n\/* ================================================================\n   2. ENHANCED TOAST (typed, with icon)\n   ================================================================ *\/\nconst _toast=window.toast;\nwindow.toast=function(msg){\n  try{\n    const d=document.createElement('div');\n    const s=String(msg).toLowerCase();\n    let type='', icon='●';\n    if(\/invalid|not found|error|fail|cannot|no rows|first\/.test(s)){type='err';icon='!';}\n    else if(\/warn|alert|override|unavailable|queued|demo\/.test(s)){type='warn';icon='⚠';}\n    else if(\/approved|submitted|saved|restored|created|imported|clocked|success\/.test(s)){type='ok';icon='✓';}\n    d.className='toast '+type;\n    d.innerHTML=`<span class=\"lx-tIcon\">${icon}<\/span><span>${esc(msg)}<\/span>`;\n    $('#toastArea').appendChild(d);\n    setTimeout(()=>{d.style.opacity='0';d.style.transform='translateY(6px)';setTimeout(()=>d.remove(),260);},3200);\n  }catch(e){ _toast(msg); }\n};\n\n\/* ================================================================\n   3. DATA HELPERS for the new widgets\n   ================================================================ *\/\nfunction scheduledPerDay(){\n  return OFFICE_DAYS.map(d=>{\n    let n=0; enabledUsers().forEach(u=>{ n+=(state.schedule[u.id]?.[d]||[]).length; });\n    return {day:d, n};\n  });\n}\nfunction presenceRhythm(){ \/\/ clock-ins bucketed by hour of day\n  const buckets=new Array(12).fill(0); \/\/ 9..20\n  state.logs.forEach(l=>{ if(l.status!=='In')return; const h=new Date(l.time).getHours(); if(h>=9&&h<=20) buckets[h-9]++; });\n  return buckets;\n}\nfunction attendanceRate(){\n  const present=activeLogs().length, team=enabledUsers().length||1;\n  return Math.round(present\/team*100);\n}\n\n\/* ================================================================\n   4. PER-PAGE ENHANCERS  (all append below existing content)\n   ================================================================ *\/\n\n\/* --- DASHBOARD --- *\/\nfunction enhDashboard(){\n  const perDay=scheduledPerDay();\n  const maxDay=Math.max(1,...perDay.map(d=>d.n));\n  const tday=todayName();\n  const weekStrip=`<div class=\"lx-weekStrip\">${perDay.map(d=>`\n    <div class=\"lx-dayCol ${d.day===tday?'lx-today':''}\">\n      <div class=\"lx-dayName\">${d.day.slice(0,3)}<\/div>\n      <div class=\"lx-dayBarTrack\"><div class=\"lx-dayBar\" style=\"height:${Math.round(d.n\/maxDay*100)}%\"><\/div><\/div>\n      <div class=\"lx-dayCount\">${d.n}<\/div>\n    <\/div>`).join('')}<\/div>`;\n\n  const rhythm=presenceRhythm();\n  const rate=attendanceRate();\n\n  const logs=state.logs.slice().sort((a,b)=>new Date(b.time)-new Date(a.time)).slice(0,7);\n  const feed=logs.map(l=>{\n    const cls=l.status==='In'?'in':'out';\n    return `<div class=\"lx-feedItem\"><div class=\"lx-feedDot ${cls}\">${l.status==='In'?'▲':'▼'}<\/div>\n      <div class=\"lx-feedBody\"><b>${esc(nameOf(l.uid))}<\/b> ${l.status==='In'?'clocked in':'clocked out'}\n      <div class=\"lx-feedMeta\">${esc(l.type)} presence<\/div><\/div>\n      <div class=\"lx-feedTime\">${ago(l.time)}<\/div><\/div>`;\n  }).join('')||'<div class=\"empty\">No recent activity.<\/div>';\n\n  push(`<div class=\"lx-sectionTitle\">Week &amp; Rhythm <span class=\"lx-pill\">Saturday → Thursday<\/span><\/div>\n  <div class=\"grid cols3\">\n    <div class=\"card\" style=\"grid-column:span 2\">\n      <div class=\"cardHeader\"><h3 class=\"cardTitle\">Scheduled Presence by Day<\/h3><span class=\"badge black\">Headcount<\/span><\/div>\n      ${weekStrip}\n    <\/div>\n    <div class=\"card lx-sparkCard\" style=\"align-items:stretch;flex-direction:column;gap:10px\">\n      <div class=\"cardHeader\" style=\"margin:0\"><h3 class=\"cardTitle\">Today Present<\/h3><span class=\"badge ${rate>=60?'ok':rate>=30?'warn':'danger'}\">${rate}%<\/span><\/div>\n      ${ring(rate, rate+'%', 'of team')}\n    <\/div>\n  <\/div>\n\n  <div class=\"grid cols2\" style=\"margin-top:16px\">\n    <div class=\"card\">\n      <div class=\"cardHeader\"><h3 class=\"cardTitle\">Clock-in Rhythm<\/h3><span class=\"badge black\">09:00 → 20:00<\/span><\/div>\n      <div class=\"lx-sparkCard\">${spark(rhythm,320,90)}<\/div>\n      <div class=\"subtitle\" style=\"margin-top:8px\">Distribution of clock-ins across the working day.<\/div>\n    <\/div>\n    <div class=\"card\">\n      <div class=\"cardHeader\"><h3 class=\"cardTitle\">Activity Feed<\/h3><button class=\"btn small\" onclick=\"LX.openDrawer()\">Open Activity Center<\/button><\/div>\n      <div class=\"lx-feed\">${feed}<\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"lx-sectionTitle\">Office Coverage Heatmap<\/div>\n  <div class=\"card\">${heatmapBlock()}<\/div>`);\n}\n\n\/* attendance heatmap block (day × hour) *\/\nfunction heatmapBlock(){\n  const hours=[]; for(let h=9;h<=20;h++) hours.push(h);\n  let peak={n:-1,d:'',h:0};\n  const axis=`<div class=\"lx-heatAxis\"><span><\/span>${hours.map(h=>`<span>${h}<\/span>`).join('')}<\/div>`;\n  const rows=OFFICE_DAYS.map(d=>{\n    const cells=hours.map(h=>{\n      let n=0; state.users.forEach(u=>(state.schedule[u.id]?.[d]||[]).forEach(s=>{ if(h*60>=toMin(s.start)&&h*60<toMin(s.end)) n++; }));\n      if(n>peak.n) peak={n,d,h};\n      const lvl=n===0?0:n>=8?4:n>=6?3:n>=3?2:1;\n      return `<div class=\"heatCell l${lvl}\" title=\"${d} ${h}:00 — ${n} scheduled\"><\/div>`;\n    }).join('');\n    return `<div class=\"lx-heatRow\"><span class=\"lx-heatDay\">${d.slice(0,3)}<\/span>${cells}<\/div>`;\n  }).join('');\n  const foot=`<div class=\"lx-heatFoot\">\n    <div class=\"lx-heatScale\">Low ${[0,1,2,3,4].map(l=>`<i class=\"heatCell l${l}\" style=\"height:12px\"><\/i>`).join('')} High<\/div>\n    ${peak.n>0?`<span class=\"lx-pill\">Peak: ${peak.d.slice(0,3)} ${peak.h}:00 · ${peak.n} people<\/span>`:''}\n  <\/div>`;\n  return `<div class=\"lx-heat\">${axis}${rows}<\/div>${foot}`;\n}\n\n\/* --- CLOCK (live timer + weekly ring + today timeline) --- *\/\nfunction enhClock(){\n  const me=currentUser;\n  const mine=state.logs.filter(l=>l.uid===me.id).sort((a,b)=>new Date(b.time)-new Date(a.time));\n  const latest=mine[0];\n  const isIn=latest && latest.status==='In';\n\n  \/\/ weekly planned vs actual\n  let planned=0; OFFICE_DAYS.forEach(d=>(state.schedule[me.id]?.[d]||[]).forEach(s=>planned+=Math.max(0,(toMin(s.end)-toMin(s.start))\/60)));\n  const actual=actualHours(me.id);\n  const pct=planned?Math.min(100,Math.round(actual\/planned*100)):0;\n\n  \/\/ today's clock segments for a small timeline (09→20 window)\n  const dayStart=9*60, dayEnd=20*60, span=dayEnd-dayStart;\n  const todays=state.logs.filter(l=>l.uid===me.id && new Date(l.time).toDateString()===new Date().toDateString())\n                         .sort((a,b)=>new Date(a.time)-new Date(b.time));\n  const colorFor=t=> t==='Office'?'var(--chart1)':t==='Remote'?'var(--chart2)':'var(--chart3)';\n  let tl='';\n  const blocks=[];\n  let cursor=null, cursorType=null;\n  todays.forEach(l=>{\n    const min=new Date(l.time).getHours()*60+new Date(l.time).getMinutes();\n    if(l.status==='In'){cursor=min;cursorType=l.type;}\n    else if(cursor!=null){blocks.push([cursor,min,cursorType]);cursor=null;}\n  });\n  if(cursor!=null){ const nowM=new Date().getHours()*60+new Date().getMinutes(); blocks.push([cursor,nowM,cursorType]); }\n  let pos=dayStart;\n  blocks.forEach(([a,b,t])=>{\n    a=Math.max(dayStart,a); b=Math.min(dayEnd,b); if(b<=a) return;\n    if(a>pos) tl+=`<div class=\"lx-tlSeg\" style=\"width:${((a-pos)\/span*100)}%\"><\/div>`;\n    tl+=`<div class=\"lx-tlSeg\" style=\"width:${((b-a)\/span*100)}%;background:${colorFor(t)}\"><\/div>`;\n    pos=b;\n  });\n  if(pos<dayEnd) tl+=`<div class=\"lx-tlSeg\" style=\"width:${((dayEnd-pos)\/span*100)}%\"><\/div>`;\n  if(!blocks.length) tl=`<div class=\"lx-tlSeg\" style=\"width:100%\"><\/div>`;\n\n  push(`<div class=\"lx-sectionTitle\">Live Session &amp; Weekly Hours<\/div>\n  <div class=\"grid cols3\">\n    <div class=\"card lx-timerCard\" id=\"lxTimerCard\">\n      <div class=\"lx-timerLabel\">Session Timer<\/div>\n      <div class=\"lx-timerBig\" id=\"lxTimer\">00:00:00<\/div>\n      <div class=\"lx-timerState ${isIn?'on':'off'}\">${isIn?'<span class=\"lx-live\"><\/span>':''}${isIn?('Active · '+esc(latest.type)):'Not clocked in'}<\/div>\n    <\/div>\n    <div class=\"card\" style=\"display:flex;flex-direction:column;gap:8px\">\n      <div class=\"cardHeader\" style=\"margin:0\"><h3 class=\"cardTitle\">Weekly Hours<\/h3><span class=\"badge black\">${actual} \/ ${planned.toFixed(1)}h<\/span><\/div>\n      ${ring(pct, pct+'%', 'of plan')}\n    <\/div>\n    <div class=\"card\">\n      <div class=\"cardHeader\"><h3 class=\"cardTitle\">This Week<\/h3><span class=\"badge info\">summary<\/span><\/div>\n      <div class=\"lx-statGrid\">\n        <div class=\"lx-stat\"><div class=\"n\">${planned.toFixed(1)}<\/div><div class=\"l\">Planned h<\/div><\/div>\n        <div class=\"lx-stat\"><div class=\"n\">${actual}<\/div><div class=\"l\">Actual h<\/div><\/div>\n        <div class=\"lx-stat\"><div class=\"n\">${mine.filter(l=>l.status==='In').length}<\/div><div class=\"l\">Clock-ins<\/div><\/div>\n        <div class=\"lx-stat\"><div class=\"n\">${(actual-planned).toFixed(1)}<\/div><div class=\"l\">Delta h<\/div><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"card\" style=\"margin-top:16px\">\n    <div class=\"cardHeader\"><h3 class=\"cardTitle\">Today Timeline<\/h3><span class=\"badge black\">09:00 → 20:00<\/span><\/div>\n    <div class=\"lx-tl\">${tl}<\/div>\n    <div class=\"lx-tlLegend\"><span><i style=\"background:var(--chart1)\"><\/i>Office<\/span>\n      <span><i style=\"background:var(--chart2)\"><\/i>Remote<\/span>\n      <span><i style=\"background:var(--chart3)\"><\/i>Site<\/span>\n      <span><i style=\"background:var(--soft)\"><\/i>Not clocked<\/span><\/div>\n  <\/div>`);\n\n  startTimer(isIn?latest.time:null, isIn);\n}\nfunction startTimer(sinceIso, on){\n  if(window.__lxTimer) clearInterval(window.__lxTimer);\n  const el=()=>$('#lxTimer'); if(!el()) return;\n  if(!on || !sinceIso){ el().textContent='—'; return; }\n  const upd=()=>{\n    const e=el(); if(!e){clearInterval(window.__lxTimer);return;}\n    let s=Math.max(0,Math.floor((Date.now()-new Date(sinceIso).getTime())\/1000));\n    const h=String(Math.floor(s\/3600)).padStart(2,'0');\n    const m=String(Math.floor(s%3600\/60)).padStart(2,'0');\n    const ss=String(s%60).padStart(2,'0');\n    e.textContent=`${h}:${m}:${ss}`;\n  };\n  upd(); window.__lxTimer=setInterval(upd,1000);\n}\n\n\/* --- PERFORMANCE (leaderboard, approval donut, velocity) --- *\/\nfunction enhPerformance(){\n  const rows=state.performance;\n  const pts=groupSum(rows,'Engineer','Approved Points');\n  const subm=groupSum(rows,'Engineer','Submitted Points');\n  const board=Object.entries(pts).sort((a,b)=>b[1]-a[1]).slice(0,8);\n\n  const leader=board.map(([name,p],i)=>{\n    const s=subm[name]||0, rate=s?Math.round(p\/s*100):0;\n    const u=state.users.find(x=>x.name===name);\n    const g=i<3?'g'+(i+1):'';\n    return `<div class=\"lx-leaderRow\">\n      <div class=\"lx-rank ${g}\">${i<3?['①','②','③'][i]:i+1}<\/div>\n      <div style=\"min-width:0\"><div class=\"lx-leaderName\">${esc(name)}<\/div>\n        <div class=\"lx-leaderSub\">${esc(u?.department||'—')}<\/div>\n        <div class=\"lx-rateBar\"><div class=\"lx-rateFill\" style=\"width:${rate}%\"><\/div><\/div><\/div>\n      <div class=\"lx-leaderPts\"><b>${p}<\/b><span>${rate}% approved<\/span><\/div>\n    <\/div>`;\n  }).join('')||'<div class=\"empty\">No performance points yet.<\/div>';\n\n  \/\/ status donut\n  const byStatus={};\n  rows.forEach(r=>{ const s=r.Status||'—'; byStatus[s]=(byStatus[s]||0)+1; });\n  const order=['Approved','Submitted','Draft','Rejected'];\n  const cmap={Approved:'var(--chart1)',Submitted:'var(--chart2)',Draft:'var(--chart3)',Rejected:'var(--chart4)'};\n  const parts=order.filter(k=>byStatus[k]).map(k=>({label:k,v:byStatus[k],c:cmap[k]}));\n  Object.keys(byStatus).forEach(k=>{ if(!order.includes(k)) parts.push({label:k,v:byStatus[k],c:'var(--chart5)'}); });\n  const appr=byStatus.Approved||0, tot=rows.length||1;\n  const donutHtml=parts.length?donut(parts, Math.round(appr\/tot*100)+'%','approved'):'<div class=\"empty\">No rows.<\/div>';\n\n  \/\/ velocity totals\n  const est=sumRows(rows,'Estimated Points'), sub=sumRows(rows,'Submitted Points'), app=sumRows(rows,'Approved Points');\n  const vmax=Math.max(1,est,sub,app);\n  const velo=`<div class=\"lx-statGrid\">\n    <div class=\"lx-stat\"><div class=\"n\">${est}<\/div><div class=\"l\">Estimated<\/div><\/div>\n    <div class=\"lx-stat\"><div class=\"n\">${sub}<\/div><div class=\"l\">Submitted<\/div><\/div>\n    <div class=\"lx-stat\"><div class=\"n\">${app}<\/div><div class=\"l\">Approved<\/div><\/div>\n    <div class=\"lx-stat\"><div class=\"n\">${est?Math.round(app\/est*100):0}%<\/div><div class=\"l\">Realization<\/div><\/div>\n  <\/div>\n  <div style=\"margin-top:14px\">\n    ${[['Estimated',est],['Submitted',sub],['Approved',app]].map(([k,v])=>`\n      <div class=\"barRow\"><div class=\"barLabel\">${k}<\/div>\n        <div class=\"barTrack\"><div class=\"barFill\" style=\"width:${(v\/vmax*100).toFixed(1)}%\"><\/div><\/div><b>${v}<\/b><\/div>`).join('')}\n  <\/div>`;\n\n  push(`<div class=\"lx-sectionTitle\">Performance Intelligence<\/div>\n  <div class=\"grid cols3\">\n    <div class=\"card\" style=\"grid-column:span 1\">\n      <div class=\"cardHeader\"><h3 class=\"cardTitle\">Leaderboard<\/h3><span class=\"badge black\">Top ${board.length}<\/span><\/div>\n      ${leader}\n    <\/div>\n    <div class=\"card\">\n      <div class=\"cardHeader\"><h3 class=\"cardTitle\">Approval Mix<\/h3><span class=\"badge info\">status<\/span><\/div>\n      ${donutHtml}\n    <\/div>\n    <div class=\"card\">\n      <div class=\"cardHeader\"><h3 class=\"cardTitle\">Points Velocity<\/h3><span class=\"badge black\">est → sub → app<\/span><\/div>\n      ${velo}\n    <\/div>\n  <\/div>`);\n}\n\n\/* --- LIVE (enhanced coverage + peak) --- *\/\nfunction enhLive(){\n  const logs=activeLogs();\n  const groups={Office:logs.filter(l=>l.type==='Office').length,Remote:logs.filter(l=>l.type==='Remote').length,Site:logs.filter(l=>l.type==='Site').length};\n  const team=enabledUsers().length||1;\n  push(`<div class=\"lx-sectionTitle\">Presence Analytics<\/div>\n  <div class=\"grid cols3\">\n    <div class=\"card\" style=\"display:flex;flex-direction:column;gap:8px\">\n      <div class=\"cardHeader\" style=\"margin:0\"><h3 class=\"cardTitle\">Office<\/h3><span class=\"badge black\">${groups.Office}<\/span><\/div>\n      ${ring(Math.round(groups.Office\/team*100), groups.Office, 'in office')}\n    <\/div>\n    <div class=\"card\" style=\"display:flex;flex-direction:column;gap:8px\">\n      <div class=\"cardHeader\" style=\"margin:0\"><h3 class=\"cardTitle\">Remote<\/h3><span class=\"badge info\">${groups.Remote}<\/span><\/div>\n      ${ring(Math.round(groups.Remote\/team*100), groups.Remote, 'remote')}\n    <\/div>\n    <div class=\"card\" style=\"display:flex;flex-direction:column;gap:8px\">\n      <div class=\"cardHeader\" style=\"margin:0\"><h3 class=\"cardTitle\">Site<\/h3><span class=\"badge ok\">${groups.Site}<\/span><\/div>\n      ${ring(Math.round(groups.Site\/team*100), groups.Site, 'on site')}\n    <\/div>\n  <\/div>\n  <div class=\"card\" style=\"margin-top:16px\">\n    <div class=\"cardHeader\"><h3 class=\"cardTitle\">Detailed Coverage Heatmap<\/h3><span class=\"badge black\">scheduled<\/span><\/div>\n    ${heatmapBlock()}\n  <\/div>`);\n}\n\n\/* --- PEOPLE (search \/ sort toolbar + composition) --- *\/\nfunction enhPeople(){\n  \/\/ composition\n  const byDept={}, byAccess={};\n  enabledUsers().forEach(u=>{ byDept[u.department||'—']=(byDept[u.department||'—']||0)+1; byAccess[u.access||'—']=(byAccess[u.access||'—']||0)+1; });\n  const deptChips=Object.entries(byDept).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class=\"lx-chip\"><span class=\"lx-dotc\"><\/span>${esc(k)} <b>${v}<\/b><\/div>`).join('');\n  const accChips=Object.entries(byAccess).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class=\"lx-chip\">${esc(k)} <b>${v}<\/b><\/div>`).join('');\n\n  const depts=[...new Set(state.users.map(u=>u.department).filter(Boolean))].sort();\n\n  \/\/ inject toolbar + composition ABOVE the existing table card\n  const card=$('#content .card'); if(!card) return;\n  const wrap=document.createElement('div');\n  wrap.innerHTML=`\n    <div class=\"grid cols2\">\n      <div class=\"card\"><div class=\"cardHeader\"><h3 class=\"cardTitle\">Team by Department<\/h3><span class=\"badge black\">${enabledUsers().length} active<\/span><\/div><div class=\"lx-chipRow\">${deptChips}<\/div><\/div>\n      <div class=\"card\"><div class=\"cardHeader\"><h3 class=\"cardTitle\">Team by Access Role<\/h3><span class=\"badge info\">roles<\/span><\/div><div class=\"lx-chipRow\">${accChips}<\/div><\/div>\n    <\/div>\n    <div class=\"lx-toolbar\" style=\"margin-top:16px\">\n      <div class=\"field\" style=\"flex:2\"><label>Search<\/label><input class=\"input\" id=\"lxPplSearch\" placeholder=\"Name, role, note, department…\"><\/div>\n      <div class=\"field\"><label>Department<\/label><select class=\"select\" id=\"lxPplDept\"><option>All<\/option>${depts.map(d=>`<option>${esc(d)}<\/option>`).join('')}<\/select><\/div>\n      <div class=\"field\"><label>Sort<\/label><select class=\"select\" id=\"lxPplSort\">\n        <option value=\"name\">Name (A→Z)<\/option><option value=\"dept\">Department<\/option><option value=\"access\">Access role<\/option><option value=\"status\">Status<\/option><\/select><\/div>\n      <div class=\"lx-count\" id=\"lxPplCount\"><\/div>\n    <\/div>`;\n  card.parentNode.insertBefore(wrap, card);\n  const filter=()=>filterPeople();\n  $('#lxPplSearch').addEventListener('input',filter);\n  $('#lxPplDept').addEventListener('change',filter);\n  $('#lxPplSort').addEventListener('change',()=>{ sortPeople(); filterPeople(); });\n  filterPeople();\n}\nfunction peopleRows(){ return Array.from(document.querySelectorAll('#content table tbody tr')); }\nfunction filterPeople(){\n  const q=($('#lxPplSearch')?.value||'').toLowerCase().trim();\n  const dept=$('#lxPplDept')?.value||'All';\n  let shown=0;\n  peopleRows().forEach(tr=>{\n    const cells=tr.children;\n    const rowDept=cells[2]?.textContent||'';\n    const text=tr.textContent.toLowerCase();\n    const ok=(!q||text.includes(q)) && (dept==='All'||rowDept===dept);\n    tr.style.display=ok?'':'none';\n    if(ok) shown++;\n  });\n  const c=$('#lxPplCount'); if(c) c.textContent=shown+' shown';\n}\nfunction sortPeople(){\n  const key=$('#lxPplSort')?.value||'name';\n  const idx={name:1,dept:2,access:5,status:0}[key];\n  const tb=document.querySelector('#content table tbody'); if(!tb) return;\n  const rows=peopleRows();\n  rows.sort((a,b)=>(a.children[idx]?.textContent||'').localeCompare(b.children[idx]?.textContent||''));\n  rows.forEach(r=>tb.appendChild(r));\n}\n\n\/* --- lightweight enhancers (approvals\/rules\/schedule\/reports) --- *\/\nfunction enhApprovals(){\n  const all=state.approvals;\n  const c={Pending:0,Approved:0,Rejected:0};\n  all.forEach(r=>{ c[r.status]=(c[r.status]||0)+1; });\n  push(`<div class=\"lx-sectionTitle\">Approval Summary<\/div>\n  <div class=\"lx-statGrid\">\n    <div class=\"lx-stat\"><div class=\"n\">${all.length}<\/div><div class=\"l\">Total requests<\/div><\/div>\n    <div class=\"lx-stat\"><div class=\"n\">${c.Pending||0}<\/div><div class=\"l\">Pending<\/div><\/div>\n    <div class=\"lx-stat\"><div class=\"n\">${c.Approved||0}<\/div><div class=\"l\">Approved<\/div><\/div>\n    <div class=\"lx-stat\"><div class=\"n\">${c.Rejected||0}<\/div><div class=\"l\">Rejected<\/div><\/div>\n  <\/div>`);\n}\nfunction enhSchedule(){\n  const perDay=scheduledPerDay(); const maxDay=Math.max(1,...perDay.map(d=>d.n)); const tday=todayName();\n  push(`<div class=\"lx-sectionTitle\">Weekly Load<\/div>\n  <div class=\"card\"><div class=\"cardHeader\"><h3 class=\"cardTitle\">Assignments per Day<\/h3><span class=\"badge black\">balance check<\/span><\/div>\n  <div class=\"lx-weekStrip\">${perDay.map(d=>`\n    <div class=\"lx-dayCol ${d.day===tday?'lx-today':''}\"><div class=\"lx-dayName\">${d.day.s \nLX.filterPeople=filterPeople;\n\n})();\n\n\n\n\/* ================================================================\n   LARSA STAFF CONTROL — v10 deployment add-on\n   Additive only. The attached v9 app is retained and these features are\n   layered on top without changing the base layout.\n   ================================================================ *\/\n(function(){\n'use strict';\n\nconst V10 = window.V10 = window.V10 || {};\nconst V10_SECTIONS = [\n  ['summary','Executive Summary'],\n  ['attendance','Attendance \/ Clock History'],\n  ['plan','Plan vs Real Schedule'],\n  ['performance','Performance Details'],\n  ['leave','Leave History'],\n  ['alerts','Alerts & Notifications'],\n  ['evaluation','Employee Evaluation'],\n  ['company','Company Annual History'],\n  ['appendix','Full Appendix Tables']\n];\n\nfunction v10NowIso(){return new Date().toISOString()}\nfunction v10DateStr(d=new Date()){return new Date(d).toISOString().slice(0,10)}\nfunction v10DayName(d=new Date()){return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date(d).getDay()]}\nfunction v10Minutes(t){let a=String(t||'00:00').split(':').map(Number);return (a[0]||0)*60+(a[1]||0)}\nfunction v10TodaysMinutes(){let d=new Date();return d.getHours()*60+d.getMinutes()}\nfunction v10DateFromIso(iso){return v10DateStr(new Date(iso))}\nfunction v10Unique(a){return [...new Set(a.filter(Boolean))]}\nfunction v10Num(v){return Number(v)||0}\nfunction v10Round(v){return Number(v||0).toFixed(1)}\nfunction v10BetweenDate(iso,from,to){let d=v10DateFromIso(iso||new Date());return (!from||d>=from)&&(!to||d<=to)}\nfunction v10LocalTime(iso){try{return new Date(iso).toLocaleString()}catch(e){return iso||''}}\nfunction v10Who(id){ if(!id) return ''; const u=state.users.find(x=>x.id===id); return u?u.name:id; }\nfunction v10HasSection(id){let el=document.getElementById('v10sec_'+id);return !el || el.checked}\nfunction v10PeriodRange(){\n  const p=val('repPeriod')||'Current Week', today ationSent(a.key)) return;\n    v10PushNotification('Clock Compliance',a.uid,a.type,a.message,{key:a.key,shift:a.shift,day:a.day,date:a.date,flowType:'Schedule',recipients:v10Recipients(a.uid,'Schedule')});\n    created++;\n  });\n  if(showToast) toast(created?`${created} clock compliance notification(s) queued to employee and approval flow.`:'No new clock compliance alerts.');\n  return alerts;\n}\n\nfunction v10SessionPairs(uid,from,to,type){\n  const logs=state.logs.filter(l=>(!uid||l.uid===uid)&&(!type||l.type===type)&&v10BetweenDate(l.time,from,to)).sort((a,b)=>new Date(a.time)-new Date(b.time));\n  const open={}; const pairs=[];\n  logs.forEach(l=>{\n    if(l.status==='In') open[l.uid+'|'+l.type]=l;\n    else { const k=l.uid+'|'+l.type; if(open[k]){pairs.push({uid:l.uid,type:l.type,start:open[k].time,end:l.time,hours:Math.max(0,(new Date(l.time)-new Date(open[k].time))\/3600000)}); delete open[k];} }\n  });\n  Object.values(open).forEach(l=>pairs.push({uid:l.uid,type:l.type,start:l.time,end:v10NowIso(),hours:Math.max(0,(Date.now()-new Date(l.time))\/3600000),open:true}));\n  return pairs;\n}\nfunction v10Actual(uid,from,to,type){return v10SessionPairs(uid,from,to,type).reduce((a,p)=>a+p.hours,0)}\nfunction v10ScheduledRows(uid){\n  const ids=uid&&uid!=='All Employees'?[uid]:state.users.filter(u=>u.enabled).map(u=>u.id);\n  const rows=[]; ids.forEach(id=>OFFICE_DAYS.forEach(day=>(state.schedule[id]?.[day]||[]).forEach(s=>rows.push({uid:id,Employee:nameOf(id),Day:day,Shift:s.name||s.code,Code:s.code,Start:s.start,End:s.end,PlannedHours:hours(s.start,s.end),Status:(s.code||'').toUpperCase()==='SITE'?'Site':'Office'}))));\n  return rows;\n}\nfunction v10LateMinutes(uid,from,to){\n  let late=0;\n  v10ScheduledRows(uid).forEach(r=>{\n    if(r.Status!=='Office') return;\n    const logs=state.logs.filter(l=>l.uid===r.uid&&l.type==='Office'&&l.status==='In'&&v10BetweenDate(l.time,from,to));\n    logs.forEach(l=>{let m=new Date(l.time).getHours()*60+new Date(l.time).getM  document.body.classList.remove('v11-pin-mode'); return oldLoginUser.apply(this,arguments); };\nconst oldLoginPin=window.loginWithPin;\nwindow.loginWithPin=function(){ sessionStorage.larsaLoginMethod='pin'; document.body.classList.add('v11-pin-mode'); return oldLoginPin.apply(this,arguments); };\nsetTimeout(()=>{setLoginLabels(); if(!currentUser && typeof setLoginMode==='function') setLoginMode('pin');},0);\n\n\/* Clear and expanded employee constraints *\/\nV11.constraintTypes=['Unavailable','Must be in Office','Must not be in Office','Must work Remote','Must be on Site','Available only','Prefer not','Exception'];\nV11.constraintClass=function(t){return \/Must be in Office|Available only\/.test(t)?'ok':\/Remote|Site\/.test(t)?'info':\/Unavailable|Must not\/.test(t)?'block':''};\nV11.constraintIssue=function(uid,day,shift,mode='Office'){\n  const u=state.users.find(x=>x.id===uid); if(!u||!shift) return null;\n  const list=(u.constraints||[]).filter(c=>dayMatches(c,day));\n  for(const c of list){\n    const ov=hasOverlap(c.from||'00:00',c.to||'23:59',shift.start,shift.end);\n    const inside=minutes(shift.start)>=minutes(c.from||'00:00') && minutes(shift.end)<=minutes(c.to||'23:59');\n    if(c.type==='Available only' && !inside) return {hard:true,constraint:c,message:`${u.name} is available only ${c.day||'Any'} ${c.from}-${c.to}.`};\n    if(!ov) continue;\n    if(['Unavailable','Must not be in Office','Must work Remote','Must be on Site'].includes(c.type) && mode==='Office') return {hard:true,constraint:c,message:`${u.name}: ${c.type} ${c.day||'Any'} ${c.from}-${c.to}.`};\n    if(['Prefer not','Exception'].includes(c.type)) return {hard:false,constraint:c,message:`${u.name}: ${c.type} during ${c.from}-${c.to}.`};\n  }\n  return null;\n};\nV11.constraintSummaryFor=function(uid){\n  const u=state.users.find(x=>x.id===uid); const arr=u?.constraints||[];\n  return arr.map((c,i)=>`<span class=\"v11-constraint-badge ${V11.constraintClass(c.type)}\">${e(c.type)} · ${e(c.day "><label>To<\/label><input class=\"input\" id=\"v11cTo\" type=\"time\" value=\"14:00\"><\/div>\n      <div class=\"field\"><label>Note<\/label><input class=\"input\" id=\"v11cNote\" placeholder=\"Example: university duty, remote required, site inspection\"><\/div>\n      <button class=\"btn primary\" onclick=\"V11.addConstraint()\">Add<\/button>\n    <\/div>\n    <div class=\"v11-rule-note\">Use this for rules like: cannot attend Tuesday morning until 2:00 PM, must work Remote, must be on Site, must not be in Office, or must be in Office. Auto Schedule avoids hard conflicts, while manual changes show warnings.<\/div>\n    <div class=\"tableWrap\" style=\"margin-top:14px\"><table class=\"table\"><thead><tr><th>Employee<\/th><th>Department<\/th><th>Constraints<\/th><th>Alert \/ Approval Notification Steps<\/th><\/tr><\/thead><tbody id=\"v11ConstraintRows\"><\/tbody><\/table><\/div>\n  <\/div>`;\n};\nV11.refreshConstraintList=function(){\n  const body=get('v11ConstraintRows'); if(!body) return;\n  body.innerHTML=enabledUsers().map(u=>`<tr><td><b>${e(u.name)}<\/b><\/td><td>${e(u.department)}<\/td><td>${V11.constraintSummaryFor(u.id)}<\/td><td>${V11.flowHTML(u.id,'Schedule')}<\/td><\/tr>`).join('');\n};\nV11.flowHTML=function(uid,type='Schedule'){\n  let flow=(state.flowConfig?.[uid]?.[type]||[]).filter(Boolean);\n  if(!flow.length && typeof v10FlowFor==='function') flow=v10FlowFor(uid,type);\n  const nodes=[uid,...flow];\n  return `<div class=\"v11-flow-strip\">${nodes.map((id,i)=>`${i?'<span class=\"v11-flow-arrow\">→<\/span>':''}<span class=\"v11-flow-node\">${e(nameOf(id))}<\/span>`).join('')}<\/div>`;\n};\n\n\/* Expanded constraint modal used from People page *\/\nwindow.openConstraintModal=function(uid){\n  const u=state.users.find(x=>x.id===uid);\n  const body=`<div class=\"drawerGrid\"><div class=\"field\"><label>Employee<\/label><input class=\"input\" value=\"${e(u?.name||'')}\" disabled><\/div><div class=\"field\"><label>Day<\/label><select class=\"select\" id=\"cDay\"><option>Any<\/option>${OFFICE_DAYS.map(d=>`<option>${d}<\/option>`).join('')}<\/select><\/div><div class=\"field\"><label>Constraint Type<\/label><select class=\"select\" id=\"cType\">${V11.constraintTypes.map(t=>`<option>${t}<\/option>`).join('')}<\/select><\/div><div class=\"field\"><label>From<\/label><input class=\"input\" id=\"cFrom\" type=\"time\" value=\"09:00\"><\/div><div class=\"field\"><label>To<\/label><input class=\"input\" id=\"cTo\" type=\"time\" value=\"14:00\"><\/div><div class=\"field\" style=\"grid-column:1\/-1\"><label>Note<\/label><textarea class=\"textarea\" id=\"cNote\" placeholder=\"Example: cannot attend office Tuesday morning until 2 PM, must work Remote, must be on Site.\"><\/textarea><\/div><\/div>`;\n  openModal('Add Employee Constraint',body,`<button class=\"btn\" onclick=\"closeModal()\">Cancel<\/button><button class=\"btn primary\" onclick=\"saveConstraint('${uid}')\">Save Constraint<\/button>`);\n};\n\n\/* Drop and Auto Schedule now understand employee constraints *\/\nwindow.dropShift=function(ev,uid,day){\n  ev.preventDefault(); ev.currentTarget.classList.remove('dragOver');\n  const sid=ev.dataTransfer.getData('shift'); const s=state.shifts.find(x=>x.id===sid); if(!s) return;\n  if(s.dayTag&&s.dayTag!=='Any'&&s.dayTag!==day) return toast(`${s.name} is tagged for ${s.dayTag}.`);\n  const issue=V11.constraintIssue(uid,day,s,'Office');\n  if(issue){ toast(issue.hard?`Constraint warning: ${issue.message} Manual override allowed.`:`Warning: ${issue.message}`); }\n  state.schedule[uid][day].push({...s,instance:'i'+Date.now()+Math.random()}); save(); renderSchedule();\n};\nfunction bestShiftFor(uid,day,index){\n  const candidates=state.shifts.filter(s=>(!s.dayTag||s.dayTag==='Any'||s.dayTag===day));\n  const must=(state.users.find(u=>u.id===uid)?.constraints||[]).filter(c=>dayMatches(c,day)&&c.type==='Must be in Office');\n  let pref=candidates.find(s=>must.some(c=>hasOverlap(c.from,c.to,s.start,s.end)) && !V11.constraintIssue(uid,day,s,'Office'));\n  if(pref) return pref;\n  for(let k=0;k<candidates.length;k++){ const s=candidates[(index+k)%candidates.length]; if(!V11.constraintIssue(uid,day,s,'Office')?.hard) return s; }\n  return null;\n}\nwindow.autoSchedule=function(){\n  let assigned=0, skipped=0; const users=enabledUsers().slice(0,24);\n  OFFICE_DAYS.forEach((d,di)=>{\n    users.forEach((u,ui)=>{\n      if((state.schedule[u.id]?.[d]||[]).length) return;\n      const s=bestShiftFor(u.id,d,di+ui);\n      if(s){ state.schedule[u.id][d].push({...s,instance:'i'+Date.now()+Math.random()}); assigned++; }\n      else skipped++;\n    });\n  });\n  save(); toast(`Auto Schedule completed: ${assigned} assignment(s), ${skipped} skipped due to hard constraints.`); render();\n};\n\n\/* Quick PIN first and simplified Clock In \/ Clock Out *\/\nV11.selectClockType=function(type){sessionStorage.v11ClockType=type; render();};\nV11.clockSelected=function(){window.clockToggle(selectedClockType());};\nfunction clockStatusForUser(uid){return state.logs.filter(l=>l.uid===uid).sort((a,b)=>new Date(b.time)-new Date(a.time))[0];}\nconst baseRenderClock=window.renderClock;\nwindow.renderClock=function(){\n  const pin=sessionStorage.larsaLoginMethod==='pin';\n  document.body.classList.toggle('v11-pin-mode',pin);\n  if(!pin){ return baseRenderClock.apply(this,arguments); }\n  const type=selectedClockType(); const latest=clockStatusForUser(currentUser.id); const isIn=latest&&latest.status==='In';\n  const action=isIn?'Clock Out':'Clock In'; const modeClass=type.toLowerCase();\n  get('content').innerHTML=`<div class=\"v11-clock-hero\">\n    <div class=\"card\"><div class=\"cardHeader\"><div><h3 class=\"v11-clock-title\">Quick PIN Clock<\/h3><p class=\"v11-clock-sub\">Select the work location first, then clock in or clock out. No admin details are shown in PIN mode.<\/p><\/div><div class=\"rowActions\"><span class=\"badge black\">${e(currentUser.name)}<\/span><button class=\"btn small\" onclick=\"logout()\">Log Out new Date().toLocaleString()}<\/span><br><span>Prepared from Larsa Staff Control<\/span><\/div><\/div><div class=\"larsaReportLine\"><\/div><\/div>`);\n}\nconst oldDisplayReport=window.displayReport;\nwindow.displayReport=function(){ oldDisplayReport.apply(this,arguments); injectReportHeader(); };\n\n\/* Make live presence visually identify Office\/Remote\/Site with colored status lights *\/\nfunction decoratePresence(){\n  $$('.personCard').forEach(card=>{\n    const txt=card.textContent||''; let t=txt.includes('Remote')?'remote':txt.includes('Site')?'site':txt.includes('Office')?'office':'';\n    card.classList.remove('v11-office','v11-remote','v11-site'); if(t) card.classList.add('v11-'+t);\n    const name=card.querySelector('.personName'); if(name && t && !name.querySelector('.v11-pres-dot')) name.insertAdjacentHTML('afterbegin',`<span class=\"v11-pres-dot ${t}\"><\/span>`);\n  });\n}\n\n\/* Add rule-page constraint builder and visible notification escalation steps *\/\nfunction afterRender(){\n  const pin=sessionStorage.larsaLoginMethod==='pin'; document.body.classList.toggle('v11-pin-mode',pin);\n  if(pin && activePage==='clock') get('v10MyHistory')?.remove();\n  if(activePage==='rules' && !get('v11ConstraintBuilder')){ get('content')?.insertAdjacentHTML('beforeend',V11.renderConstraintBuilder()); V11.refreshConstraintList(); }\n  if(activePage==='live') decoratePresence();\n  if(activePage==='reports') injectReportHeader();\n}\nconst oldRender=window.render;\nwindow.render=function(){ oldRender.apply(this,arguments); afterRender(); };\nsetTimeout(afterRender,0);\n\n\/* Clock compliance notification uses same approval\/alert flow and stores clear recipients *\/\nconst oldRunScan=window.v10RunClockComplianceScan;\nif(typeof oldRunScan==='function'){\n  window.v10RunClockComplianceScan=function(showToast=false){\n    const alerts=oldRunScan(showToast);\n    \/\/ old scanner already queues App\/Email notifications to employee + Schedule flow; this visible history confirms the exact steps.\n    alerts.forEach(a=>{ if(!a.v11FlowLogged){ try{v10History('Alert Flow','system',a.uid,'Clock compliance escalation',v10Recipients(a.uid,'Schedule').map(r=>r.name).join(' → '),a.key);}catch(e){} } });\n    return alerts;\n  };\n}\n})();\n<\/script>\n\n<script>\n\/* ================================================================\n   LARSA STAFF CONTROL — v12 TARGETED FIXES ONLY\n   1) Quick PIN Clock selection border clarity\n   2) Leave request date activation + weekday display\n   3) Leave request edit restarts approval from Step 1\n   ================================================================ *\/\n(function(){\n'use strict';\n\nconst V12 = window.V12 || (window.V12 = {});\nconst $v12 = s => document.querySelector(s);\nconst $$v12 = s => [...document.querySelectorAll(s)];\nconst v12Esc = s => String(s ?? '').replace(\/[&<>\"']\/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[m]));\nconst v12Val = id => document.getElementById(id)?.value || '';\nconst v12Checked = id => !!document.getElementById(id)?.checked;\n\nfunction v12IsoToday(){ return new Date().toISOString().slice(0,10); }\nfunction v12Weekday(iso){\n  if(!iso) return '';\n  const d = new Date(iso + 'T12:00:00');\n  if(Number.isNaN(d.getTime())) return '';\n  return d.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'short',day:'numeric'});\n}\nfunction v12DateHelp(id){\n  const input = document.getElementById(id);\n  const out = document.getElementById(id + 'Weekday');\n  if(out) out.textContent = v12Weekday(input?.value);\n}\nfunction v12ActivateDateInputs(){\n  $$v12('input[type=\"date\"].v12-date-input').forEach(inp=>{\n    if(inp.dataset.v12Ready) return;\n    inp.dataset.v12Ready = '1';\n    const show = () => { try{ if(typeof inp.showPicker === 'function') inp.showPicker(); }catch(e){} };\n    inp.addEventListener('focus', show);\n    inp.addEventListener('click', show);\n    inp.addEventListener('change', ()=>v12DateHelp(inp.id oints,'points')}${kpi('Commitment Score',avgScore+'%','computed')}<\/div><div class=\"grid cols3\" style=\"margin-top:16px\"><div class=\"card\"><div class=\"cardHeader\"><h3 class=\"cardTitle\">Hours Mix<\/h3><\/div><div class=\"pie\" style=\"background:${pieGradient([{v:totalOffice,c:'var(--chart1)'},{v:totalRemote,c:'var(--chart2)'},{v:totalSite,c:'var(--chart3)'},{v:Math.max(1,1),c:'var(--chart4)'}])}\"><\/div><div class=\"legend\"><span><i class=\"swatch\"><\/i> Office<\/span><span><i class=\"swatch\" style=\"background:var(--chart2)\"><\/i> Remote<\/span><span><i class=\"swatch\" style=\"background:var(--chart3)\"><\/i> Site<\/span><\/div><\/div><div class=\"card\"><div class=\"cardHeader\"><h3 class=\"cardTitle\">Performance by Employee<\/h3><\/div>${barChart(groupSum(perfRows,'Engineer','Approved Points'),240,12)}<\/div><div class=\"card\"><div class=\"cardHeader\"><h3 class=\"cardTitle\">Work Category Mix<\/h3><\/div><div class=\"pie\" style=\"background:${pieFromObj(groupSum(perfRows,'Work Category','Approved Points'))}\"><\/div><\/div><\/div><\/div>`;\n  }\n  if(sections.has('evaluation')) body+=`<div class=\"v13-docSection lx-v10-printBlock\">${sectionTitle('Employee Evaluation Summary')}${table(evalRows,['Employee','Department','OfficeHours','RemoteHours','SiteHours','TotalHours','ApprovedPoints','SubmittedPoints','LateMinutes','Leaves','ClockAlerts','Score'])}<\/div>`;\n  if(sections.has('plan')){const planRows=plannedRows.map(r=>{let e=evalRows.find(x=>x.uid===r.uid)||{};return Object.assign({},r,{ActualHours:e.TotalHours||0,Difference:num((e.TotalHours||0)-r.PlannedHours)});}); body+=`<div class=\"v13-docSection lx-v10-printBlock\">${sectionTitle('Plan vs Real Schedule')}${table(planRows,['Employee','Day','Shift','Code','Start','End','PlannedHours','ActualHours','Difference','Status'])}<\/div>`;}\n  if(sections.has('attendance')){const attRows=logs.map(l=>({Employee:nameOf(l.uid),Type:l.type,Status:l.status,Time:v10LocalTime(l.time),LastSeen:v10Local {Metric:'Employees',Value:employeeIds.length},{Metric:'Period Hours',Value:num(totalActual)},{Metric:'Office Hours',Value:num(totalOffice)},{Metric:'Remote Hours',Value:num(totalRemote)},{Metric:'Site Hours',Value:num(totalSite)},{Metric:'Late Minutes',Value:totalLate},{Metric:'Leave Requests',Value:totalLeaves},{Metric:'Clock Alerts',Value:totalAlerts},{Metric:'Average Commitment Score',Value:avgScore+'%'}]; body+=`<div class=\"v13-docSection lx-v10-printBlock\">${sectionTitle('Company History Summary')}<div class=\"grid cols2\"><div class=\"card\">${table(company,['Metric','Value'])}<\/div><div class=\"card\"><div class=\"cardHeader\"><h3 class=\"cardTitle\">Department Performance<\/h3><\/div>${table(deptRows,['Department','ApprovedPoints'])}<\/div><\/div><\/div>`;}\n  if(sections.has('appendix')){const history=(typeof v10HistoryRows==='function'?v10HistoryRows(uid,range.from,range.to):[]).map(h=>({Time:v10LocalTime(h.time),Kind:h.kind,Actor:v10Who(h.actor),Target:v10Who(h.target),Action:h.action,Details:h.details,Reference:h.refId})); body+=`<div class=\"v13-docSection lx-v10-printBlock lx-v10-pageBreak\">${sectionTitle('Full Report Appendix')}${table(history,['Time','Kind','Actor','Target','Action','Details','Reference'])}<\/div>`;}\n  $id('reportPreview').innerHTML=`<article class=\"v13-reportDoc\">${reportHeader(typ,emp,reportRangeLabel())}${body||'<div class=\"v13-emptyDoc\">Select at least one report section.<\/div>'}<\/article>`;\n};\nconst oldExport=window.exportCurrentReportCSV;\nwindow.exportCurrentReportCSV=function(){ if(typeof oldExport==='function') return oldExport(); const txt=($id('reportPreview')?.innerText||'').replace(\/\\n{3,}\/g,'\\n\\n'); const blob=new Blob([txt],{type:'text\/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='larsa-report.txt'; a.click(); };\n})();\n<\/script>\n\n\n<style id=\"larsa-v14-reports-schedule-fix\">\n\/* v14 targeted fixes: working reports + interactive schedule office-hours summary *\/\n.v14-report-controls{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 6px 20px rgba(15,23,42,.04);padding:18px;margin-bottom:18px}.v14-report-controls .cardHeader{margin-bottom:12px}.v14-report-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.v14-custom{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}.v14-custom.hidden{display:none!important}.v14-report-doc{background:#fff;color:#111;border:1px solid #d8d8d8;border-radius:18px;box-shadow:0 12px 32px rgba(15,23,42,.08);padding:28px;max-width:1320px;margin:0 auto 22px}.v14-report-doc .card{box-shadow:none;border-color:#dcdcdc}.v14-report-header{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}.v14-report-logo{background:#000;display:inline-flex;padding:8px 12px}.v14-report-logo img{width:210px;display:block}.v14-report-line{height:4px;background:#000;margin:16px 0 20px}.v14-report-title{font-size:24px;font-weight:950;letter-spacing:-.035em;margin:8px 0 0}.v14-report-meta{text-align:right;font-size:12px;line-height:1.55;font-weight:800;color:#444}.v14-report-meta b{display:block;font-size:20px;color:#111}.v14-section-title{display:flex;align-items:center;gap:10px;margin:22px 0 12px;font-size:14px;font-weight:950;letter-spacing:.10em;text-transform:uppercase;color:#222}.v14-section-title:after{content:\"\";height:1px;background:#d6d6d6;flex:1}.v14-empty{padding:40px;border:1px dashed #aaa;border-radius:14px;text-align:center;color:#555;font-weight:800}.v14-sched-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:0 0 16px}.v14-mini-kpi{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:14px}.v14-mini-kpi .l{font-size:11px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.08em}.v14-mini-kpi .v{font-size:25px;font-weight:950;letter-spacing:-.04em}.v14-emp-summary{display:flex;flex-direction:column;gap:
