 removeLocalClock();\n    const top=document.querySelector('.topbar'), actions=$v26('actions');\n    if(!top||!actions) return;\n    let box=$v26('v25Timebar');\n    if(!box){box=document.createElement('div');box.id='v25Timebar';box.className='v25-timebar';top.insertBefore(box,actions)}\n    box.innerHTML='<div class=\"v25-clock-card\"><div class=\"tz\">Baghdad \/ Mosul<\/div><div id=\"v25MosulTime\" class=\"time\">--:--:--<\/div><div id=\"v25MosulDate\" class=\"date\">--<\/div><\/div><div class=\"v25-clock-card\"><div class=\"tz\">Texas<\/div><div id=\"v25TexasTime\" class=\"time\">--:--:--<\/div><div id=\"v25TexasDate\" class=\"date\">--<\/div><\/div>';\n    updateClocks26();\n  }\n  function updateClocks26(){\n    const m=fmtClock26(TZ_BAGHDAD_V26),t=fmtClock26(TZ_TEXAS_V26);\n    if($v26('v25MosulTime')) $v26('v25MosulTime').textContent=m.time;\n    if($v26('v25MosulDate')) $v26('v25MosulDate').textContent=m.date;\n    if($v26('v25TexasTime')) $v26('v25TexasTime').textContent=t.time;\n    if($v26('v25TexasDate')) $v26('v25TexasDate').textContent=t.date;\n    if($v26('v25BackupMosulTime')) $v26('v25BackupMosulTime').textContent=m.time;\n    if($v26('v25BackupMosulDate')) $v26('v25BackupMosulDate').textContent=m.date;\n    if($v26('v25BackupTexasTime')) $v26('v25BackupTexasTime').textContent=t.time;\n    if($v26('v25BackupTexasDate')) $v26('v25BackupTexasDate').textContent=t.date;\n  }\n  setInterval(()=>{removeLocalClock();updateClocks26()},1000);\n  document.addEventListener('DOMContentLoaded',ensureClocks26);\n\n  function sessions26(){\n    const out=[],by={};\n    ((state&&state.logs)||[]).slice().sort((a,b)=>new Date(a.time)-new Date(b.time)).forEach(l=>(by[l.uid]=by[l.uid]||[]).push(l));\n    Object.entries(by).forEach(([uid,arr])=>{let open=null;arr.forEach(l=>{if(l.status==='In') open=l; else if(l.status==='Out'&&open){const a=new Date(open.time),b=new Date(l.time);out.push({uid,Employee:userName26(uid),Type:open.type||l.type||'',In:open.time,Out:l.time,Hours:Math.max(0,(b-a)\/3600000),Open:false});open=null;}}); if(open) out.push({uid,Employee:userName26(uid),Type:open.type||'',In:open.time,Out:new Date().toISOString(),Hours:Math.max(0,(Date.now()-new Date(open.time))\/3600000),Open:true});});\n    return out;\n  }\n  function startWeek26(){const now=new Date();const wd=new Intl.DateTimeFormat('en-US',{timeZone:TZ_BAGHDAD_V26,weekday:'short'}).format(now);const map={Sat:0,Sun:1,Mon:2,Tue:3,Wed:4,Thu:5,Fri:6};const d=new Date(now);d.setDate(d.getDate()-(map[wd]??0));d.setHours(0,0,0,0);return d;}\n  function rangeA26(period,from){if(period==='Custom'&&from)return new Date(from+'T00:00:00');const d=new Date();if(period==='Weekly')return startWeek26();if(period==='Bi-weekly'){const s=startWeek26();s.setDate(s.getDate()-7);return s;}if(period==='Monthly'){d.setMonth(d.getMonth()-1);return d;}if(period==='Quarter'){d.setMonth(d.getMonth()-3);return d;}if(period==='Year'){d.setFullYear(d.getFullYear()-1);return d;}return new Date(0)}\n  function rangeB26(period,to){return period==='Custom'&&to?new Date(to+'T23:59:59'):new Date(8640000000000000)}\n  function filtered26(){state.v23=state.v23||{};const p=state.v23.tsPeriod||'Weekly',emp=state.v23.tsEmployee||'All Employees',mode=state.v23.tsMode||'All Modes',a=rangeA26(p,state.v23.tsFrom||''),b=rangeB26(p,state.v23.tsTo||'');return sessions26().filter(s=>new Date(s.In)>=a&&new Date(s.In)<=b).filter(s=>emp==='All Employees'||s.uid===emp).filter(s=>mode==='All Modes'||s.Type===mode)}\n  function sum26(rows,key,fn){const o={};rows.forEach(r=>{const k=typeof key==='function'?key(r):(r[key]||'Unassigned');o[k]=(o[k]||0)+(fn?fn(r):N26(r.Hours));});return o;}\n  function hbar26(obj,suffix='',modeColors=false){const e=Object.entries(obj||{}).sort((a,b)=>N26(b[1])-N26(a[1]));if(!e.length)return '<div class=\"empty\">No timesheet data.<\/div>';const max=Math.max(1,...e.map(x=>N26(x[1])));return e.map(([k,v])=>{const cls=modeColors?(String(k).toLowerCase()):'';return `<div class=\"v26-hbar\"><div class=\"v26-hbar-label\" title=\"${H26(k)}\">${H26(k)}<\/div><div class=\"v26-hbar-track\"><div class=\"v26-hbar-fill ${H26(cls)}\" style=\"width:${Math.max(2,Math.round(N26(v)\/max*100))}%\"><\/div><\/div><div class=\"v26-hbar-val\">${H26(F26(v))}${H26(suffix)}<\/div><\/div>`}).join('')}\n  function table26(rows){const view=state.v23?.tsView||'Both',mos=view!=='Texas',tx=view!=='Mosul \/ Baghdad',col=4+(mos?1:0)+(tx?1:0);return `<div class=\"tableWrap\" style=\"margin-top:14px\"><table class=\"table v22-timesheet-table\"><thead><tr><th>Employee<\/th><th>Mode<\/th>${mos?'<th>Baghdad \/ Mosul<\/th>':''}${tx?'<th>Texas<\/th>':''}<th>Hours<\/th><th>Status<\/th><\/tr><\/thead><tbody>${rows.map(s=>`<tr><td><b>${H26(s.Employee)}<\/b><\/td><td><span class=\"badge ${s.Type==='Office'?'ok':s.Type==='Remote'?'info':'black'}\">${H26(s.Type)}<\/span><\/td>${mos?`<td>${H26(dt26(s.In,TZ_BAGHDAD_V26))}<br>→ ${H26(dt26(s.Out,TZ_BAGHDAD_V26))}<\/td>`:''}${tx?`<td>${H26(dt26(s.In,TZ_TEXAS_V26))}<br>→ ${H26(dt26(s.Out,TZ_TEXAS_V26))}<\/td>`:''}<td>${H26(F26(s.Hours))}<\/td><td>${s.Open?'<span class=\"badge warn\">Open<\/span>':'<span class=\"badge ok\">Closed<\/span>'}<\/td><\/tr>`).join('')||`<tr><td colspan=\"${col}\">No timesheet sessions.<\/td><\/tr>`}<\/tbody><\/table><\/div>`}\n  function kpi26(label,value,sub){return `<div class=\"v22-kpi\"><div class=\"label\">${H26(label)}<\/div><div class=\"value\">${H26(value)}<\/div><div class=\"sub\">${H26(sub||'')}<\/div><\/div>`}\n  function renderTimesheet26(){\n    state.v23=state.v23||{};state.v23.tsPeriod=state.v23.tsPeriod||'Weekly';state.v23.tsEmployee=state.v23.tsEmployee||'All Employees';state.v23.tsMode=state.v23.tsMode||'All Modes';state.v23.tsView=state.v23.tsView||'Both';\n    const rows=filtered26().slice().sort((a,b)=>new Date(b.In)-new Date(a.In));\n    const total=rows.reduce((a,s)=>a+N26(s.Hours),0),office=rows.filter(s=>s.Type==='Office').reduce((a,s)=>a+N26(s.Hours),0),remote=rows.filter(s=>s.Type==='Remote').reduce((a,s)=>a+N26(s.Hours),0),site=rows.filter(s=>s.Type==='Site').reduce((a,s)=>a+N26(s.Hours),0),open=rows.filter(s=>s.Open).length;\n    const c=$v26('content');if(!c)return;\n    c.innerHTML=`<div class=\"v22-section\"><div class=\"v22-kpi-grid\">${kpi26('Total Hours',F26(total),'selected period')}${kpi26('Office Hours',F26(office),'physical attendance')}${kpi26('Remote Hours',F26(remote),'online \/ work from home')}${kpi26('Site Hours',F26(site),'field work')}${kpi26('Sessions',rows.length,open+' open')}<\/div><\/div>\n    <div class=\"v26-ts-report\">\n      <div class=\"v26-ts-doc-head\"><div><h3>Timesheet Sessions<\/h3><p>Actual clock in \/ clock out sessions with Baghdad\/Mosul and Texas time references.<\/p><\/div><div class=\"v26-ts-meta\"><b>${H26(state.v23.tsPeriod)}<\/b><br>${H26(state.v23.tsEmployee==='All Employees'?'All Employees':userName26(state.v23.tsEmployee))}<br>${H26(state.v23.tsMode||'All Modes')} · ${H26(state.v23.tsView||'Both')}<\/div><\/div>\n      <div class=\"v26-ts-chart-grid\">\n        <div class=\"v26-ts-chart\"><h4>Hours by Employee<\/h4>${hbar26(sum26(rows,'Employee'),'h')}<\/div>\n        <div class=\"v26-ts-chart\"><h4>Sessions by Employee<\/h4>${hbar26(sum26(rows,'Employee',()=>1))}<\/div>\n        <div class=\"v26-ts-chart\"><h4>Hours by Mode<\/h4>${hbar26(sum26(rows,'Type'),'h',true)}<\/div>\n        <div class=\"v26-ts-chart\"><h4>Daily Hours<\/h4>${hbar26(sum26(rows,r=>dkey26(r.In),r=>r.Hours),'h')}<\/div>\n      <\/div>\n      <div class=\"v26-ts-table-title\"><h4>Detailed Sessions<\/h4><div class=\"rowActions\"><button class=\"btn small ${state.v23.tsView==='Both'?'primary':''}\" onclick=\"V23TS.set('tsView','Both')\">Both<\/button><button class=\"btn small ${state.v23.tsView==='Mosul \/ Baghdad'?'primary':''}\" onclick=\"V23TS.set('tsView','Mosul \/ Baghdad')\">Baghdad \/ Mosul<\/button><button class=\"btn small ${state.v23.tsView==='Texas'?'primary':''}\" onclick=\"V23TS.set('tsView','Texas')\">Texas<\/button><\/div><\/div>\n      ${table26(rows)}\n    <\/div>\n    <div class=\"v22-section v22-filter-panel\"><div class=\"v22-title-row\"><div><h3>Filters & Inputs<\/h3><p>Results stay above; filters are kept below.<\/p><\/div><\/div><div class=\"grid cols5\"><div class=\"field\"><label>Period<\/label><select class=\"select\" onchange=\"V23TS.set('tsPeriod',this.value)\">${['Weekly','Bi-weekly','Monthly','Quarter','Year','All Time','Custom'].map(x=>`<option ${state.v23.tsPeriod===x?'selected':''}>${H26(x)}<\/option>`).join('')}<\/select><\/div><div class=\"field\"><label>Employee<\/label><select class=\"select\" onchange=\"V23TS.set('tsEmployee',this.value)\"><option>All Employees<\/option>${allUsers26().map(u=>`<option value=\"${H26(u.id)}\" ${state.v23.tsEmployee===u.id?'selected':''}>${H26(u.name)}<\/option>`).join('')}<\/select><\/div><div class=\"field\"><label>Mode<\/label><select class=\"select\" onchange=\"V23TS.set('tsMode',this.value)\">${['All Modes','Office','Remote','Site'].map(x=>`<option ${state.v23.tsMode===x?'selected':''}>${H26(x)}<\/option>`).join('')}<\/select><\/div><div class=\"field\"><label>From<\/label><input class=\"input\" type=\"date\" value=\"${H26(state.v23.tsFrom||'')}\" onchange=\"V23TS.set('tsFrom',this.value)\"><\/div><div class=\"field\"><label>To<\/label><input class=\"input\" type=\"date\" value=\"${H26(state.v23.tsTo||'')}\" onchange=\"V23TS.set('tsTo',this.value)\"><\/div><\/div><\/div>`;\n  }\n  function exportCSV26(){const rows=filtered26();const head=['Employee','Mode','Clock In Baghdad\/Mosul','Clock Out Baghdad\/Mosul','Clock In Texas','Clock Out Texas','Hours','Status'];const csv=[head.join(',')].concat(rows.map(s=>[s.Employee,s.Type,dt26(s.In,TZ_BAGHDAD_V26),dt26(s.Out,TZ_BAGHDAD_V26),dt26(s.In,TZ_TEXAS_V26),dt26(s.Out,TZ_TEXAS_V26),F26(s.Hours),s.Open?'Open':'Closed'].map(x=>'\"'+String(x??'').replace(\/\"\/g,'\"\"')+'\"').join(','))).join('\\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text\/csv'}));a.download='larsa_timesheet.csv';a.click();}\n  window.V23TS={set(k,v){state.v23=state.v23||{};state.v23[k]=v;try{save()}catch(e){};renderTimesheet26();},export:exportCSV26,render:renderTimesheet26};\n  try{window.renderTimesheet=renderTimesheet26; renderTimesheet=renderTimesheet26;}catch(e){window.renderTimesheet=renderTimesheet26;}\n\n  const oldRender=window.render;\n  window.render=function(){if(typeof oldRender==='function') oldRender.apply(this,arguments);removeLocalClock();ensureClocks26();if(window.activePage==='timesheet')renderTimesheet26();};\n  try{render=window.render}catch(e){}\n  const oldActions=window.renderActions;\n  window.renderActions=function(){if(typeof oldActions==='function')oldActions();removeLocalClock();ensureClocks26();if(window.activePage==='timesheet'){const a=$v26('actions');if(a)a.innerHTML='<button class=\"btn\" onclick=\"window.print()\">Print \/ Save PDF<\/button><button class=\"btn primary\" onclick=\"V23TS.export()\">Export Timesheet CSV<\/button>';}};\n  try{renderActions=window.renderActions}catch(e){}\n  setTimeout(()=>{ensureClocks26();if(window.activePage==='timesheet')renderTimesheet26()},0);\n})();\n<\/script>\n\n\n<!-- ================================================================\n     v27 PATCH — remove untitled local clock from all tabs + align action buttons\n     Scope: targeted fixes only.\n     ================================================================ -->\n<style id=\"larsa-v27-clock-button-alignment\">\n\/* Remove any older local clock pill that does not show a timezone. Keep only Baghdad\/Mosul + Texas cards. *\/\n#lxClock,\n.lx-clock,\n.topbar > .lx-clock,\n.topbar [id=\"lxClock\"]{\n  display:none!important;\n  visibility:hidden!important;\n  width:0!important;\n  min-width:0!important;\n  max-width:0!important;\n  height:0!important;\n  min-height:0!important;\n  max-height:0!important;\n  padding:0!important;\n  margin:0!important;\n  border:0!important;\n  overflow:hidden!important;\n  opacity:0!important;\n  pointer-events:none!important;\n}\n\/* Keep the two explicit timezone clocks clean and consistent. *\/\n.v25-timebar{\n  display:flex!important;\n  gap:10px!important;\n  align-items:center!important;\n  justify-content:flex-end!important;\n  flex:0 1 auto!important;\n  margin-left:auto!important;\n  margin-right:10px!important;\n}\n.v25-clock-card{\n  display:grid!important;\n  align-content:center!important;\n  min-height:66px!important;\n  min-width:176px!important;\n  padding:10px 14px!important;\n}\n.v25-clock-card .tz{line-height:1.1!important;white-space:nowrap!important}\n.v25-clock-card .time{line-height:1.05!important;white-space:nowrap!important}\n.v25-clock-card .date{line-height:1.2!important;white-space:nowrap!important}\n\/* Button alignment cleanup across current toolbars without changing page structure. *\/\n#actions,\n.topActions,\n.rowActions,\n.cardHeader,\n.v22-title-row,\n.v24-target-actions,\n.v26-ts-table-title,\n.v25-backup-title{\n  align-items:center!important;\n}\n#actions,\n.topActions,\n.rowActions,\n.v24-target-actions{\n  display:flex!important;\n  gap:8px!important;\n  flex-wrap:wrap!important;\n}\n#actions .btn,\n.topActions .btn,\n.rowActions .btn,\n.v22-title-row .btn,\n.v24-target-actions .btn,\n.v26-ts-table-title .btn,\n.v25-backup-title .btn{\n  display:inline-flex!important;\n  align-items:center!important;\n  justify-content:center!important;\n  vertical-align:middle!important;\n  line-height:1.1!important;\n}\n\/* Add Another Employee row: label\/select\/buttons share the same baseline and height. *\/\n.v24-target-toolbar{\n  align-items:end!important;\n}\n.v24-target-toolbar .field{\n  display:flex!important;\n  flex-direction:column!important;\n  justify-content:flex-end!important;\n  min-width:0!important;\n}\n.v24-target-toolbar .select,\n.v24-target-toolbar .btn{\n  height:66px!important;\n  min-height:66px!important;\n  box-sizing:border-box!important;\n}\n.v24-target-toolbar .btn{\n  paddi tent=b.time;\n    if(byId('v25MosulDate')) byId('v25MosulDate').textContent=b.date;\n    if(byId('v25TexasTime')) byId('v25TexasTime').textContent=t.time;\n    if(byId('v25TexasDate')) byId('v25TexasDate').textContent=t.date;\n    if(byId('v25BackupMosulTime')) byId('v25BackupMosulTime').textContent=b.time;\n    if(byId('v25BackupMosulDate')) byId('v25BackupMosulDate').textContent=b.date;\n    if(byId('v25BackupTexasTime')) byId('v25BackupTexasTime').textContent=t.time;\n    if(byId('v25BackupTexasDate')) byId('v25BackupTexasDate').textContent=t.date;\n  }\n  function alignButtonRows(){\n    document.querySelectorAll('#actions,.topActions,.rowActions,.v24-target-actions').forEach(row=>{\n      row.style.alignItems='center';\n    });\n  }\n  \/* prevent older chrome helper from recreating the untitled local clock *\/\n  const oldInject=window.injectChrome;\n  if(typeof oldInject==='function'){\n    window.injectChrome=function(){oldInject.apply(this,arguments);removeUntitledClock();ensureTwoClocks();alignButtonRows();};\n    try{injectChrome=window.injectChrome}catch(e){}\n  }\n  const oldTick=window.tickClock;\n  if(typeof oldTick==='function'){\n    window.tickClock=function(){removeUntitledClock();};\n    try{tickClock=window.tickClock}catch(e){}\n    if(window.__lxClockInt){clearInterval(window.__lxClockInt);window.__lxClockInt=null;}\n  }\n  const oldRender=window.render;\n  window.render=function(){if(typeof oldRender==='function') oldRender.apply(this,arguments);ensureTwoClocks();alignButtonRows();};\n  try{render=window.render}catch(e){}\n  const oldActions=window.renderActions;\n  window.renderActions=function(){if(typeof oldActions==='function') oldActions.apply(this,arguments);ensureTwoClocks();alignButtonRows();};\n  try{renderActions=window.renderActions}catch(e){}\n  document.addEventListener('DOMContentLoaded',()=>{ensureTwoClocks();alignButtonRows();});\n  setInterval(()=>{ensureTwoClocks();alignButtonRows();},1000);\n  setTimeout(()=>{ensureTwoClocks();alignButtonRows();},50);\n})();\n<\/script>\n\n\n\n<!-- v28: fix sidebar undefined icon \/ Import Export nav label only -->\n<style id=\"v28-nav-fix-style\">\n.nav button{\n  grid-template-columns:28px minmax(0,1fr)!important;\n  align-items:center!important;\n  column-gap:10px!important;\n}\n.nav button small{display:none!important}\n.nav .v28-nav-icon{\n  width:28px;height:28px;border-radius:9px;display:grid;place-items:center;\n  font-weight:950;font-size:16px;line-height:1;flex:none;\n}\n.nav button.active .v28-nav-icon,.nav button:hover .v28-nav-icon{background:rgba(0,0,0,.08)}\n.nav .v28-nav-label{\n  display:block;font-weight:950;line-height:1.12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\n}\n<\/style>\n<script id=\"v28-nav-fix-script\">\n(function(){\n  function safeText(s){return String(s==null?'':s).replace(\/[&<>\"']\/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]})}\n  function iconFor(id){\n    return ({dashboard:'▦',clock:'◷',live:'●',schedule:'▤',performance:'◫',timesheet:'◴',approvals:'⇄',people:'♙',rules:'☑',reports:'▣',backup:'⇅'}[id]||'◆');\n  }\n  function cleanTitle(title,id){\n    var t=String(title||id||'').replace(\/undefined\/gi,'').trim();\n    if(id==='backup') return 'Import \/ Export';\n    if(id==='timesheet') return 'Timesheet';\n    return t||String(id||'');\n  }\n  window.renderShell=function(){\n    try{\n      var ui=document.getElementById('userInitials'), su=document.getElementById('sideUser'), sr=document.getElementById('sideRole');\n      if(window.currentUser||(typeof currentUser!=='undefined'&&currentUser)){\n        var u=(typeof currentUser!=='undefined'?currentUser:window.currentUser);\n        if(ui && typeof initials==='function') ui.textContent=initials(u.name||'');\n        if(su) su.textContent=u.name||'';\n        if(sr) sr.textContent=(u.access||'')+' · '+(u.role||'');\n      }\n      var nav=document.getElementById('nav'); if(!nav) return;\n      nav.innerHTML='';\n      (typeof pages!=='undefined'?pages:[]).forEach(function(p){\n        var id=p[0], title=cleanTitle(p[1],id), desc=p[2], perm=p[3];\n        if(typeof has==='function' && !has(perm)) return;\n        var b=document.createElement('button');\n        b.className=(id===(typeof activePage!=='undefined'?activePage:window.activePage))?'active':'';\n        b.dataset.page=id;\n        b.title=String(desc||title||'');\n        b.innerHTML='<span class=\"v28-nav-icon\">'+safeText(iconFor(id))+'<\/span><span class=\"v28-nav-label\">'+safeText(title)+'<\/span>';\n        b.onclick=function(){\n          try{activePage=id}catch(e){window.activePage=id}\n          document.getElementById('sidebar')?.classList.remove('open');\n          if(typeof render==='function') render();\n        };\n        nav.appendChild(b);\n      });\n      var active=(typeof pages!=='undefined'?pages:[]).find(function(x){return x[0]===(typeof activePage!=='undefined'?activePage:window.activePage)});\n      var h=document.getElementById('pageH'), pp=document.getElementById('pageP');\n      if(h) h.textContent=active?cleanTitle(active[1],active[0]):'';\n      if(pp) pp.textContent=(active&&active[2])||'';\n    }catch(e){console.warn('v28 nav render failed',e)}\n  };\n  try{renderShell=window.renderShell}catch(e){}\n  function patchExistingNav(){\n    document.querySelectorAll('.nav button').forEach(function(btn){\n      btn.innerHTML=btn.innerHTML.replace(\/undefined\/gi,'').trim();\n      var first=btn.querySelector('span');\n      if(first && (!first.textContent.trim() || first.textContent.trim().toLowerCase()==='undefined')) first.textContent='◆';\n      btn.querySelectorAll('small').forEach(function(s){s.remove()});\n    });\n  }\n  var oldRender=window.render;\n  if(typeof oldRender==='function'){\n    window.render=function(){var r=oldRender.apply(this,arguments);try{window.renderShell();patchExistingNav()}catch(e){}return r};\n    try{render=window.render}catch(e){}\n  }\n  setTimeout(function(){try{window.renderShell();patchExistingNav()}catch(e){}},50);\n})();\n<\/script>\n\n<style id=\"larsa-v29-friendly-refresh\">\n\/* ================================================================\n   LARSA STAFF CONTROL — v29 FRIENDLY VISUAL REFRESH (purely additive)\n   Softer neutrals, warmer whitespace, colour-coded navigation and\n   status cues, rounder shapes, calmer shadows. No markup\/JS touched;\n   every rule below only restyles what already exists.\n   ================================================================ *\/\n\n:root{\n  --bg:#f7f7f5;--panel:#ffffff;--soft:#f0f0ee;--line:#e4e3df;\n  --ink:#17181b;--muted:#6b7280;\n  --radius:24px;--radius2:16px;\n  --shadow:0 14px 34px rgba(30,30,28,.08);\n  --ok:#1a9f5c;--warn:#d97706;--danger:#dc2626;--info:#2f6fed;--accent:#2f6fed;\n  --nav-blue:rgba(59,130,246,.24);--nav-blue-ink:#a8c8ff;\n  --nav-green:rgba(34,197,94,.22);--nav-green-ink:#8fe3ac;\n  --nav-amber:rgba(245,158,11,.24);--nav-amber-ink:#fbd489;\n  --nav-neutral:rgba(255,255,255,.10);--nav-neutral-ink:#e7e8ec;\n}\nbody.dark{\n  --bg:#0d0f14;--panel:#171a21;--soft:#1d212a;--line:#2b303b;\n  --ink:#f3f4f6;--muted:#9aa2b1;\n  --shadow:0 14px 34px rgba(0,0,0,.4);\n}\n\n\/* ---- calmer base rhythm ---- *\/\nbody{line-height:1.5;-webkit-font-smoothing:antialiased}\n.content{padding:26px}\n.pageTitle h1{font-weight:850;letter-spacing:-.03em}\n.pageTitle p{opacity:.85}\n.card{border-radius:var(--radius);box-shadow:0 4px 16px rgba(20,20,20,.045)}\nbody.dark .card{box-shadow:0 4px 16px rgba(0,0,0,.3)}\n.card:hover{box-shadow:0 14px 30px rgba(20,20,20,.09)}\nbody.dark .card:hover{box-shadow:0 14px 34px rgba(0,0,0,.45)}\n\n\/* ---- friendlier, rounder buttons ---- *\/\n.btn{border-radius:14px;font-weight:750}\n.btn.primary{background:var(--ink);border-color:var(--ink)}\n.btn.primary:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(20,20,20,.18)}\nbody.dark .btn.primary:hover{box-shadow:0 10px 22px rgba(0,0,0,.45)}\n\n\/* ---- login screen: soft, welcoming backdrop ---- *\/\n.loginScreen{\n  background:\n    radial-gradient(circle at 10% 10%, rgba(47,111,237,.10), transparent 42%),\n    radial-gradient(circle at 90% 15%, rgba(26,159,92,.09), transparent 40%),\n    radial-gradient(circle at 50% 100%, rgba(245,158,11,.06), transparent 45%),\n    var(--bg);\n}\n.brandBlock{position:relative;overflow:hidden}\n.brandBlock::after{\n  content:\"\";position:absolute;right:-70px;bottom:-70px;width:220px;height:220px;border-radius:50%;\n  background:radial-gradient(circle,rgba(47,111,237,.14),transparent 70%);pointer-events:none;\n}\n.brandLogo{box-shadow:0 10px 26px rgba(0,0,0,.18)}\n\n\/* ---- colour-coded, friendlier nav icons ---- *\/\n.nav .v28-nav-icon{background:var(--nav-neutral)!important;color:var(--nav-neutral-ink)!important;border-radius:10px}\n.nav button[data-page=\"dashboard\"] .v28-nav-icon,\n.nav button[data-page=\"schedule\"] .v28-nav-icon,\n.nav button[data-page=\"timesheet\"] .v28-nav-icon,\n.nav button[data-page=\"reports\"] .v28-nav-icon{background:var(--nav-blue)!important;color:var(--nav-blue-ink)!important}\n.nav button[data-page=\"clock\"] .v28-nav-icon,\n.nav button[data-page=\"live\"] .v28-nav-icon{background:var(--nav-green)!important;color:var(--nav-green-ink)!important}\n.nav button[data-page=\"performance\"] .v28-nav-icon,\n.nav button[data-page=\"approvals\"] .v28-nav-icon{background:var(--nav-amber)!important;color:var(--nav-amber-ink)!important}\n.nav button{border-radius:14px}\n.nav button.active .v28-nav-label{color:#000}\n\n\/* ---- KPI cards: gentle colour variety instead of one flat bar ---- *\/\n.grid .kpi:nth-of-type(4n+1)::before{background:linear-gradient(90deg,var(--info),transparent 75%)!important}\n.grid .kpi:nth-of-type(4n+2)::before{background:linear-gradient(90deg,var(--ok),transparent 75%)!important}\n.grid .kpi:nth-of-type(4n+3)::before{background:linear-gradient(90deg,var(--warn),transparent 75%)!important}\n.grid .kpi:nth-of-type(4n+4)::before{background:linear-gradient(90deg,var(--chart2),transparent 75%)!important}\n.kpi{border-radius:var(--radius2)}\n\n\/* ---- easier-to-scan tables ---- *\/\n.tableWrap{border-radius:var(--radius2);overflow:auto;border:1px solid var(--line)}\n.table{border-collapse:separate;border-spacing:0}\n.table thead th{background:var(--soft);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800}\n.table tbody tr:nth-child(even){background:var(--soft)}\n.table tbody tr:hover{background:rgba(47,111,237,.07)}\nbody.dark .table tbody tr:hover{background:rgba(59,130,246,.12)}\n\n\/* ---- calmer empty states ---- *\/\n.empty{padding:34px 18px;text-align:center;color:var(--muted);font-weight:700;\n  border:1.5px dashed var(--line);border-radius:var(--radius2);background:var(--soft)}\n\n\/* ---- badges: rounder pill, slightly bolder ---- *\/\n.badge{border-radius:999px;font-weight:800;letter-spacing:.01em}\n\n\/* ---- friendlier modal + drawer corners ---- *\/\n.modal{border-radius:var(--radius)}\n.lx-drawer{border-top-left-radius:var(--radius);border-bottom-left-radius:var(--radius)}\n<\/style>\n\n\n\n\n<style id=\"larsa-v29-cleanup-css\">\n\/* v29 cleanup: overflow protection only; keeps the existing visual design. *\/\n.cardTitle,.v22-title-row h3,.v22-title-row p,.v21-card h3,.v21-card h4,.btn,.badge,.nav button,.table th,.table td{overflow-wrap:anywhere;}\n.v22-title-row,.cardHeader{align-items:flex-start;}\n<\/style>\n<script id=\"larsa-v29-cleanup-script\">\n(function(){\n  'use strict';\n  try{document.title='Larsa Staff Control v29 — Cleaned';}catch(e){}\n  function all(sel,root){return Array.prototype.slice.call((root||document).querySelectorAll(sel));}\n  function isPerformancePage(){try{return typeof activePage!=='undefined' && activePage==='performance';}catch(e){return false;}}\n  function cleanDuplicateNav(){\n    var nav=document.querySelector('.nav'); if(!nav) return;\n    var seen={};\n    all('button',nav).forEach(function(btn){\n      var key=(btn.getAttribute('data-page')||btn.getAttribute('onclick')||btn.textContent||'').trim().replace(\/\\s+\/g,' ');\n      if(!key) return;\n      if(seen[key]) btn.remove(); else seen[key]=true;\n    });\n  }\n  function cleanPerformanceDuplicates(){\n    if(!isPerformancePage()) return;\n    var content=document.getElementById('content'); if(!content) return;\n    var legacy=document.getElementById('v21PerfAnalytics');\n    var hasNew=content.querySelector('.v22-section,.v22-kpi-grid,.v22-perf-summary');\n    if(legacy && hasNew) legacy.remove();\n    var conf=all('.v22-confidential,.v21-confidential',content);\n    if(conf.length>1){\n      var keep=conf.filter(function(x){return x.classList.contains('v22-confidential');}).pop() || conf[conf.length-1];\n      conf.forEach(function(x){\n        if(x===keep) return;\n        var wrap=x.closest('#v21PerfAnalytics');\n        (wrap||x).remove();\n      });\n    }\n    var seenSections={};\n    all('.v22-section',content).forEach(function(sec){\n      var h=sec.querySelector('h3');\n      var key=h?(h.textContent||'').trim().toLowerCase():'';\n      if(!key) return;\n      if(seenSections[key]) sec.remove(); else seenSections[key]=true;\n    });\n  }\n  function clean(){cleanDuplicateNav();cleanPerformanceDuplicates();}\n  function wrap(name){\n    var fn=window[name]; if(typeof fn!=='function' || fn.__v29CleanWrapped) return;\n    var wrapped=function(){var r=fn.apply(this,arguments); setTimeout(clean,0); return r;};\n    wrapped.__v29CleanWrapped=true; window[name]=wrapped;\n    try{eval(name+'=window[name]');}catch(e){}\n  }\n  document.addEventListener('DOMContentLoaded',function(){setTimeout(clean,0);});\n  wrap('render'); wrap('renderPerformance');\n  setTimeout(clean,0);\n  window.LarsaV29CleanDuplicates=clean;\n})();\n<\/script>\n\n\n\n<style id=\"larsa-v30-notes-missed-clock-manager-breaks-css\">\n\/* v30: clock notes, missed-clock correction requests, authorized clock-for-others,\n   and break tracking. Purely additive — nothing above is modified or removed. *\/\n.v30-note-field textarea{min-height:76px}\n.v30-secondary-link{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:transparent;border:1px dashed var(--line);color:var(--muted);font-size:12px;font-weight:800;padding:8px 12px;border-radius:12px}\n.v30-secondary-link:hover{color:var(--ink);border-color:var(--accent)}\n.v30-card{margin-top:16px}\n.v30-break-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:14px;padding:10px 14px;font-weight:800;font-size:13px;margin-top:12px}\nbody.dark .v30-break-banner{background:#2a1f12;border-color:#5c3d1a;color:#fdba74}\n.v30-break-row{display:flex;gap:8px;flex-wrap:wrap}\n.v30-other-row{display:grid;grid-template-columns:minmax(160px,1.4fr) minmax(110px,.8fr) auto;gap:8px;align-items:end}\n@media(max-width:700px){.v30-other-row{grid-template-columns:minmax(0,1fr)}}\n.v30-mini-status{font-size:12px;color:var(--muted);font-weight:800;margin-top:6px}\n<\/style>\n<script id=\"larsa-v30-notes-missed-clock-manager-breaks\">\n(function(){\n'use strict';\n\nfunction canManageAttendance(){\n  return !!(currentUser && (currentUser.access==='Super Admin' || currentUser.access==='Manager'\n    || (currentUser.permissions||[]).includes('People Manage')\n    || (currentUser.permissions||[]).includes('Approve Leave')));\n}\n\n\/\/ ---------------------------------------------------------------\n\/\/ Shared \"add an optional note\" modal — used by self clock in\/out,\n\/\/ break start\/end, and clocking another employee in\/out, so the\n\/\/ same one-tap note capture works everywhere the user asked for it.\n\/\/ ---------------------------------------------------------------\nfunction v30NoteModal(title, actionLabel, onConfirm){\n  const body = `<div class=\"field v30-note-field\"><label>Note (optional)<\/label><textarea class=\"textarea\" id=\"v30NoteText\" placeholder=\"Anything worth noting — running late, left early, worked from a job site, etc.\"><\/textarea><\/div>`;\n  window.__v30ConfirmWithNote = function(){\n    const note = (byId('v30NoteText')?.value || '').trim();\n    closeModal();\n    onConfirm(note);\n  };\n  window.__v30Skip = function(){ closeModal(); onConfirm(''); };\n  openModal(title, body, `<button class=\"btn\" onclick=\"window.__v30Skip()\">Skip note<\/button><button class=\"btn primary\" onclick=\"window.__v30ConfirmWithNote()\">${esc(actionLabel)}<\/button>`);\n}\n\n\/\/ ---------------------------------------------------------------\n\/\/ 1) Always-available note on the employee's own clock in\/out.\n\/\/    The visible button already calls clockToggle(type) directly from\n\/\/    the rendered markup, so clockToggle itself becomes the \"open the\n\/\/    note prompt\" step, and the note is attached once confirmed.\n\/\/ ---------------------------------------------------------------\nconst v30RealClockToggle = window.clockToggle;\nwindow.clockToggle = function(type){\n  if(!currentUser) return;\n  const latest=(state.logs||[]).filter(l=>l.uid===currentUser.id && (l.status==='In'||l.status==='Out')).sort((a,b)=>new Date(b.time)-new Date(a.time))[0];\n  const willClockIn = !(latest && latest.status==='In');\n  v30NoteModal(willClockIn?'Clocking in':'Clocking out', willClockIn?'Clock In':'Clock Out', function(note){\n    const before = state.logs.length;\n    v30RealClockToggle.call(this, type);\n    if(state.logs.length>before && note){ state.logs[state.logs.length-1].note = note; save(); }\n  });\n};\ntry{ clockToggle = window.clockToggle; }catch(e){}\n\n\/\/ ---------------------------------------------------------------\n\/\/ 2) Missed clock-in\/out correction request — tucked away, not part\n\/\/    of the main clock flow. Submits into the same approvals queue\n\/\/    used for Leave \/ Schedule Change, routed to the same approver\n\/\/    chain. Once fully approved, real In\/Out log entries are created\n\/\/    so attendance actually reflects the correction.\n\/\/ ---------------------------------------------------------------\nfunction v30OpenMissedClock(){\n  const today=new Date().toISOString().slice(0,10);\n  const body=`<div class=\"drawerGrid\">\n    <div class=\"field\"><label>Date<\/label><input class=\"input\" id=\"mcDate\" type=\"date\" value=\"${today}\"><\/div>\n    <div class=\"field\"><label>Mode<\/label><select class=\"select\" id=\"mcMode\"><option>Office<\/option><option>Remote<\/option><option>Site<\/option><\/select><\/div>\n    <div class=\"field\"><label>Clock In Time<\/label><input class=\"input\" id=\"mcIn\" type=\"time\" value=\"09:00\"><\/div>\n    <div class=\"field\"><label>Clock Out Time<\/label><input class=\"input\" id=\"mcOut\" type=\"time\" value=\"17:00\"><\/div>\n    <div class=\"field\" style=\"grid-column:1\/-1\"><label>What happened?<\/label><textarea class=\"textarea\" id=\"mcReason\" placeholder=\"Example: forgot to clock in this morning, phone was dead\"><\/textarea><\/div>\n  <\/div>`;\n  openModal('Submit a missed clock-in\/out correction', body, `<button class=\"btn\" onclick=\"closeModal()\">Cancel<\/button><button class=\"btn primary\" onclick=\"V30.submitMissedClock()\">Submit for Approval<\/button>`);\n}\nfunction v30SubmitMissedClock(){\n  const date=val('mcDate'), mode=val('mcMode'), inT=val('mcIn'), outT=val('mcOut'), reason=val('mcReason');\n  if(!date||!inT||!outT){ toast('Date, clock-in time, and clock-out time are all required.'); return; }\n  \/\/ from\/to are kept as plain \"HH:MM\" (same convention Leave requests already\n  \/\/ use), so the approval queue card reads \"09:00–17:00\" instead of raw ISO.\n  \/\/ Combined with r.date into a full timestamp only when actually approved.\n  const flow=(state.flowConfig[currentUser.id]?.Leave)||['u1'];\n  state.approvals.unshift(request('r'+Date.now(),'Missed Clock',currentUser.id,mode,date,inT,outT,reason||'Missed clock-in\/out correction','Pending',flow,0));\n  save(); closeModal(); toast('Correction request submitted for approval.');\n  if(typeof render==='function') render();\n}\nwindow.V30 = window.V30 || {};\nwindow.V30.openMissedClock = v30OpenMissedClock;\nwindow.V30.submitMissedClock = v30SubmitMissedClock;\n\n\/\/ When a \"Missed Clock\" request finishes its full approval chain, turn\n\/\/ it into real attendance history. Guarded by r.materialized so it only\n\/\/ ever fires once, even if approveReq is called again on an already-\n\/\/ approved record.\nconst v30RealApproveReq = window.approveReq;\nwindow.approveReq = function(id){\n  v30RealApproveReq.call(this, id);\n  const r=(state.approvals||[]).find(x=>x.id===id);\n  if(r && r.type==='Missed Clock' && r.status==='Approved' && !r.materialized){\n    const inIso=new Date(r.date+'T'+(r.from||'09:00')+':00').toISOString();\n    const outIso=new Date(r.date+'T'+(r.to||'17:00')+':00').toISOString();\n    state.logs.push({id:'l'+Date.now(),uid:r.uid,type:r.requestType||'Office',status:'In',time:inIso,active:false,lastSeen:inIso,note:'Approved missed-clock correction: '+(r.reason||'')});\n    state.logs.push({id:'l'+Date.now()+'b',uid:r.uid,type:r.requestType||'Office',status:'Out',time:outIso,active:false,lastSeen:outIso,note:'Approved missed-clock correction: '+(r.reason||'')});\n    r.materialized=true;\n    save();\n    toast('Correction approved — attendance record updated.');\n  }\n};\ntry{ approveReq = window.approveReq; }catch(e){}\n\n\/\/ ---------------------------------------------------------------\n\/\/ 3) Authorized people (Super Admin \/ Manager \/ People Manage \/\n\/\/    Approve Leave) can clock another employee in or out directly.\n\/\/ ---------------------------------------------------------------\nfunction v30OtherStatus(uid){\n  const latest=(state.logs||[]).filter(l=>l.uid===uid && (l.status==='In'||l.status==='Out')).sort((a,b)=>new Date(b.time)-new Date(a.time))[0];\n  return (latest && latest.status==='In') ? 'In' : 'Out';\n}\nfunction v30ClockOther(){\n  const uid=val('v30OtherEmp'); if(!uid) return;\n  const type=val('v30OtherMode')||'Office';\n  const willClockIn = v30OtherStatus(uid)==='Out';\n  const person=nameOf(uid);\n  v30NoteModal((willClockIn?'Clock in ':'Clock out ')+person, willClockIn?'Clock In':'Clock Out', function(note){\n    state.logs.push({id:'l'+Date.now(),uid,type,status:willClockIn?'In':'Out',time:new Date().toISOString(),active:willClockIn,lastSeen:new Date().toISOString(),note:note||undefined,clockedBy:currentUser.id});\n    save();\n    toast(`${esc(person)} ${willClockIn?'clocked in':'clocked out'} by ${esc(currentUser.name)}.`);\n    if(typeof render==='function') render();\n  });\n}\nwindow.V30.clockOther = v30ClockOther;\n\n\/\/ ---------------------------------------------------------------\n\/\/ 4) Break (lunch \/ coffee) tracking. Logged as its own status so it\n\/\/    never gets paired by the existing In\/Out session calculators —\n\/\/    this is informational tracking layered on top, not a change to\n\/\/    how worked hours are computed elsewhere in the app.\n\/\/ ---------------------------------------------------------------\nfunction v30OnBreak(uid){\n  const logs=(state.logs||[]).filter(l=>l.uid===uid && (l.status==='Break Start'||l.status==='Break End')).sort((a,b)=>new Date(b.time)-new Date(a.time));\n  return logs[0] && logs[0].status==='Break Start' ? logs[0] : null;\n}\nfunction v30ClockedIn(uid){\n  const last=(state.logs||[]).filter(l=>l.uid===uid && (l.status==='In'||l.status==='Out'))\n    .sort((a,b)=>new Date(b.time)-new Date(a.time))[0];\n  return !!(last && last.status==='In');\n}\nfunction v30ToggleBreak(){\n  if(!currentUser) return;\n  const active=v30OnBreak(currentUser.id);\n  \/\/ A break has to sit inside a shift. Ending one is always allowed so nobody\n  \/\/ can get stuck on break by clocking out first.\n  if(!active && !v30ClockedIn(currentUser.id)){\n    toast('Clock in first - a break has to sit inside a shift.');\n    return;\n  }\n  v30NoteModal(active?'Ending your break':'Starting a break', active?'End Break':'Start Break', function(note){\n    state.logs.push({id:'l'+Date.now(),uid:currentUser.id,type:'Break',status:active?'Break End':'Break Start',time:new Date().toISOString(),note:note||undefined});\n    save();\n    toast(active?'Break ended.':'Break started — lunch or coffee, your call.');\n    if(typeof render==='function') render();\n  });\n}\nwindow.V30.toggleBreak = v30ToggleBreak;\n\n\/\/ ---------------------------------------------------------------\n\/\/ Injects everything above into the Clock page, after whatever the\n\/\/ existing renderClock chain already drew — same convention every\n\/\/ earlier patch in this file uses so nothing here is ever clobbered\n\/\/ by the next full re-render.\n\/\/ ---------------------------------------------------------------\nfunction v30Inject(){\n  try{\n    if(typeof activePage!=='undefined' && activePage!=='clock') return;\n    const content=byId('content');\n    if(!currentUser || !content) return;\n    ['v30MissedClockWrap','v30ManagerCard','v30BreakBanner'].forEach(id=>byId(id)?.remove());\n\n    const onBreak=v30OnBreak(currentUser.id);\n    if(onBreak){\n      content.insertAdjacentHTML('beforeend', `<div id=\"v30BreakBanner\" class=\"v30-break-banner\"><span>On break since ${esc(new Date(onBreak.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}))}${onBreak.note?' · '+esc(onBreak.note):''}<\/span><button class=\"btn small\" onclick=\"V30.toggleBreak()\">End Break<\/button><\/div>`);\n    }else if(v30ClockedIn(currentUser.id)){\n      content.insertAdjacentHTML('beforeend', `<div id=\"v30BreakBanner\" class=\"rowActions v30-break-row\" style=\"margin-top:12px\"><button class=\"btn small\" onclick=\"V30.toggleBreak()\">Start Break (lunch \/ coffee)<\/button><\/div>`);\n    }\n\n    content.insertAdjacentHTML('beforeend', `<div id=\"v30MissedClockWrap\"><button type=\"button\" class=\"btn small v30-secondary-link\" onclick=\"V30.openMissedClock()\">Forgot to clock in or out on a previous day? Submit a correction request<\/button><\/div>`);\n\n    if(canManageAttendance()){\n      const others=(state.users||[]).filter(u=>u.enabled && u.id!==currentUser.id);\n      const optionsHtml=others.map(u=>`<option value=\"${u.id}\">${esc(u.name)} · ${esc(v30OtherStatus(u.id))}<\/option>`).join('');\n      content.insertAdjacentHTML('beforeend', `<div id=\"v30ManagerCard\" class=\"card v30-card\"><div class=\"cardHeader\"><h3 class=\"cardTitle\">Clock In \/ Out for Someone Else<\/h3><span class=\"badge black\">Authorized access<\/span><\/div><div class=\"v30-other-row\"><div class=\"field\"><label>Employee<\/label><select class=\"select\" id=\"v30OtherEmp\">${optionsHtml||'<option value=\"\">No other enabled employees<\/option>'}<\/select><\/div><div class=\"field\"><label>Mode<\/label><select class=\"select\" id=\"v30OtherMode\"><option>Office<\/option><option>Remote<\/option><option>Site<\/option><\/select><\/div><button class=\"btn primary\" onclick=\"V30.clockOther()\">Clock In \/ Out<\/button><\/div><div class=\"v30-mini-status\">Use this only for genuine cases — a phone left at the desk, a shared terminal, and similar. Every action is recorded with your name attached.<\/div><\/div>`);\n    }\n  }catch(e){ console.warn('v30 inject failed', e); }\n}\n\/\/ Wrapped defensively: if anything earlier in the render chain throws\n\/\/ (a bad record, a stray null, some future patch's bug), that error must\n\/\/ never swallow v30Inject() -- otherwise the note field, missed-clock\n\/\/ link, manager card, and break banner would silently stop appearing\n\/\/ with no visible sign of why.\nconst v30PrevRenderClock = window.renderClock;\nif(typeof v30PrevRenderClock==='function'){\n  window.renderClock=function(){\n    try{ v30PrevRenderClock.apply(this,arguments); }catch(e){ console.warn('v30: renderClock chain threw', e); }\n    v30Inject();\n  };\n  try{ renderClock = window.renderClock; }catch(e){}\n}\nconst v30PrevRender = window.render;\nif(typeof v30PrevRender==='function'){\n  window.render=function(){\n    try{ v30PrevRender.apply(this,arguments); }catch(e){ console.warn('v30: render chain threw', e); }\n    v30Inject();\n  };\n  try{ render = window.render; }catch(e){}\n}\nsetTimeout(v30Inject,0);\n\/\/ Belt-and-suspenders: re-assert the injected elements every few seconds\n\/\/ while on the Clock page, in case some path updates #content without\n\/\/ going through render()\/renderClock() at all. v30Inject() itself is\n\/\/ cheap and idempotent (it removes its own nodes before re-adding them).\nif(!window.__v30Poll){\n  window.__v30Poll = setInterval(()=>{ if(currentUser && activePage==='clock') v30Inject(); }, 4000);\n}\n})();\n<\/script>\n\n\n\n<style id=\"larsa-v31-correction-requests-css\">\n.v31-type-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:4px}\n@media(max-width:640px){.v31-type-grid{grid-template-columns:minmax(0,1fr)}}\n.v31-type{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:transparent;cursor:pointer}\n.v31-type b{font-size:13px;font-weight:800;color:var(--ink)}\n.v31-type span{font-size:11px;color:var(--muted);font-weight:600}\n.v31-type.on{border-color:var(--ink);background:rgba(0,0,0,.04)}\nbody.dark .v31-type.on{background:rgba(255,255,255,.07)}\n.v31-hint{font-size:12px;color:var(--muted);font-weight:700;margin-top:6px}\n<\/style>\n<script id=\"larsa-v31-correction-requests\">\n(function(){\n'use strict';\n\n\/\/ ---------------------------------------------------------------\n\/\/ Generalises the v30 \"missed clock\" request into one correction\n\/\/ request that also covers a forgotten break and extra hours that\n\/\/ were worked but never clocked. Every type carries a required\n\/\/ reason, and every one is routed through the SAME approval chain\n\/\/ the employee already has configured -- nothing here bypasses an\n\/\/ approver. Approval is what writes the attendance record; until\n\/\/ then nothing touches the person's hours.\n\/\/ ---------------------------------------------------------------\n\nconst TYPES = {\n  'Missed Clock': {\n    label: 'Missed clock in \/ out',\n    blurb: 'Forgot to clock in or out on a day you worked',\n    fromLabel: 'Clock In Time', toLabel: 'Clock Out Time',\n    fromDefault: '09:00', toDefault: '17:00', mode: true,\n  },\n  'Missed Break': {\n    label: 'Unrecorded break',\n    blurb: 'Took lunch or a coffee break without recording it',\n    fromLabel: 'Break Started', toLabel: 'Break Ended',\n    fromDefault: '12:00', toDefault: '12:30', mode: false,\n  },\n  'Extra Hours': {\n    label: 'Add hours worked',\n    blurb: 'Worked hours that were never captured by the clock',\n    fromLabel: 'Worked From', toLabel: 'Worked To',\n    fromDefault: '17:00', toDefault: '19:00', mode: true,\n  },\n};\n\nlet picked = 'Missed Clock';\n\nfunction fieldsHtml(){\n  const cfg = TYPES[picked];\n  const today = new Date().toISOString().slice(0,10);\n  const prevDate = byId('v31Date')?.value || today;\n  const prevReason = byId('v31Reason')?.value || '';\n  return `<div class=\"drawerGrid\">\n    <div class=\"field\"><label>Date<\/label><input class=\"input\" id=\"v31Date\" type=\"date\" value=\"${esc(prevDate)}\"><\/div>\n    ${cfg.mode?`<div class=\"field\"><label>Mode<\/label><select class=\"select\" id=\"v31Mode\"><option>Office<\/option><option>Remote<\/option><option>Site<\/option><\/select><\/div>`:'<div class=\"field\"><\/div>'}\n    <div class=\"field\"><label>${esc(cfg.fromLabel)}<\/label><input class=\"input\" id=\"v31From\" type=\"time\" value=\"${esc(cfg.fromDefault)}\"><\/div>\n    <div class=\"field\"><label>${esc(cfg.toLabel)}<\/label><input class=\"input\" id=\"v31To\" type=\"time\" value=\"${esc(cfg.toDefault)}\"><\/div>\n    <div class=\"field\" style=\"grid-column:1\/-1\"><label>Reason \/ note (required)<\/label><textarea class=\"textarea\" id=\"v31Reason\" placeholder=\"Explain briefly — your approver sees exactly this.\">${esc(prevReason)}<\/textarea><\/div>\n  <\/div>\n  <div class=\"v31-hint\">This goes to your approval chain. Your attendance record only changes once it is fully approved.<\/div>`;\n}\n\nfunction bodyHtml(){\n  const chips = Object.keys(TYPES).map(k=>\n    `<button type=\"button\" class=\"v31-type ${k===picked?'on':''}\" onclick=\"V31.pick('${k}')\"><b>${esc(TYPES[k].label)}<\/b><span>${esc(TYPES[k].blurb)}<\/span><\/button>`\n  ).join('');\n  return `<div class=\"v31-type-grid\">${chips}<\/div><div id=\"v31Fields\">${fieldsHtml()}<\/div>`;\n}\n\nfunction open(){\n  picked = 'Missed Clock';\n  openModal('Submit a correction request', bodyHtml(),\n    `<button class=\"btn\" onclick=\"closeModal()\">Cancel<\/button><button class=\"btn primary\" onclick=\"V31.submit()\">Submit for Approval<\/button>`);\n}\n\nfunction pick(type){\n  if(!TYPES[type]) return;\n  picked = type;\n  \/\/ Redraw only the parts that change so anything already typed survives.\n  const modal = byId('v31Fields')?.closest('.modal, .modalBody, .drawer') || document;\n  const grid = modal.querySelector ? modal.querySelector('.v31-type-grid') : null;\n  if(grid){\n    grid.querySelectorAll('.v31-type').forEach((btn,i)=>{\n      btn.classList.toggle('on', Object.keys(TYPES)[i]===picked);\n    });\n  }\n  const holder = byId('v31Fields');\n  if(holder) holder.innerHTML = fieldsHtml();\n}\n\nfunction submit(){\n  const date = val('v31Date'), from = val('v31From'), to = val('v31To');\n  const reason = (val('v31Reason')||'').trim();\n  const mode = TYPES[picked].mode ? (val('v31Mode')||'Office') : 'Break';\n  if(!date || !from || !to){ toast('Date and both times are required.'); return; }\n  if(!reason){ toast('Please add a short reason — your approver needs the context.'); return; }\n  if(to <= from){ toast('The end time has to be after the start time.'); return; }\n  const flow = (state.flowConfig[currentUser.id]?.Leave) || ['u1'];\n  state.approvals.unshift(\n    request('r'+Date.now(), picked, currentUser.id, mode, date, from, to, reason, 'Pending', flow, 0)\n  );\n  save(); closeModal();\n  toast('Correction request submitted for approval.');\n  if(typeof render==='function') render();\n}\n\nwindow.V31 = { open, pick, submit };\n\n\/\/ Point the existing v30 entry button at the richer request modal.\nif(window.V30) window.V30.openMissedClock = open;\n\n\/\/ ---------------------------------------------------------------\n\/\/ Approval side: turn a fully-approved request into real records.\n\/\/ Runs AFTER the v30 handler, and both guard on r.materialized, so\n\/\/ a request can never be written into attendance twice.\n\/\/ ---------------------------------------------------------------\nconst prevApprove = window.approveReq;\nwindow.approveReq = function(id){\n  prevApprove.call(this, id);\n  const r = (state.approvals||[]).find(x=>x.id===id);\n  if(!r || r.status!=='Approved' || r.materialized) return;\n  if(!TYPES[r.type]) return;\n\n  const iso = (t)=> new Date(r.date+'T'+(t||'00:00')+':00').toISOString();\n  const stamp = 'Approved correction ('+r.type+'): '+(r.reason||'');\n  const base = { uid:r.uid, active:false, note:stamp, correctionId:r.id };\n\n  if(r.type==='Missed Break'){\n    state.logs.push({...base, id:'l'+Date.now(),    type:'Break', status:'Break Start', time:iso(r.from), lastSeen:iso(r.from)});\n    state.logs.push({...base, id:'l'+Date.now()+'b',type:'Break', status:'Break End',   time:iso(r.to),   lastSeen:iso(r.to)});\n  }else{\n    const mode = r.requestType || 'Office';\n    state.logs.push({...base, id:'l'+Date.now(),    type:mode, status:'In',  time:iso(r.from), lastSeen:iso(r.from)});\n    state.logs.push({...base, id:'l'+Date.now()+'b',type:mode, status:'Out', time:iso(r.to),   lastSeen:iso(r.to)});\n  }\n  r.materialized = true;\n  save();\n  toast('Approved — the attendance record has been updated.');\n};\ntry{ approveReq = window.approveReq; }catch(e){}\n\n\/\/ Relabel the v30 button so it advertises everything it now covers.\nfunction v31Relabel(){\n  try{\n    const btn = byId('v30MissedClockWrap')?.querySelector('button');\n    if(btn) btn.textContent = 'Forgot to clock in, log a break, or add hours? Submit a correction request';\n  }catch(e){}\n}\nconst prevRender = window.render;\nif(typeof prevRender==='function'){\n  window.render=function(){\n    try{ prevRender.apply(this,arguments); }catch(e){ console.warn('v31: render chain threw', e); }\n    v31Relabel();\n  };\n  try{ render = window.render; }catch(e){}\n}\nconst prevRenderClock = window.renderClock;\nif(typeof prevRenderClock==='function'){\n  window.renderClock=function(){\n    try{ prevRenderClock.apply(this,arguments); }catch(e){ console.warn('v31: renderClock chain threw', e); }\n    v31Relabel();\n  };\n  try{ renderClock = window.renderClock; }catch(e){}\n}\nsetTimeout(v31Relabel,0);\nsetInterval(v31Relabel, 4000);\n})();\n<\/script>\n\n<\/body><\/html>\n"
  </script>
