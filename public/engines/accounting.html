<script>
/* ============================================================
   V35 — Monthly Revenue / Costs / Net Profit bar charts
   Requested for the Company dashboard and for the USA and Iraq
   accounting sections specifically: three always-visible bar charts
   (revenue, expenses & costs, net profit), one bar per month, default
   to the last 12 months with a custom range available. Additive only
   -- nothing existing is edited, everything here is appended on top
   the same way every earlier vNN patch in this file works.
   ============================================================ */

// A month key ("YYYY-MM") for every month from `from` to `to` inclusive, so a
// month with zero activity still draws its own empty bar. v33MonthlyItems
// (used by the existing dashboard chart pair) only returns months that
// already have a row in them, which silently compresses gaps -- fine for a
// glance, wrong for "one bar per month" on a fixed range.
function v35MonthKeys(from, to) {
  const out = [];
  const cur = new Date(`${from}-01T00:00:00`);
  const end = new Date(`${to}-01T00:00:00`);
  if (isNaN(cur.getTime()) || isNaN(end.getTime())) return out;
  while (cur <= end && out.length < 240) {
    out.push(`${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, "0")}`);
    cur.setMonth(cur.getMonth() + 1);
  }
  return out;
}
function v35MonthLabel(key) {
  const [y, m] = key.split("-").map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString(isAR() ? "ar" : "en", { month: "short", year: "2-digit" });
}
function v35Last12() {
  const now = new Date();
  const to = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
  const start = new Date(now.getFullYear(), now.getMonth() - 11, 1);
  const from = `${start.getFullYear()}-${String(start.getMonth() + 1).padStart(2, "0")}`;
  return { from, to };
}

/* Same operating-cost region convention already used by the USA/Iraq
   operating-cost list pages ("Shared" overhead sits with Iraq, not split) --
   matched here so this chart agrees with the ledger the user can already
   open and count by hand. */
function v35OperatingInScope(scope, region) {
  if (scope === "all") return true;
  if (scope === "USA") return region === "USA";
  return region === "Iraq" || region === "Shared" || !region;
}

/* Scoped monthly Revenue / Costs / Net, mirroring totals()'s own definition
   of Larsa's P&L (engineering revenue + consultancy fees, minus operating
   costs, payroll company cost, and sales commissions) but split by month and
   by region.

   Revenue is scoped off the revenue row's own `stream` field rather than its
   project link -- USA revenue rows no longer carry a project (job number
   replaced it), so `stream` is the one field guaranteed present on every row,
   old or new. Consultancy fees only ever apply to Iraq construction projects
   (see xFunding), so they only ever belong in the Iraq or company total.
   Commissions carry their own `region`, set once when the commission is
   derived from its revenue row, so they need no lookup at all. Payroll whose
   region is "International" belongs to neither USA nor Iraq, only company. */
function v35Series(scope, from, to) {
  const keys = v35MonthKeys(from, to);
  const rev = Object.fromEntries(keys.map((k) => [k, 0]));
  const cost = Object.fromEntries(keys.map((k) => [k, 0]));
  const bucket = (d) => { const k = String(d || "").slice(0, 7); return k in rev ? k : null; };
  const matches = (region) => scope === "all" || region === scope;

  (state.revenue || []).forEach((r) => {
    const k = r.status === "Received" ? bucket(r.date) : null;
    if (!k) return;
    const region = (r.stream || "").indexOf("USA") >= 0 ? "USA" : "Iraq";
    if (matches(region)) rev[k] += usd(r.amount, r.currency);
  });
  if (scope === "all" || scope === "Iraq") {
    (state.funding || []).forEach((f) => {
      const k = (!f.waived && ["Approved", "Received"].includes(f.status)) ? bucket(f.date) : null;
      if (k) rev[k] += usd(f.consultancyFee, f.currency, f.fxRate);
    });
  }
  const actual = (s) => ["Approved", "Paid", "Received"].includes(s);
  (state.operating || []).forEach((o) => {
    const k = actual(o.status) ? bucket(o.date) : null;
    if (k && v35OperatingInScope(scope, o.region)) cost[k] += usd(o.amount, o.currency);
  });
  (state.payroll || []).forEach((p) => {
    const k = !["Void", "Rejected"].includes(p.status) ? bucket(p.payDate) : null;
    if (k && matches(p.region)) cost[k] += usd(p.totalCompanyCost || p.grossPay || p.gross || 0, p.currency);
  });
  (state.commissions || []).forEach((c) => {
    const k = !["Void", "Rejected"].includes(c.status) ? bucket(c.date) : null;
    if (k && matches(c.region)) cost[k] += num(c.due);
  });

  return {
    revenue: keys.map((k) => ({ label: v35MonthLabel(k), value: round2(rev[k]) })),
    costs: keys.map((k) => ({ label: v35MonthLabel(k), value: round2(cost[k]) })),
    net: keys.map((k) => ({ label: v35MonthLabel(k), value: round2(rev[k] - cost[k]) })),
  };
}

// Each scope (company / USA / Iraq) remembers its own range choice, the same
// way the existing dashboard and P&L period pickers persist theirs.
function v35RangeState(scope) {
  state.settings.finCharts = state.settings.finCharts || {};
  if (!state.settings.finCharts[scope]) {
    const d = v35Last12();
    state.settings.finCharts[scope] = { preset: "last12", from: d.from, to: d.to };
  }
  return state.settings.finCharts[scope];
}
function v35SetRange(scope, field, value) {
  const cur = v35RangeState(scope);
  if (field === "preset") {
    cur.preset = value;
    if (value === "last12") { const d = v35Last12(); cur.from = d.from; cur.to = d.to; }
  } else {
    cur.preset = "custom";
    cur[field] = value;
  }
  save(); render();
}

// Shared by every chart block below (company/USA/Iraq, construction, payroll)
// so "Last 12 Months / Custom" only has one implementation and one look.
function v35RangeControls(key, cur) {
  return `<div class="filter-bar inline">
    <div class="seg">
      <button class="${cur.preset !== "custom" ? "on" : ""}" onclick="v35SetRange('${key}','preset','last12')">${T("Last 12 Months", "آخر 12 شهر")}</button>
      <button class="${cur.preset === "custom" ? "on" : ""}" onclick="v35SetRange('${key}','preset','custom')">${T("Custom", "مخصص")}</button>
    </div>
    ${cur.preset === "custom" ? `<input type="month" value="${cur.from}" onchange="v35SetRange('${key}','from',this.value)"> <span class="muted">${T("to", "إلى")}</span> <input type="month" value="${cur.to}" onchange="v35SetRange('${key}','to',this.value)">` : `<span class="muted small">${cur.from} — ${cur.to}</span>`}
  </div>`;
}

function v35ChartsBlock(scope, title) {
  const cur = v35RangeState(scope);
  const { revenue, costs, net } = v35Series(scope, cur.from, cur.to);
  return `<div class="page-head"><h2>${esc(title)}</h2></div>${v35RangeControls(scope, cur)}
    <div class="grid-3">
      ${card(T("Monthly Revenue", "الإيراد الشهري"), chBars(revenue, { color: C.rev }))}
      ${card(T("Monthly Expenses & Costs", "المصاريف والتكاليف الشهرية"), chBars(costs, { color: C.exp }))}
      ${card(T("Monthly Net Profit", "صافي الربح الشهري"), chBars(net, { signed: true }))}
    </div>`;
}

/* ============================================================
   V35B — Construction project charts (whole + per project) and
   Payroll & Commission charts. Same "always on, last 12 months or
   custom" pattern as V35 above, extended to:
     - Construction Funding (every construction project, combined)
     - each project's own Summary tab
     - the Payroll page (salaries vs. commissions vs. combined total)
   ============================================================ */
Object.assign(C, { mat: "#f0b429", lab: "#9c6ade" });

/* Revenue / Materials / Labor / Total / Net for whichever projects
   `matchesProject(projectId)` accepts -- one project, or every construction
   project at once. Mirrors xTotals()'s own field names (gross funding as
   revenue, exp+mat+lab as total, revenue+fee-direct as the project's result)
   but split by month, so this reads as the same numbers the Summary tab and
   Client Statement already show, just over time instead of as one snapshot.
   Larsa's own consultancy fee is included in revenue here for the same
   reason it is in xTotals.result -- it is money the project earned Larsa,
   even though it never reaches the construction trust balance. */
function v35ProjectLikeSeries(matchesProject, from, to) {
  const keys = v35MonthKeys(from, to);
  const rev = Object.fromEntries(keys.map((k) => [k, 0]));
  const mat = Object.fromEntries(keys.map((k) => [k, 0]));
  const lab = Object.fromEntries(keys.map((k) => [k, 0]));
  const exp = Object.fromEntries(keys.map((k) => [k, 0]));
  const bucket = (d) => { const k = String(d || "").slice(0, 7); return k in rev ? k : null; };
  const actual = (s) => ["Approved", "Paid", "Received"].includes(s);

  /* Each line converts at the rate captured on it (row.fxRate), falling back
     to the current setting for lines entered before that was recorded, so a
     past month stops being re-valued every time the rate moves. */
  (state.funding || []).forEach((f) => {
    const k = (matchesProject(f.projectId) && ["Approved", "Received"].includes(f.status)) ? bucket(f.date) : null;
    if (k) rev[k] += f.waived ? 0 : usd(f.consultancyFee, f.currency, f.fxRate);
  });
  (state.revenue || []).forEach((r) => {
    const k = (matchesProject(r.projectId) && r.status === "Received") ? bucket(r.date) : null;
    if (k) rev[k] += usd(r.amount, r.currency, r.fxRate);
  });
  (state.expenses || []).forEach((e) => {
    const k = (matchesProject(e.projectId) && actual(e.status)) ? bucket(e.date) : null;
    if (k) exp[k] += usd(e.amount, e.currency, e.fxRate);
  });
  (state.materials || []).forEach((m) => {
    const k = (matchesProject(m.projectId) && actual(m.status)) ? bucket(m.date) : null;
    if (k) mat[k] += usd(m.amount, m.currency, m.fxRate);
  });
  (state.projectLabor || []).forEach((l) => {
    const k = (matchesProject(l.projectId) && actual(l.status)) ? bucket(l.date) : null;
    if (k) lab[k] += usd(l.total, l.currency, l.fxRate);
  });

  return {
    revenue: keys.map((k) => ({ label: v35MonthLabel(k), value: round2(rev[k]) })),
    materials: keys.map((k) => ({ label: v35MonthLabel(k), value: round2(mat[k]) })),
    labor: keys.map((k) => ({ label: v35MonthLabel(k), value: round2(lab[k]) })),
    total: keys.map((k) => ({ label: v35MonthLabel(k), value: round2(exp[k] + mat[k] + lab[k]) })),
    net: keys.map((k) => ({ label: v35MonthLabel(k), value: round2(rev[k] - (exp[k] + mat[k] + lab[k])) })),
  };
}
function v35ProjectSeries(pid, from, to) {
  return v35ProjectLikeSeries((id) => id === pid, from, to);
}
// Same "construction" definition already used for the advanced workbook
// export (type Construction, or a project currently in the Execution phase).
function v35ConstructionProjects() {
  return new Set((state.projects || []).filter((p) => p.type === "Construction" || p.phase === "Execution").map((p) => p.id));
}
function v35ConstructionSeries(from, to) {
  const ids = v35ConstructionProjects();
  return v35ProjectLikeSeries((id) => ids.has(id), from, to);
}

function v35FiveChartsBlock(rangeKey, seriesFn, title) {
  const cur = v35RangeState(rangeKey);
  const s = seriesFn(cur.from, cur.to);
  return `<div class="page-head"><h2>${esc(title)}</h2></div>${v35RangeControls(rangeKey, cur)}
    <div class="grid-3">
      ${card(T("Monthly Revenue", "الإيراد الشهري"), chBars(s.revenue, { color: C.rev }))}
      ${card(T("Monthly Total Expenses", "إجمالي المصاريف الشهرية"), chBars(s.total, { color: C.exp }))}
      ${card(T("Monthly Net Profit", "صافي الربح الشهري"), chBars(s.net, { signed: true }))}
    </div>
    <div class="grid-2" style="margin-top:18px">
      ${card(T("Monthly Materials", "المواد الشهرية"), chBars(s.materials, { color: C.mat }))}
      ${card(T("Monthly Labor", "العمالة الشهرية"), chBars(s.labor, { color: C.lab }))}
    </div>`;
}

/* Payroll's own monthly trend: salaries, commissions, and the two combined.
   Company cost (not gross pay) is used for salaries so this agrees with the
   "Company payroll cost" KPI already shown on this page and with totals()'s
   own definition of payroll cost everywhere else. */
function v35PayrollSeries(from, to) {
  const keys = v35MonthKeys(from, to);
  const sal = Object.fromEntries(keys.map((k) => [k, 0]));
  const com = Object.fromEntries(keys.map((k) => [k, 0]));
  const bucket = (d) => { const k = String(d || "").slice(0, 7); return k in sal ? k : null; };
  (state.payroll || []).forEach((p) => {
    const k = !["Void", "Rejected"].includes(p.status) ? bucket(p.payDate) : null;
    if (k) sal[k] += usd(p.totalCompanyCost || p.grossPay || p.gross || 0, p.currency);
  });
  (state.commissions || []).forEach((c) => {
    const k = !["Void", "Rejected"].includes(c.status) ? bucket(c.date) : null;
    if (k) com[k] += num(c.due);
  });
  return {
    salaries: keys.map((k) => ({ label: v35MonthLabel(k), value: round2(sal[k]) })),
    commissions: keys.map((k) => ({ label: v35MonthLabel(k), value: round2(com[k]) })),
    totals: keys.map((k) => ({ label: v35MonthLabel(k), value: round2(sal[k] + com[k]) })),
  };
}
function v35PayrollChartsBlock() {
  const cur = v35RangeState("payroll");
  const { salaries, commissions, totals } = v35PayrollSeries(cur.from, cur.to);
  return `<div class="page-head"><h2>${T("Payroll &amp; Commission Trend", "اتجاه الرواتب والعمولات")}</h2></div>${v35RangeControls("payroll", cur)}
    <div class="grid-3">
      ${card(T("Monthly Salaries", "الرواتب الشهرية"), chBars(salaries, { color: C.rev }))}
      ${card(T("Monthly Commissions", "العمولات الشهرية"), chBars(commissions, { color: C.mat }))}
      ${card(T("Monthly Total Payroll Cost", "إجمالي تكلفة الرواتب الشهرية"), chBars(totals, { color: C.exp }))}
    </div>`;
}

// Non-destructive: each wrapped renderer still runs exactly as it did, this
// only appends HTML right after its page heading -- the same
// insertAdjacentHTML pattern renderDashboardEnterprise already uses above to
// layer a KPI row onto the base dashboard without touching its template.
// RENDERERS is read at call time (not captured early), so this safely wraps
// whatever the CURRENT renderer is for that id, however many earlier patches
// already replaced it -- payroll alone has been reassigned four times before
// this file reaches here.
function v35AppendHTML(rendererName, htmlFn) {
  const prev = RENDERERS[rendererName];
  RENDERERS[rendererName] = function () {
    prev();
    const head = document.querySelector("#view .page-head");
    if (head) head.insertAdjacentHTML("afterend", htmlFn());
  };
}
function v35AppendAll(rendererName, blocks) {
  v35AppendHTML(rendererName, () => blocks.map((b) => v35ChartsBlock(b.scope, b.title)).join(""));
}
const V35_TITLES = {
  all: T("Company Financial Trend", "الاتجاه المالي للشركة"),
  USA: T("USA Financial Trend", "الاتجاه المالي — أمريكا"),
  Iraq: T("Iraq Financial Trend", "الاتجاه المالي — العراق"),
};
v35AppendAll("dashboard", [{ scope: "all", title: V35_TITLES.all }]);
v35AppendAll("usRevenue", [{ scope: "USA", title: V35_TITLES.USA }]);
v35AppendAll("iqRevenue", [{ scope: "Iraq", title: V35_TITLES.Iraq }]);
// The Profit & Loss page is the "whole picture" view -- company, USA and Iraq
// all together, so nothing has to be pieced together across three screens.
v35AppendAll("master", [
  { scope: "all", title: V35_TITLES.all },
  { scope: "USA", title: V35_TITLES.USA },
  { scope: "Iraq", title: V35_TITLES.Iraq },
]);

// Construction Funding -- every construction project combined, the same
// revenue / total (materials + labor) / net-profit shape as above, plus the
// materials and labor split out on their own since those are the two costs
// this page (and this business) actually tracks by hand.
v35AppendHTML("funding", () => v35FiveChartsBlock(
  "construction",
  (from, to) => v35ConstructionSeries(from, to),
  T("Construction Financial Trend — All Projects", "الاتجاه المالي للتنفيذ — كل المشاريع"),
));

// Payroll -- salaries, commissions, and the two combined, month by month.
v35AppendHTML("payroll", () => v35PayrollChartsBlock());

// Each construction project gets its own copy of the same five charts, on
// its Summary tab only -- Materials/Labor/etc. already have their own ledger
// tabs, and repeating the charts there would just be noise. xRenderProject
// has been reassigned several times earlier in this file (v3.7, v3.10...);
// capturing it here, at the very end, wraps whichever version is actually
// live, the same way v35AppendHTML wraps whatever is live in RENDERERS.
(function () {
  const prevRenderProject = xRenderProject;
  xRenderProject = function () {
    prevRenderProject();
    if (window.xTab && window.xTab !== "summary") return;
    const pid = window.xProject;
    if (!pid) return;
    const head = document.querySelector("#view .page-head");
    if (head) {
      head.insertAdjacentHTML("afterend", v35FiveChartsBlock(
        `project:${pid}`,
        (from, to) => v35ProjectSeries(pid, from, to),
        T("Financial Trend", "الاتجاه المالي"),
      ));
    }
  };
})();

/* V35C -- safety net for the three chart blocks above.
   render() only ever dispatches to RENDERERS[activeSection]; it has no
   "project detail" section of its own -- opening a project calls
   xRenderProject() directly, outside render()'s dispatch entirely. But
   plenty of ordinary actions taken *while inside* a project (saving an
   edited record, for one -- see window.saveEditor's v3.12 wrapper) call
   plain render() themselves, which re-dispatches on activeSection (still
   "projects") and draws the PROJECT LIST over the detail view; those call
   sites then restore the detail with their own follow-up call. If any path
   into or out of a project ever calls render() without such a follow-up,
   the chart block appended above -- and the whole detail view with it --
   never comes back. This re-asserts all three chart blocks after every
   render() call and shortly after opening/switching a project, using the
   same "insert only if missing" guard v36AddRuntimeTools already relies on,
   so nothing is ever duplicated and a stale project's block never lingers
   after switching to another one. */
/* `where` picks the anchor. "head" puts the block straight under the page
   title, which suits a list page. "end" appends it after everything already on
   screen, which is what a project's Summary tab wants: the + Add Funding /
   Expense / Material / Labour buttons and the KPI row belong above the charts,
   not pushed down by them. */
function v35cInsertIfMissing(blockId, html, where) {
  if (document.getElementById(blockId)) return;
  const view = document.querySelector("#view");
  if (!view) return;
  if (where === "end") { view.insertAdjacentHTML("beforeend", html); return; }
  const head = view.querySelector(".page-head");
  if (head) head.insertAdjacentHTML("afterend", html);
}
function v35cEnsureCharts() {
  try {
    if (activeSection === "funding" && document.querySelector("#view .page-head")) {
      v35cInsertIfMissing("v35-construction-charts", `<div id="v35-construction-charts">${v35FiveChartsBlock(
        "construction",
        (from, to) => v35ConstructionSeries(from, to),
        T("Construction Financial Trend — All Projects", "الاتجاه المالي للتنفيذ — كل المشاريع"),
      )}</div>`, "end");
    }
    if (activeSection === "payroll" && document.querySelector("#view .page-head")) {
      v35cInsertIfMissing("v35-payroll-charts", `<div id="v35-payroll-charts">${v35PayrollChartsBlock()}</div>`, "end");
    }
    if (window.xProject) {
      const p = (state.projects || []).find((x) => x.id === window.xProject);
      const h1 = document.querySelector("#view .page-head h1");
      const onSummary = !window.xTab || window.xTab === "summary";
      if (p && h1 && onSummary && h1.textContent.trim() === String(p.name || "").trim()) {
        document.querySelectorAll('[id^="v35-project-charts-"]').forEach((el) => {
          if (el.id !== `v35-project-charts-${p.id}`) el.remove();
        });
        v35cInsertIfMissing(`v35-project-charts-${p.id}`, `<div id="v35-project-charts-${p.id}">${v35FiveChartsBlock(
          `project:${p.id}`,
          (from, to) => v35ProjectSeries(p.id, from, to),
          T("Financial Trend", "الاتجاه المالي"),
        )}</div>`, "end");
      }
    }
  } catch (e) { console.error("v35c chart safety net", e); }
}
(function () {
  const prevRenderAll = render;
  render = function () {
    const out = prevRenderAll.apply(this, arguments);
    try { v35cEnsureCharts(); } catch (e) { /* never block a normal render on this */ }
    return out;
  };
  ["openProjectDetail", "projectTab310"].forEach((name) => {
    const prev = window[name];
    if (typeof prev === "function") {
      window[name] = function () {
        const out = prev.apply(this, arguments);
        setTimeout(v35cEnsureCharts, 150);
        return out;
      };
    }
  });
})();
</script>

<!-- v4.0 Accounting upgrade: shared calculation core + Supabase-authoritative
     accounting layer (relational acct_* ledger, consultancy-fee engine,
     historical exchange-rate snapshots, refund settlement, protected
     approvals, append-only audit). Additive, same pattern as every earlier
     vNN patch; inert when Supabase is not configured. -->
<script src="accounting-core.js"></script>
<script src="accounting-cloud.js"></script>


<script>
/* ============================================================
   v3.14 — QA hardening layer
   1. Paid payroll is immutable: marking Paid needs the payroll approve
      permission and an Approved record; a Paid record cannot be edited,
      only reversed. The reversal is a stamped status change that keeps
      every figure of the original untouched.
   2. Cancelling an editor releases the linked-project lock, so the next
      entry is free to choose its own project.
   3. An edited form asks before it is discarded — backdrop click, ✕, or
      Close all confirm once real typing has happened.
   ============================================================ */
(function(){
  "use strict";

  // --- 1. paid payroll -------------------------------------------------
  const oldPaid = window.x33PaidPayroll;
  window.x33PaidPayroll = function(id){
    const p = (state.payroll||[]).find(x=>x.id===id);
    if(!p) return;
    if(!can("approve","payroll")){ xDenied(); return; }
    if(p.status!=="Approved"){
      alert(T("Only an approved payroll record can be marked paid.","فقط سجل رواتب معتمد يمكن تسجيله كمدفوع."));
      return;
    }
    return oldPaid.apply(this, arguments);
  };

  window.x33ReversePayroll = function(id, reason){
    const p = (state.payroll||[]).find(x=>x.id===id);
    if(!p) return;
    if(!can("approve","payroll")){ xDenied(); return; }
    if(p.status!=="Paid"){ alert(T("Only a paid record can be reversed.","فقط سجل مدفوع يمكن عكسه.")); return; }
    const why = reason!=null ? String(reason) : (prompt(T("Reason for reversing this payment (required):","سبب عكس هذه الدفعة (مطلوب):"))||"");
    if(!why.trim()){ alert(T("A reversal needs a reason.","العكس يحتاج إلى سبب.")); return; }
    /* The original figures are preserved exactly — only the status and the
       reversal stamps change, and every total already excludes "Reversed". */
    p.status = "Reversed";
    p.reversedBy = currentUser?.email || "";
    p.reversedAt = new Date().toISOString();
    p.reversalReason = why.trim();
    log("Payroll payment reversed", (p.employee||"") + " — " + why.trim(), "payroll", id);
    save(); render();
  };

  const oldOpenEditor = window.openEditor;
  window.openEditor = function(coll, id, seed){
    if(coll === "payroll" && id){
      const p = (state.payroll||[]).find(x=>x.id===id);
      if(p && ["Paid","Reversed"].includes(p.status)){
        alert(T("This payroll record is " + p.status.toLowerCase() + " and cannot be edited. Use Reverse to undo a payment; the original stays on record.","هذا السجل مدفوع ولا يمكن تعديله. استخدم (عكس) لإلغاء الدفع مع بقاء الأصل محفوظًا."));
        return;
      }
    }
    const out = oldOpenEditor.apply(this, arguments);
    window.__edDirty = false;
    return out;
  };

  const oldSaveEditor14 = window.saveEditor;
  window.saveEditor = async function(){
    if(typeof coll0 !== "undefined" && coll0 === "payroll" && typeof id0 !== "undefined" && id0){
      const p = (state.payroll||[]).find(x=>x.id===id0);
      if(p && ["Paid","Reversed"].includes(p.status)){
        alert(T("Paid payroll records are immutable.","سجلات الرواتب المدفوعة غير قابلة للتعديل."));
        return;
      }
    }
    window.__edDirty = false;
    return oldSaveEditor14.apply(this, arguments);
  };

  // --- 2 + 3. editor lifecycle ----------------------------------------
  document.addEventListener("input", function(ev){
    const root = document.getElementById("modalRoot");
    if(root && root.contains(ev.target)) window.__edDirty = true;
  }, true);

  const oldCloseEditor = window.closeEditor;
  window.closeEditor = function(){
    if(window.__edDirty){
      const stay = !confirm(T("Discard unsaved changes?","تجاهل التغييرات غير المحفوظة؟"));
      if(stay) return;
    }
    window.__edDirty = false;
    /* Cancelling a linked add must release the project lock; without this
       the NEXT editor for any collection opened anywhere was force-locked
       to the stale project and quietly posted against the wrong job. */
    window.__larsaReturnProjectId = "";
    window.__larsaReturnProjectTab = "";
    return oldCloseEditor.apply(this, arguments);
  };
})();
</script>
