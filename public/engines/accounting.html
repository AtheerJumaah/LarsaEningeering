  function addProjectPublishTools(){ if(activeSection!=='projects')return; const v=byId('view'); if(!v || byId('v35-pub-tools'))return; v.insertAdjacentHTML('afterbegin',`<div id="v35-pub-tools" class="v34-toolbar"><div class="left"><span class="v34-mini-title">${L('Public Website','الواجهة العامة')}</span><span class="muted small">${L('Select which projects appear before login.','حدد المشاريع التي تظهر قبل الدخول.')}</span></div><div class="right"><button class="btn ghost sm" onclick="v35OpenProjectPublisher()">${L('Publish / Unpublish Projects','نشر / إخفاء المشاريع')}</button></div></div>`); }
  const oldRender=render; render=function(){ oldRender(); if(currentUser)addProjectPublishTools(); };
  window.v35OpenProjectPublisher=function(){ const rows=(state.projects||[]).map(p=>`<label><input type="checkbox" value="${p.id}" ${p.isPublic?'checked':''}> ${H(p.code||'')} — ${H(p.name||'')} <span class="muted">${H(p.clientName||'')}</span></label>`).join(''); setHTML('modalRoot',`<div class="modal-back"><div class="modal"><div class="modal-head"><h3>${L('Public Projects','المشاريع العامة')}</h3><button class="mini" onclick="closeEditor()">×</button></div><div class="modal-body"><div class="v34-check-list" id="pub_pick">${rows||L('No projects yet.','لا توجد مشاريع بعد.')}</div></div><div class="modal-foot"><button class="btn ghost" onclick="closeEditor()">${L('Cancel','إلغاء')}</button><button class="btn" onclick="v35SavePublicProjects()">${L('Save','حفظ')}</button></div></div></div>`);document.body.classList.add('modal-open');};
  window.v35SavePublicProjects=function(){const ids=[...document.querySelectorAll('#pub_pick input:checked')].map(x=>x.value);(state.projects||[]).forEach(p=>p.isPublic=ids.includes(p.id));save();closeEditor();render();};

  // Targeted notifications and emails.
  //
  // state.users is NOT the real login roster -- blankState() always sets it
  // to [] (see v33OldBlank above) and nothing in this engine ever fills it
  // back in; only the person currently signed in gets mapped onto
  // `currentUser` for the session (see the host page's `mappedUser`). So
  // every group here ("Managers", "Accountants", ...) was matching against
  // an array that is always empty, and the "Selected Users" checklist had
  // nobody to list either -- hence "No recipients selected" on every send.
  // The real people live in the shared Larsa staff directory, the same
  // localStorage store edSalesPeople() already reads for the salesman /
  // engineer dropdowns. v35StaffRoster() reads that store instead, and
  // v35AccountingRole() mirrors accountingRole() from the host app (see
  // app/page.tsx) so "Managers" / "Accountants" / "Employees" match the same
  // access levels the rest of the system already uses.
  function v35AccountingRole(access){
    if(access==="Super Admin") return "Owner / Super Admin";
    if(access==="Manager") return "Management";
    if(access==="Accountant") return "Accountant";
    if(access==="Admin HR") return "Payroll Accountant";
    if(access==="Team Leader") return "Project Manager";
    if(access==="Construction Engineer") return "Construction Engineer";
    if(access==="Client") return "Client Viewer";
    if(access==="Viewer") return "Viewer";
    return "Engineer";
  }
  function v35StaffRoster(){
    const out=[];
    try{
      const staff=JSON.parse(localStorage.getItem("larsaStaffV8")||"{}");
      (staff.users||[]).forEach(u=>{
        if(!u||!u.name||u.enabled===false) return;
        const access=u.access||"Engineer";
        out.push({ id:u.id||("staff_"+u.name), name:u.name, email:u.email||"", access, role:v35AccountingRole(access) });
      });
    }catch(e){ /* staff store not written yet on this device */ }
    return out;
  }
  window.v35OpenTargetNotification=function(){
    const staff=v35StaffRoster(); const clients=(state.clientAccounts||[]).filter(c=>c.active!==false);
    const userChecks=staff.map(u=>`<label><input type="checkbox" value="user:${u.id}"> ${H(u.name)} <span class="muted">${H(u.role)}</span></label>`).join('');
    const clientChecks=clients.map(c=>`<label><input type="checkbox" value="client:${c.id}"> ${H(c.clientName||c.username)} <span class="muted">${H(c.username||'')}</span></label>`).join('');
    setHTML('modalRoot',`<div class="modal-back"><div class="modal"><div class="modal-head"><h3>${L('Send Targeted Notification','إرسال إشعار محدد')}</h3><button class="mini" onclick="closeEditor()">×</button></div><div class="modal-body"><div class="form-grid tight"><div class="field"><label>${L('Target Group','الفئة')}</label><select id="nt_group" onchange="v35ToggleTargetList()"><option value="selected">${L('Selected Users / Clients','مستخدمون / زبائن محددون')}</option><option value="allUsers">${L('All Users','كل المستخدمين')}</option><option value="clients">${L('All Clients','كل الزبائن')}</option><option value="accountants">${L('Accountants','المحاسبون')}</option><option value="managers">${L('Managers','الإدارة')}</option><option value="employees">${L('Employees','الموظفون')}</option></select></div><div class="field"><label>${L('Channel','القناة')}</label><select id="nt_channel"><option>In-App</option><option>Email Draft</option><option>Browser Notification</option></select></div><div class="field wide"><label>${L('Subject','الموضوع')}</label><input id="nt_subject"></div><div class="field wide"><label>${L('Message','الرسالة')}</label><textarea id="nt_msg" rows="4"></textarea></div></div><div id="nt_selected"><h3>${L('Users','المستخدمون')}</h3><div class="v34-check-list">${userChecks||L('No staff found on this device yet.','لا يوجد موظفون على هذا الجهاز بعد.')}</div><h3>${L('Clients','الزبائن')}</h3><div class="v34-check-list">${clientChecks||'—'}</div></div></div><div class="modal-foot"><button class="btn ghost" onclick="closeEditor()">${L('Cancel','إلغاء')}</button><button class="btn" onclick="v35SendTargetNotification()">${L('Send / Create','إرسال / إنشاء')}</button></div></div></div>`);document.body.classList.add('modal-open');
    v35ToggleTargetList();
  };
  window.v35ToggleTargetList=function(){ const e=byId('nt_selected'); if(e)e.style.display=byId('nt_group').value==='selected'?'block':'none'; };
  window.v35SendTargetNotification=function(){
    const group=byId('nt_group').value, ch=byId('nt_channel').value, subject=byId('nt_subject').value, message=byId('nt_msg').value;
    let targets=[];
    const staff=v35StaffRoster(), clients=(state.clientAccounts||[]).filter(c=>c.active!==false);
    if(group==='selected'){
      targets=[...document.querySelectorAll('#nt_selected input:checked')].map(x=>x.value).map(v=>{
        const [t,id]=v.split(':');
        return t==='user'?{type:'User',...(staff.find(u=>u.id===id)||{})}:{type:'Client',...(clients.find(c=>c.id===id)||{})};
      });
    } else if(group==='allUsers') targets=staff.map(u=>({type:'User',...u}));
    else if(group==='clients') targets=clients.map(c=>({type:'Client',...c}));
    else if(group==='accountants') targets=staff.filter(u=>u.access==='Accountant'||u.access==='Admin HR').map(u=>({type:'User',...u}));
    else if(group==='managers') targets=staff.filter(u=>u.access==='Super Admin'||u.access==='Manager'||u.access==='Team Leader').map(u=>({type:'User',...u}));
    else if(group==='employees') targets=staff.filter(u=>u.access==='Engineer'||u.access==='Construction Engineer'||u.access==='Viewer').map(u=>({type:'User',...u}));
    if(!targets.length){alert(L('No recipients selected.','لم يتم اختيار مستلمين.'));return;}
    if(!subject.trim()&&!message.trim()){alert(L('Add a subject or a message before sending.','أضف موضوعاً أو رسالة قبل الإرسال.'));return;}
    targets.forEach(t=>x33Notify({recipientType:t.type||'User',recipientId:t.id||'',recipientName:t.name||t.clientName||t.email||t.username||'',recipientEmail:t.email||'',channel:ch,subject,message,status:'Ready'}));
    save(); closeEditor(); activeSection='notifications'; render();
    alert(L(`Sent to ${targets.length} recipient${targets.length===1?'':'s'}.`,`تم الإرسال إلى ${targets.length} مستلم.`));
  };
  const oldNotif=renderNotifications; renderNotifications=function(){ oldNotif(); const h=document.querySelector('#view .page-head .rpt-actions'); if(h && !byId('v35-target-btn')) h.insertAdjacentHTML('beforeend',`<button id="v35-target-btn" class="btn" onclick="v35OpenTargetNotification()">${L('Send Targeted Notification','إرسال إشعار محدد')}</button>`);}; try{RENDERERS.notifications=renderNotifications}catch(e){}

  // Backup restore points and advanced import
  window.v35CreateRestorePoint=function(){const name=prompt(L('Restore point name','اسم نقطة الاسترجاع'),new Date().toLocaleString())||'Restore Point'; const snapshot=JSON.parse(JSON.stringify(state)); const count=Object.keys(snapshot).reduce((a,k)=>a+(Array.isArray(snapshot[k])?snapshot[k].length:0),0); state.restorePoints=state.restorePoints||[]; state.restorePoints.unshift({id:ID('rp'),createdAt:new Date().toISOString(),name,count,data:snapshot}); if(state.restorePoints.length>20)state.restorePoints.length=20; save(); render();};
  window.v35Rollback=function(id){const rp=(state.restorePoints||[]).find(x=>x.id===id); if(!rp)return; if(!confirm(L('Rollback to this restore point? Current data will be stored as a restore point first.','هل تريد الرجوع إلى نقطة الاسترجاع؟ سيتم حفظ البيانات الحالية كنقطة استرجاع أولاً.')))return; const cur=JSON.parse(JSON.stringify(state)); state=JSON.parse(JSON.stringify(rp.data)); state.restorePoints=state.restorePoints||[]; state.restorePoints.unshift({id:ID('rp'),createdAt:new Date().toISOString(),name:'Before rollback',count:0,data:cur}); normalize(); save(); render();};
  window.v35ImportBackupAdvanced=function(ev){ const file=ev.target.files?.[0]; if(!file)return; const reader=new FileReader(); reader.onload=function(){try{const imported=JSON.parse(reader.result); const mode=prompt(L('Type MERGE to merge, REPLACE to replace all, or FRESH to reset then import.','اكتب MERGE للدمج، REPLACE للاستبدال، أو FRESH للتصفير ثم الاستيراد.'),'MERGE'); if(!mode)return; v35CreateRestorePoint(); if(/^replace|fresh$/i.test(mode)){state=imported.data||imported.state||imported; normalize(); save(); render();} else {mergeState(imported.data||imported.state||imported); normalize(); save(); render();} alert(L('Import complete.','تم الاستيراد.'));}catch(e){alert(L('Invalid backup file.','ملف النسخة غير صحيح.'))}}; reader.readAsText(file); ev.target.value='';};
  const oldExport=exportBackup; exportBackup=function(){ const data=JSON.stringify({backupAppName:'Larsa Engineering Web/Mobile App',appSchemaVersion:V35_VERSION,backupCreatedAt:new Date().toISOString(),data:state},null,2); downloadText('larsa_backup_'+today35()+'.json',data,'application/json'); };

  // Supabase sync adapter: single-state JSON backup table for production readiness.
  async function loadSupabaseLib(){ if(window.supabase?.createClient)return window.supabase; await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=res;s.onerror=rej;document.head.appendChild(s);}); return window.supabase; }
  async function getSupabase(){ const url=state.settings.supabaseUrl, key=state.settings.supabaseAnonKey; if(!url||!key){alert(L('Add Supabase URL and Anon Key first.','أضف Supabase URL وAnon Key أولاً.')); return null;} const sb=await loadSupabaseLib(); return sb.createClient(url,key); }
  window.v35SaveSupabaseSettings=function(){state.settings.supabaseUrl=byId('v35_surl').value.trim();state.settings.supabaseAnonKey=byId('v35_skey').value.trim();state.settings.deploymentMode=byId('v35_smode').value;state.settings.emailVerification=byId('v35_verify').value==='yes';state.settings.supabaseEnabled=!!(state.settings.supabaseUrl&&state.settings.supabaseAnonKey);save();alert(L('Supabase settings saved.','تم حفظ إعدادات Supabase.'));};
  window.v35PushStateToSupabase=async function(){const sb=await getSupabase(); if(!sb)return; const payload={id:'primary',data:state,updated_at:new Date().toISOString(),schema_version:V35_VERSION}; const {error}=await sb.from('larsa_app_state').upsert(payload); if(error){alert(error.message);return;} await sb.from('larsa_backups').insert({name:'Manual backup '+new Date().toLocaleString(),data:state,schema_version:V35_VERSION}).catch?.(()=>{}); alert(L('State pushed to Supabase.','تم رفع البيانات إلى Supabase.'));};
  window.v35PullStateFromSupabase=async function(replace){const sb=await getSupabase(); if(!sb)return; const {data,error}=await sb.from('larsa_app_state').select('*').eq('id','primary').single(); if(error){alert(error.message);return;} v35CreateRestorePoint(); if(replace){state=data.data;normalize();save();render();alert(L('State replaced from Supabase.','تم الاستبدال من Supabase.'));} else {mergeState(data.data);normalize();save();render();alert(L('State merged from Supabase.','تم الدمج من Supabase.'));}};

  // Staff login: if Supabase is configured, allow email verification flow as optional sign-in fallback.
  const oldDoLogin=doLogin;
  doLogin=async function(){
    const em=(byId('loginEmail')?.value||'').toLowerCase(), pw=(byId('loginPass')?.value||'');
    let localUser=(state.users||[]).find(x=>String(x.email).toLowerCase()===em&&(x.pass||x.password)===pw);
    if(localUser || !state.settings.supabaseEnabled){ return oldDoLogin(); }
    try{const sb=await getSupabase(); if(!sb)return oldDoLogin(); const {data,error}=await sb.auth.signInWithPassword({email:em,password:pw}); if(error){byId('loginErr').textContent=error.message;return;} const profile=(state.users||[]).find(x=>String(x.email).toLowerCase()===em)||{id:data.user.id,name:em,email:em,pass:'',role:'Viewer',region:'Shared',active:true}; if(!state.users.some(x=>x.id===profile.id))state.users.push(profile); currentUser=profile; save(); byId('loginScreen').style.display='none'; byId('publicScreen')&&(byId('publicScreen').style.display='none'); byId('app').style.display='flex'; render();}catch(e){return oldDoLogin();}
  };
  window.v35SupabaseInviteUser=async function(email,password){ const sb=await getSupabase(); if(!sb)return; const {error}=await sb.auth.signUp({email,password}); if(error)alert(error.message); else alert(L('User created. If email verification is enabled, the user must verify email.','تم إنشاء المستخدم. إذا كان تفعيل البريد مفعلاً يجب عليه تأكيد البريد.')); };

  // On boot after original boot: public portal is the default public entry.
  document.addEventListener('DOMContentLoaded',function(){setTimeout(()=>{try{ if(!currentUser){v35ShowPublic();} const tb=document.querySelector('.tb-right'); if(tb && !byId('v35-home-btn')) tb.insertAdjacentHTML('afterbegin',`<button id="v35-home-btn" class="icon-btn" title="Public" onclick="v35ShowPublic()">⌂</button>`);}catch(e){console.error(e)}},0);});
})();
</script>


<script>
/* Larsa Enterprise v3.7 Production Clean patch
   - No public project gallery/media interface.
   - Custom access for users and clients.
   - Execution project interface language selection.
*/
(function(){
  const V36_VERSION='3.7.0-production-clean';
  function E(id){return document.getElementById(id)}
  function S(x){try{return typeof esc==='function'?esc(x):String(x??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));}catch(e){return String(x??'')}}
  function T(en,ar){try{return (typeof isAR==='function'&&isAR())?(ar||en):en}catch(e){return en}}
  function A(){try{return can('manageUsers','settings')||can('manageSettings','settings')||/super admin|owner/i.test(String(currentUser?.role||''))}catch(e){return false}}
  const CLIENT_PERMS=[
    ['viewProjects','View Assigned Projects','عرض المشاريع المسموحة'],
    ['viewFunding','View Funding','عرض التمويل'],
    ['viewStatement','View Statement','عرض كشف الحساب'],
    ['viewExpenses','View Expenses','عرض المصاريف'],
    ['viewMaterials','View Materials','عرض المواد'],
    ['viewLabor','View Labor','عرض العمالة'],
    ['viewDocuments','View Documents','عرض الملفات والروابط'],
    ['print','Print / PDF','طباعة / PDF'],
    ['exportCSV','Export CSV','تصدير CSV'],
    ['exportExcel','Export Excel','تصدير Excel'],
    ['receiveNotifications','Receive Notifications','استلام الإشعارات']
  ];
  const CLIENT_DEFAULT_PERMS={viewProjects:true,viewStatement:true,print:true,receiveNotifications:true};
  const USER_MODULES = (typeof XMOD!=='undefined'&&Array.isArray(XMOD))?XMOD:['dashboard','funding','revenue','operating','expenses','materials','labor','payroll','commissions','clients','reports','review','projects','suppliers','employees','boq','settings','notifications'];
  const USER_ACTIONS = (typeof XACT!=='undefined'&&Array.isArray(XACT))?XACT:['view','create','edit','delete','approve','export','manageUsers','manageSettings'];
  function clientPerm(c,k){ if(!c)return false; c.permissions=Object.assign({},CLIENT_DEFAULT_PERMS,c.permissions||{}); return !!c.permissions[k]; }
  function cleanPublicProjects(){ try{document.querySelectorAll('#v35-pub-tools,#pubProjects').forEach(x=>x.remove());}catch(e){} }

  const oldNormalize = typeof normalize==='function'?normalize:null;
  normalize=function(){ if(oldNormalize)oldNormalize(); try{v36Normalize(state)}catch(e){console.warn('v36 normalize',e)} };
  function v36Normalize(s){
    s.appSchemaVersion=V36_VERSION;
    s.settings=Object.assign({publicLandingMode:'simple',defaultExecutionLanguage:'system'},s.settings||{});
    s.clientAccounts=Array.isArray(s.clientAccounts)?s.clientAccounts:[];
    s.clientAccounts.forEach(c=>{ if(!c.id)c.id=(typeof ID==='function'?ID('cli'):'cli_'+Math.random().toString(36).slice(2)); if(!Array.isArray(c.projectIds))c.projectIds=[]; c.permissions=Object.assign({},CLIENT_DEFAULT_PERMS,c.permissions||{}); if(c.active===undefined)c.active=true; });
    (s.users||[]).forEach(u=>{ if(!u.permissions||typeof u.permissions!=='object')u.permissions={}; });
    (s.projects||[]).forEach(p=>{ if(!p.executionLanguage)p.executionLanguage='system'; });
    return s;
  }
  try{v36Normalize(state); save&&save();}catch(e){}

  // Public landing: no project photo/video/gallery. It is only a clean entry page + contact + install/login.
  window.v35ShowPublic=function(){
    try{ if(!state && typeof load==='function')load(); }catch(e){}
    let scr=E('publicScreen');
    if(!scr){scr=document.createElement('div');scr.id='publicScreen';document.body.appendChild(scr)}
    let client=E('clientScreen');
    if(!client){client=document.createElement('div');client.id='clientScreen';client.className='client-screen';document.body.appendChild(client)}
    const pub=state.publicSite||{};
    const phone=pub.phone||'';
    const wa=pub.whatsapp||'';
    const email=pub.email||'';
    const addr=pub.address||'';
    const contactRows=[[T('Phone','الهاتف'),phone],[T('WhatsApp','واتساب'),wa],[T('Email','البريد'),email],[T('Address','العنوان'),addr]].filter(r=>r[1]);
    scr.innerHTML=`<div class="pub-hero v36-public"><div class="pub-nav"><div class="pub-brand">${(typeof LOGO!=='undefined'&&LOGO)?`<img src="${LOGO}" alt="Larsa">`:''}<span>LARSA ENGINEERING</span></div><div class="pub-actions"><button class="btn ghost" onclick="v35ClientLoginModal()">${T('Client Login','دخول الزبون')}</button><button class="btn ghost" onclick="v35ShowLogin()">${T('Staff Login','دخول الموظفين')}</button><button class="btn" onclick="v35InstallApp()">${T('Install App','تنصيب التطبيق')}</button></div></div><div class="pub-title"><h1>${S(pub.heroTitle||'Larsa Engineering')}</h1><p>${S(pub.heroSubtitle||T('Engineering, architecture, construction management, and internal project control.','الهندسة والعمارة وإدارة التنفيذ والتحكم الداخلي بالمشاريع.'))}</p><div class="pub-actions" style="justify-content:center"><button class="btn" onclick="document.getElementById('pubContact')?.scrollIntoView({behavior:'smooth'})">${T('Open App','فتح التطبيق')}</button></div></div></div><div class="pub-section" id="pubContact"><h2>${T('Authorized Access','دخول مخول')}</h2><div class="pub-contact">${contactRows.length?contactRows.map(([k,v])=>`<div><span class="muted small">${S(k)}</span><br><b>${S(v)}</b></div>`).join(''):`<div><b>larsaeng.com</b></div>`}</div></div><div class="pub-footer">Larsa Engineering</div>`;
    try{E('app').style.display='none';E('loginScreen').style.display='none';client.style.display='none';scr.style.display='block';}catch(e){}
  };

  // Do not show public project publisher controls anymore.
  const prevRender = typeof render==='function'?render:null;
  render=function(){ if(prevRender)prevRender(); cleanPublicProjects(); try{v36AddRuntimeTools();}catch(e){console.warn(e)} };
  window.v35OpenProjectPublisher=function(){ alert(T('Public project gallery is disabled in this production version.','تم إلغاء واجهة عرض المشاريع العامة في نسخة العمل هذه.')); };

  // Client modal with custom access.
  function v36ClientModal(c){
    c=c||{id:'',clientName:'',username:'',pass:'',projectIds:[],active:true,permissions:Object.assign({},CLIENT_DEFAULT_PERMS)};
    c.permissions=Object.assign({},CLIENT_DEFAULT_PERMS,c.permissions||{});
    const opts=(state.projects||[]).map(p=>`<label><input type="checkbox" value="${S(p.id)}" ${(c.projectIds||[]).includes(p.id)?'checked':''}> ${S(p.code||p.name)} — ${S(p.clientName||'')}</label>`).join('');
    const perms=CLIENT_PERMS.map(([k,en,ar])=>`<label><input type="checkbox" id="cap_${k}" ${c.permissions[k]?'checked':''}> ${T(en,ar)}</label>`).join('');
    setHTML('modalRoot',`<div class="modal-back"><div class="modal" style="max-width:900px"><div class="modal-head"><h3>${c.id?T('Edit Client Login','تعديل دخول الزبون'):T('Add Client Login','إضافة دخول زبون')}</h3><button class="mini" onclick="closeEditor()">×</button></div><div class="modal-body"><div class="notice">${T('Client access is custom. It does not depend on staff roles. Super Admin chooses exactly what the client can see, print, or export.','صلاحيات الزبون مخصصة ولا تعتمد على أدوار الموظفين. المدير الأعلى يحدد بالضبط ما يستطيع الزبون مشاهدته أو طباعته أو تصديره.')}</div><div class="form-grid tight"><div class="field"><label>${T('Client Name','اسم الزبون')}</label><input id="ca_name" value="${S(c.clientName)}"></div><div class="field"><label>${T('Username','اسم المستخدم')}</label><input id="ca_user" value="${S(c.username)}"></div><div class="field"><label>${T('Password','كلمة المرور')}</label><input id="ca_pass" value="${S(c.pass||'')}"></div><div class="field"><label>${T('Active','فعال')}</label><select id="ca_active"><option value="yes" ${c.active!==false?'selected':''}>${T('Yes','نعم')}</option><option value="no" ${c.active===false?'selected':''}>${T('No','لا')}</option></select></div></div><h3>${T('Allowed Projects','المشاريع المسموحة')}</h3><div class="v34-check-list" id="ca_projects">${opts||T('No projects yet.','لا توجد مشاريع بعد.')}</div><h3>${T('Custom Client Access','صلاحيات الزبون المخصصة')}</h3><div class="v34-check-list" id="ca_permissions">${perms}</div></div><div class="modal-foot"><button class="btn ghost" onclick="closeEditor()">${T('Cancel','إلغاء')}</button><button class="btn" onclick="v36SaveClientAccount('${c.id||''}')">${T('Save','حفظ')}</button></div></div></div>`);document.body.classList.add('modal-open');
  }
  window.v35AddClientAccount=function(){ if(!A()){alert(T('You do not have permission.','ليست لديك صلاحية.'));return;} v36ClientModal(); };
  window.v35EditClientAccount=function(id){ if(!A()){alert(T('You do not have permission.','ليست لديك صلاحية.'));return;} v36ClientModal((state.clientAccounts||[]).find(x=>x.id===id)); };

  window.v35ShowClientPortal=function(id){

      const meta=[`<div><span>${T('Project Code','رمز المشروع')}</span><b>${S(p.code||'')}</b></div>`,`<div><span>${T('Status','الحالة')}</span><b>${S((typeof D==='function'?D(p.status||p.phase):(p.status||p.phase||'')))}</b></div>`];

    }).join('')||`<div class="card"><p class="muted">${T('No projects are assigned to this client account.','لا توجد مشاريع مربوطة بهذا الحساب.')}</p></div>`;

  const oldPrintClient=window.v35PrintClientProject;
  window.v35PrintClientProject=function(pid){
    const cName=(document.querySelector('#clientScreen .page-head h1')?.textContent||'').split('—').pop()?.trim();

  };

  // Add a custom-access summary/control card without changing the base settings design.
  function v36AddRuntimeTools(){

        v.insertAdjacentHTML('beforeend',card(T('Custom Access Control','التحكم بالصلاحيات المخصصة'),`<div class="notice">${T('Roles provide defaults. Custom Access overrides the role for a specific employee, user, or client.','الأدوار تعطي صلاحيات افتراضية. الصلاحيات المخصصة تتقدم على الدور لموظف أو مستخدم أو زبون محدد.')}</div><h3>${T('Employees / Users','الموظفون / المستخدمون')}</h3><div class="table-wrap"><table><thead><tr><th>${T('Name','الاسم')}</th><th>${T('Email','البريد')}</th><th>${T('Role','الدور')}</th><th></th></tr></thead><tbody>${users||emptyRow(4)}</tbody></table></div><h3>${T('Clients','الزبائن')}</h3><div class="table-wrap"><table><thead><tr><th>${T('Client','الزبون')}</th><th>${T('Username','اسم المستخدم')}</th><th>${T('Enabled Access','الصلاحيات المفعلة')}</th><th></th></tr></thead><tbody>${clients||emptyRow(4)}</tbody></table></div>`));
      }
    }
    if(activeSection==='projects'){
      const v=E('view'); if(v && !E('v36-exec-lang-note')){
        v.insertAdjacentHTML('afterbegin',`<div id="v36-exec-lang-note" class="notice">${T('Execution project pages can follow the selected system language, or a project-specific Arabic/English interface language.','صفحات المشاريع التنفيذية يمكن أن تتبع لغة النظام أو لغة عربية/إنجليزية محددة لكل مشروع.')}</div>`);
      }
    }
  }

  // Add project interface language field to the Project editor schema where possible.
  try{
    if(window.SCHEMA && SCHEMA.projects && !SCHEMA.projects.some(f=>f.k==='executionLanguage')){
      SCHEMA.projects.push({k:'executionLanguage',label:T('Execution Interface Language','لغة واجهة التنفيذ'),type:'select',options:['system','Arabic','English']});
    }
  }catch(e){}

  const oldV32Exec = typeof v32Exec==='function'?v32Exec:null;
  if(oldV32Exec){
    v32Exec=function(p){ if(p?.executionLanguage==='Arabic')return true; if(p?.executionLanguage==='English')return false; return oldV32Exec(p); };

  try{Object.assign(DV||{}, {'Execution Interface Language':'لغة واجهة التنفيذ','Custom Access':'صلاحيات مخصصة','Custom Client Access':'صلاحيات الزبون المخصصة','Enabled Access':'الصلاحيات المفعلة'});}catch(e){}

  // First public render on boot should also use simple mode.

<script>
/* ============================================================

   - clean Arabic/English execution project interface

   - currency selection before print/report export

   ============================================================ */
(function(){
  const V37_VERSION='3.7';
  const $id=(id)=>document.getElementById(id);
  const esc37=(v)=>String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
  const L37=(en,ar)=>{try{return (state?.settings?.language==='ar')?ar:en}catch(e){return en}};
  const n37=(v)=>{const x=Number(String(v??0).replace(/,/g,''));return isFinite(x)?x:0};
  const r37=(v)=>Math.round(n37(v)*100)/100;
  const today37=()=>{try{return today()}catch(e){return new Date().toISOString().slice(0,10)}};
  function addAudit37(msg){try{if(typeof log==='function')log(msg,'v3.7','system','')}catch(e){} }

  function normalizeV37(){
    if(!window.state) return;
    state.settings=state.settings||{};
    state.settings.appSchemaVersion=V37_VERSION;
    if(state.settings.consultancyRate==null || Number(state.settings.consultancyRate)===0.08) state.settings.consultancyRate=0;
    (state.projects||[]).forEach(p=>{
      if(p.consultancyRate==null || p.consultancyRate==='' || Number(p.consultancyRate)===0.08 && !p.consultancyRateConfirmed) p.consultancyRate = n37(p.consultancyRateConfirmed? p.consultancyRate : 0);
      if(!p.executionLanguage) p.executionLanguage='system';
    });
    (state.funding||[]).forEach(f=>{
      const p=(typeof project==='function')?project(f.projectId):null;
      const rt=n37(f.consultancyRate!=null?f.consultancyRate:(p?p.consultancyRate:0));
      f.consultancyRate=rt;
      f.consultancyFee=f.waived?0:Math.round(n37(f.amount)*rt);
      f.netConstruction=n37(f.amount)-n37(f.consultancyFee);
    });
    try{if(typeof save==='function')save()}catch(e){}
  }

  // No assumed 8% fee: override labels and funding math.
  try{
    if(window.I18N){
      I18N.f_fee=['Consultancy / Service Fee','أتعاب الاستشارة / الخدمة'];
      I18N.f_rule=['No consultancy fee is assumed automatically. Set the fee percentage inside the project when required.','لا يتم افتراض أي نسبة استشارة تلقائياً. حدد النسبة داخل المشروع عند الحاجة.'];
      I18N.f_waive=['No fee for this funding entry','بدون أتعاب لهذا التمويل'];
      I18N.x_Notifications=['Notifications','الإشعارات'];
      I18N.nav_notifications=['Notifications','الإشعارات'];
    }
  }catch(e){}

  const oldDerive37=(typeof deriveRecord==='function')?deriveRecord:null;
  window.deriveRecord=function(coll,r){
    if(coll==='funding'){
      const p=(typeof project==='function')?project(r.projectId):null;
      r.type=r.type||'Construction Funding';
      r.consultancyRate=n37(r.consultancyRate!=null?r.consultancyRate:(p?p.consultancyRate:0));
      r.consultancyFee=r.waived?0:Math.round(n37(r.amount)*r.consultancyRate);
      r.netConstruction=n37(r.amount)-n37(r.consultancyFee);
      r.status=r.status||'Received';
      return;
    }
    if(oldDerive37) return oldDerive37(coll,r);
  };
  window.edFundPreview=function(){
    const pid=$id('ed_projectId')?.value, p=(typeof project==='function')?project(pid):null, amt=n37($id('ed_amount')?.value), waive=$id('ed_waived')?.checked;
    const rate=n37(p?p.consultancyRate:0), fee=waive?0:Math.round(amt*rate), cur=$id('ed_currency')?.value||p?.currency||'IQD';

  };

  // Translation cleanup: x_ keys must translate, especially Notifications.
  const oldNavLabel37=(typeof v32NavLabel==='function')?v32NavLabel:null;
  window.v32NavLabel=function(id,key){
    if(id==='notifications') return L37('Notifications','الإشعارات');
    if(key==='x_Notifications') return L37('Notifications','الإشعارات');
    if(oldNavLabel37) return oldNavLabel37(id,key);
    return key&&key.startsWith('x_')?key.slice(2):(typeof t==='function'?t(key):key);
  };

  // Public landing: no Open App, no public projects, no image/video/gallery.
  window.v35ShowPublic=function(){
    try{if(!state&&typeof load==='function')load();}catch(e){}
    let scr=$id('publicScreen');
    if(!scr){scr=document.createElement('div');scr.id='publicScreen';scr.className='public-screen';document.body.prepend(scr)}
    const logo=(typeof LOGO!=='undefined'&&LOGO)?`<img src="${LOGO}" alt="Larsa">`:'';
    scr.innerHTML=`<div class="pub-hero v36-public"><div class="pub-nav"><div class="pub-brand">${logo}<span>LARSA ENGINEERING</span></div><div class="pub-actions"><button class="btn ghost" onclick="v35ClientLoginModal()">${L37('Client Login','دخول الزبون')}</button><button class="btn ghost" onclick="v35ShowLogin()">${L37('Staff Login','دخول الموظفين')}</button><button class="btn" onclick="v35InstallApp()">${L37('Install App','تنصيب التطبيق')}</button></div></div><div class="pub-title"><h1>Larsa Engineering</h1><p>${L37('Engineering accounting, project control, payroll, client statements, and management system.','نظام لارسا للحسابات، إدارة المشاريع، الرواتب، كشوف الزبائن، والمتابعة الإدارية.')}</p></div></div><div class="pub-footer">Larsa Engineering</div>`;
    ['app','loginScreen','clientScreen'].forEach(id=>{const x=$id(id);if(x)x.style.display='none'});

  };

  // Hide/remove public-contact settings card if it exists.
  function cleanupContactUI37(){
    try{
      document.querySelectorAll('.card').forEach(c=>{
        const h=(c.textContent||'');

  // Project language: system/English/Arabic. Do not force Arabic just because the project is Iraqi construction.
  function projectArabic37(p){
    if(p&&p.executionLanguage==='Arabic') return true;
    if(p&&p.executionLanguage==='English') return false;
    return !!(state&&state.settings&&state.settings.language==='ar');
  }
  window.v32PText=function(en,ar,p){return projectArabic37(p)?ar:en};
  function ptx(en,ar,p){return projectArabic37(p)?ar:en}
  function pm37(usdValue,p){const cur=p?.currency||'USD';return cur==='IQD'?fmt((typeof toIQD==='function'?toIQD(usdValue,'USD'):usdValue), 'IQD'):fmt(usdValue,'USD')}
  function table37(list,cols){
    return `<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th class="${c.r?'right':''}">${esc37(c.label)}</th>`).join('')}<th></th></tr></thead><tbody>${list.length?list.map(r=>`<tr>${cols.map(c=>`<td class="${c.r?'right':''}">${typeof c.get==='function'?c.get(r):(r[c.get]??'')}</td>`).join('')}${(typeof rowActions==='function')?rowActions(colls37[r.__coll]||r.__coll||'',r.id,r):'<td></td>'}</tr>`).join(''):(typeof emptyRow==='function'?emptyRow(cols.length+1):'')}</tbody></table></div>`;
  }
  const colls37={funding:'funding',expenses:'expenses',materials:'materials',projectLabor:'projectLabor',payroll:'payroll',revenue:'revenue',documents:'documents'};
  function mark37(coll,arr){return (arr||[]).map(x=>Object.assign({__coll:coll},x))}
  window.xRenderProject=function(){

    const addLang=`<select class="head-sel" onchange="v37SetProjectLang('${p.id}',this.value)"><option value="system" ${(!p.executionLanguage||p.executionLanguage==='system')?'selected':''}>${L37('System Language','لغة النظام')}</option><option value="English" ${p.executionLanguage==='English'?'selected':''}>English</option><option value="Arabic" ${p.executionLanguage==='Arabic'?'selected':''}>العربية</option></select>`;
    let b='';
    if(xTab==='summary'){
      b=`${z.balance<0?`<div class="warn">${ptx('Warning: client construction balance is negative and must be reviewed by accounting.','تحذير: رصيد أموال تنفيذ الزبون سالب ويجب مراجعته من المحاسب.',p)}</div>`:''}<div class="kpi-row">${kpi(ptx('Contract Value','قيمة العقد',p),fmt(p.contractValue,p.currency),'','')}${kpi(ptx('Funding Received','التمويل المستلم',p),pm37(z.gross,p),'','')}${kpi(ptx('Larsa Fee / Consultancy','أتعاب لارسا / الاستشارة',p),pm37(z.fee,p),'','good')}${kpi(ptx('Net Construction Funds','صافي أموال التنفيذ',p),pm37(z.netFunding,p),'','')}${kpi(ptx('Actual Project Cost','تكلفة المشروع الفعلية',p),pm37(z.total,p),'','bad')}${kpi(ptx('Client Balance','رصيد الزبون',p),pm37(z.balance,p),'',z.balance>=0?'good':'bad')}</div><div class="grid-2">${card(ptx('Project Result','نتيجة المشروع',p),`<div class="subtle-grid"><div><span>${ptx('Larsa Revenue From Project','إيراد لارسا من المشروع',p)}</span><b class="pos">${pm37(z.revenue+z.fee,p)}</b></div><div><span>${ptx('Direct Operating / Payroll','تشغيل ورواتب مباشرة',p)}</span><b class="neg">${pm37(z.direct,p)}</b></div><div><span>${ptx('Net Project Result','صافي نتيجة المشروع',p)}</span><b>${pm37(z.result,p)}</b></div><div><span>${ptx('Materials Paid','المواد المدفوعة',p)}</span><b>${pm37(z.mat,p)}</b></div><div><span>${ptx('Labor Paid','العمالة المدفوعة',p)}</span><b>${pm37(z.lab,p)}</b></div><div><span>${ptx('Pending Commitments','التزامات بانتظار المراجعة',p)}</span><b>${pm37(z.pending,p)}</b></div></div>`)}${card(ptx('Important Dates & Responsibility','التواريخ والمسؤوليات المهمة',p),`<div class="subtle-grid"><div><span>${ptx('Start','البدء',p)}</span><b>${p.startDate||'—'}</b></div><div><span>${ptx('Due','الاستحقاق',p)}</span><b>${p.dueDate||'—'}</b></div><div><span>${ptx('Close','الإغلاق',p)}</span><b>${p.closeDate||'—'}</b></div><div><span>${ptx('Responsible Engineer','المهندس المسؤول',p)}</span><b>${esc37(p.responsibleEngineer||'—')}</b></div><div><span>${ptx('Project Manager','مدير المشروع',p)}</span><b>${esc37(p.projectManager||'—')}</b></div><div><span>${ptx('Open Review Items','ملاحظات مراجعة مفتوحة',p)}</span><b>${z.flags.length}</b></div></div>`)}</div>${card(ptx('Notes','الملاحظات',p),`<p>${esc37(p.notes||'—')}</p><p class="muted small">${esc37(p.internalNotes||'')}</p>`)}`;
    } else if(xTab==='funding'){
      b=card(ptx('Funding','التمويل',p),`${can('create','funding')?`<button class="btn sm" onclick="xAdd('funding','${p.id}')">+ ${ptx('Add Funding','إضافة تمويل',p)}</button>`:''}${table37(mark37('funding',z.funding),[{label:ptx('Date','التاريخ',p),get:r=>r.date},{label:ptx('Payer','الدافع',p),get:r=>esc37(r.payerName||'—')},{label:ptx('Gross Amount','إجمالي المبلغ',p),r:1,get:r=>fmt(r.amount,r.currency)},{label:ptx('Larsa Fee','أتعاب لارسا',p),r:1,get:r=>fmt(r.consultancyFee,r.currency)},{label:ptx('Net Construction','صافي التنفيذ',p),r:1,get:r=>fmt(r.netConstruction,r.currency)},{label:ptx('Status','الحالة',p),get:r=>`<span class="pill">${esc37(dv(r.status))}</span>`}])}`);

    'Section':'القسم','Code':'الرمز','Unit':'الوحدة','Qty':'الكمية','Variance':'الفرق','Severity':'الأهمية','Module':'الوحدة','Assigned':'مُسند','Projects':'المشاريع','Project':'المشروع','Workforce':'كادر العمل','Labor':'العمالة','Expenses':'المصاريف','Expense':'مصروف','Client':'الزبون','Paid':'مدفوع','International':'دولي','Critical':'حرجة','High':'عالية','Medium':'متوسطة','Low':'منخفضة','Rebar':'حديد تسليح','Concrete':'خرسانة','Excavation':'حفريات','Steel':'حديد','Region':'المنطقة','Phase':'المرحلة','Contract':'العقد','Net':'الصافي','Deductions':'الاستقطاعات','Period':'الفترة','Person':'الشخص','Base':'الأساس','Due':'الاستحقاق','Paid Records':'قيود مدفوعة'
  };
  const AR_EN=Object.fromEntries(Object.entries(EN_AR).map(([k,v])=>[v,k]));
  function translateText38(s){
    if(!s||!String(s).trim())return s;
    let out=String(s);
    const map=ar38()?EN_AR:AR_EN;
    Object.keys(map).sort((a,b)=>b.length-a.length).forEach(k=>{
      const v=map[k];
      out=out.split(k).join(v);
    });
    return out;
  }
  window.v38TranslateVisibleDom=function(root){
    root=root||document.getElementById('app')||document.body;
    try{
      setDirection38();
      const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(node){
        const p=node.parentElement;
        if(!p||['SCRIPT','STYLE','TEXTAREA','INPUT','OPTION'].includes(p.tagName)) return NodeFilter.FILTER_REJECT;
        if(!node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }});
      const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(n=>{const v=translateText38(n.nodeValue); if(v!==n.nodeValue)n.nodeValue=v;});
      document.querySelectorAll('input[placeholder],textarea[placeholder],button[title],select[title]').forEach(el=>{
        ['placeholder','title'].forEach(a=>{if(el.getAttribute(a))el.setAttribute(a,translateText38(el.getAttribute(a)))})
      });
    }catch(e){}
  };

  const oldRender38=window.render;
  window.render=function(){
    const out=oldRender38?oldRender38():undefined;
    setTimeout(()=>{try{v38TranslateVisibleDom();}catch(e){}},0);
    return out;
  };
  const oldSetLang38=window.setLang;
  window.setLang=function(l){
    if(!state&&typeof load==='function')load();
    state.settings=state.settings||{};
    state.settings.language=(l==='ar')?'ar':'en';
    try{save()}catch(e){}
    setDirection38();
    try{initLoginScreen()}catch(e){}
    try{applyTheme()}catch(e){}
    try{render()}catch(e){}
  };
  document.addEventListener('DOMContentLoaded',()=>setTimeout(()=>{try{setDirection38();v38TranslateVisibleDom();}catch(e){}},100));
  try{if(state){state.settings.appSchemaVersion=V38;save();}}catch(e){}
})();
</script>

<script>

  function can311(action,coll){try{return typeof can39==='function'?can39(action,mod311(coll)):(typeof can==='function'?can(action,mod311(coll)):true)}catch(e){return true}}

  window.v36SaveClientAccount=async function(id){

    if(!c){c={id:typeof ID==="function"?ID("cli"):uid("cli")};arr.unshift(c)}
    c.clientName=document.getElementById("ca_name").value.trim();c.username=document.getElementById("ca_user").value.trim();c.active=document.getElementById("ca_active").value==="yes";
    const pw=document.getElementById("ca_pass").value;if(pw)await upgradeCredential(c,pw);else if(!c.passHash){alert(isAR()?"أدخل كلمة مرور للزبون.":"Enter a client password.");return}
    c.projectIds=[...document.querySelectorAll("#ca_projects input:checked")].map(x=>x.value);
    c.permissions={};document.querySelectorAll('#ca_permissions input[id^="cap_"]').forEach(el=>c.permissions[el.id.slice(4)]=!!el.checked);
    try{log("Updated client custom access",c.username||c.clientName,"clientAccounts",c.id)}catch(e){}
    save();closeEditor();render();
  };
  window.v35SaveClientAccount=window.v36SaveClientAccount;
  window.v34ChangeUserPassword=async function(id){
    if(typeof can==="function"&&!can("manageUsers","settings")){alert(isAR()?"ليست لديك صلاحية.":"You do not have permission.");return}
    const u=state.users.find(x=>x.id===id);if(!u)return;
    const pw=prompt((isAR()?"كلمة المرور الجديدة لـ ":"New password for ")+(u.name||u.email),"");if(!pw)return;
    await upgradeCredential(u,pw);log("Password changed",u.email,"users",id);save();alert(isAR()?"تم تحديث كلمة المرور.":"Password updated.");render();
  };
  try{if(typeof SCHEMA!=="undefined"&&SCHEMA.users)SCHEMA.users=SCHEMA.users.filter(f=>f.k!=="pass"&&f.k!=="password")}catch(e){}
  function safeStateCopy(){
    const clone=JSON.parse(JSON.stringify(state));
    const clean=x=>{if(!x||typeof x!=="object")return;delete x.pass;delete x.password;delete x.passHash;delete x.passSalt;delete x.passIterations;delete x.supabaseUrl;delete x.supabaseAnonKey;delete x.supabaseServiceKey;Object.values(x).forEach(v=>{if(Array.isArray(v))v.forEach(clean);else clean(v)})};
    clean(clone);return clone;
  }
  const priorPush=window.v35PushStateToSupabase;
  if(typeof priorPush==="function")window.v35PushStateToSupabase=async function(){
    const original=state;state=safeStateCopy();
    try{return await priorPush()}finally{state=original}
  };
  window.exportBackup=function(){
    const data=JSON.stringify({backupAppName:"Larsa Engineering Web/Mobile App",appSchemaVersion:"3.12-fixed",backupCreatedAt:new Date().toISOString(),data:safeStateCopy()},null,2);
    downloadText("larsa_backup_"+today()+".json",data,"application/json");
  };
})();
</script>

<script>
/* ============================================================
   Larsa unified Excel export  (v3.13)
   - One styled .xlsx generator for ALL export buttons
   - Bold/filled header row, frozen header, auto-filter, column widths,
     money number formats, section + total styling
   - Detailed workbook: P&L summary, every ledger, and a full
     dedicated sheet for every project (construction projects included)
   - Bilingual sheet titles/headers; original currency + USD columns
   ============================================================ */
(function(){
  "use strict";
  const AR = ()=>{ try{ return typeof isAR==="function" ? isAR() : (state&&state.settings&&state.settings.language==="ar"); }catch(e){ return false; } };
  const TX = (en,ar)=> AR() ? (ar||en) : en;
  const r2 = v => { const n=Number(v); return isFinite(n)? Math.round(n*100)/100 : 0; };
  const enc = new TextEncoder();
  const dateStr = ()=>{ try{ return today(); }catch(e){ return new Date().toISOString().slice(0,10); } };
  const pName = id => { try{ return (project(id)&&project(id).name)||""; }catch(e){ return ""; } };
  const toUSD = (v,cur,fx)=>{ try{ return r2(usd(v,cur,fx)); }catch(e){ return r2(v); } };
  const dvx = v => { try{ return typeof dv==="function" ? dv(v) : (v==null?"":String(v)); }catch(e){ return v==null?"":String(v); } };

  /* ---- style registry (xf index per style key) ---- */
  const STYLE = { def:0, h:1, title:2, money:3, int:4, tot:5, totlbl:6, sec:7, muted:8, numgen:9 };
  const STYLES_XML =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<numFmts count="2"><numFmt numFmtId="164" formatCode="#,##0.00"/><numFmt numFmtId="165" formatCode="#,##0"/></numFmts>'+
    '<fonts count="5">'+
      '<font><sz val="11"/><name val="Calibri"/></font>'+
      '<font><b/><color rgb="FFFFFFFF"/><sz val="11"/><name val="Calibri"/></font>'+
      '<font><b/><sz val="14"/><name val="Calibri"/></font>'+
      '<font><i/><color rgb="FF8A8A92"/><sz val="10"/><name val="Calibri"/></font>'+
      '<font><b/><sz val="11"/><name val="Calibri"/></font>'+
    '</fonts>'+
    '<fills count="4">'+
      '<fill><patternFill patternType="none"/></fill>'+
      '<fill><patternFill patternType="gray125"/></fill>'+
      '<fill><patternFill patternType="solid"><fgColor rgb="FF0A0A0D"/><bgColor indexed="64"/></patternFill></fill>'+
      '<fill><patternFill patternType="solid"><fgColor rgb="FFEDEDED"/><bgColor indexed="64"/></patternFill></fill>'+
    '</fills>'+
    '<borders count="3">'+
      '<border><left/><right/><top/><bottom/><diagonal/></border>'+
      '<border><left/><right/><top style="thin"><color rgb="FF000000"/></top><bottom/><diagonal/></border>'+
      '<border><left style="thin"><color rgb="FF555555"/></left><right style="thin"><color rgb="FF555555"/></right><top style="thin"><color rgb="FF555555"/></top><bottom style="thin"><color rgb="FF555555"/></bottom><diagonal/></border>'+
    '</borders>'+
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
    '<cellXfs count="10">'+
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'+                                                                 /*0 def*/
      '<xf numFmtId="0" fontId="1" fillId="2" borderId="2" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>'+ /*1 header*/
      '<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/>'+                                                    /*2 title*/
      '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyAlignment="1"><alignment horizontal="right"/></xf>'+ /*3 money*/
      '<xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyAlignment="1"><alignment horizontal="right"/></xf>'+ /*4 int*/
      '<xf numFmtId="164" fontId="4" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="right"/></xf>'+ /*5 tot*/
      '<xf numFmtId="0" fontId="4" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1"/>'+                                     /*6 totlbl*/
      '<xf numFmtId="0" fontId="4" fillId="3" borderId="0" xfId="0" applyFont="1" applyFill="1"/>'+                                       /*7 section*/
      '<xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1"/>'+                                                    /*8 muted*/
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment horizontal="right"/></xf>'+            /*9 numgen*/
    '</cellXfs>'+
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'+
    '</styleSheet>';

  /* ---- xml + zip helpers ---- */
  function xmlEsc(v){ return String(v==null?"":v).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[m])); }
  function colName(n){ let s=""; n=n+1; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }
  function safeSheetName(n,i){ return (String(n==null?("Sheet "+i):n).replace(/[\\\/?*\[\]:]/g," ").replace(/[\x00-\x1F]/g," ").trim().slice(0,31) || ("Sheet "+i)); }

  const crcTable = (()=>{ let c,t=[]; for(let n=0;n<256;n++){ c=n; for(let k=0;k<8;k++) c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1); t[n]=c>>>0; } return t; })();
  function crc32(bytes){ let c=0xffffffff; for(let i=0;i<bytes.length;i++) c=crcTable[(c^bytes[i])&255]^(c>>>8); return (c^0xffffffff)>>>0; }
  const u16=n=>[n&255,(n>>>8)&255], u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
  function zip(files){
    const chunks=[], central=[]; let offset=0;
    files.forEach(f=>{
      const name=enc.encode(f.name), data=(typeof f.data==="string")?enc.encode(f.data):f.data, crc=crc32(data), flag=0x0800;
      const lh=[...u32(0x04034b50),...u16(20),...u16(flag),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)];
      chunks.push(new Uint8Array(lh), name, data);
      central.push({name,crc,size:data.length,offset,flag}); offset+=lh.length+name.length+data.length;
    });
    const cstart=offset;
    central.forEach(f=>{ const ch=[...u32(0x02014b50),...u16(20),...u16(20),...u16(f.flag),...u16(0),...u16(0),...u16(0),...u32(f.crc),...u32(f.size),...u32(f.size),...u16(f.name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(f.offset)]; chunks.push(new Uint8Array(ch), f.name); offset+=ch.length+f.name.length; });
    chunks.push(new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(central.length),...u16(central.length),...u32(offset-cstart),...u32(cstart),...u16(0)]));
    return new Blob(chunks,{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  }

  /* ---- normalize a sheet to {name,title,headerIdx,rows[][cellObj|primitive]} ---- */
  function norm(sheet,i){
    if(Array.isArray(sheet)){
      const name=sheet[0], rows=(sheet[1]||[]);
      return { name, title:null, headerIdx:0, rows: rows.map((r,ri)=> (r||[]).map(c=> ri===0 ? {v:c,s:"h"} : c)) };
    }
    return { name:sheet.name, title:sheet.title||null, headerIdx:(sheet.headerIdx==null?0:sheet.headerIdx), rows:sheet.rows||[], plain:!!sheet.plain };
  }
  function cellInfo(cell){
    if(cell&&typeof cell==="object"&&"v" in cell){ const num=typeof cell.v==="number"&&isFinite(cell.v); return {v:cell.v, sid:(STYLE[cell.s]!=null?STYLE[cell.s]:0), num}; }
    const num=typeof cell==="number"&&isFinite(cell);
    return {v:cell, sid:(num?STYLE.money:STYLE.def), num};
  }

  function sheetXml(sh){
    const rows=sh.rows||[];
    const ncol=rows.reduce((m,r)=>Math.max(m,(r||[]).length),1);
    // widths
    const w=new Array(ncol).fill(10);
    rows.forEach(r=>(r||[]).forEach((c,ci)=>{ const info=cellInfo(c); const len=String(info.num? (Math.round(info.v).toString()) : (info.v==null?"":info.v)).length; if(len+2>w[ci]) w[ci]=Math.min(60,len+2); }));
    let colsXml='<cols>'+w.map((ww,ci)=>`<col min="${ci+1}" max="${ci+1}" width="${ww}" customWidth="1"/>`).join("")+'</cols>';
    // header row number (1-based) in the final sheet (title pushes everything down by 1)
    const titleOffset = sh.title?1:0;
    const headerRowNum = titleOffset + sh.headerIdx + 1;
    let bodyRows="";
    let outIdx=0;
    if(sh.title){
      outIdx++;
      bodyRows+=`<row r="${outIdx}"><c r="A${outIdx}" s="${STYLE.title}" t="inlineStr"><is><t>${xmlEsc(sh.title)}</t></is></c></row>`;
    }
    rows.forEach(r=>{
      outIdx++;
      const cells=(r||[]).map((c,ci)=>{
        const info=cellInfo(c); const ref=colName(ci)+outIdx;
        if(info.num) return `<c r="${ref}" s="${info.sid}"><v>${info.v}</v></c>`;
        const s = info.sid;
        return `<c r="${ref}" s="${s}" t="inlineStr"><is><t>${xmlEsc(info.v)}</t></is></c>`;
      }).join("");
      bodyRows+=`<row r="${outIdx}">${cells}</row>`;
    });
    const lastCol=colName(ncol-1);
    const totalRows=outIdx;
    const freeze = sh.plain
      ? `<sheetViews><sheetView workbookViewId="0"/></sheetViews>`
      : `<sheetViews><sheetView workbookViewId="0"><pane ySplit="${headerRowNum}" topLeftCell="A${headerRowNum+1}" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A${headerRowNum+1}" sqref="A${headerRowNum+1}"/></sheetView></sheetViews>`;
    const filter = sh.plain ? "" : `<autoFilter ref="A${headerRowNum}:${lastCol}${headerRowNum}"/>`;
    const merge = sh.title ? `<mergeCells count="1"><mergeCell ref="A1:${lastCol}1"/></mergeCells>` : "";
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
      `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">`+
      `<dimension ref="A1:${lastCol}${Math.max(1,totalRows)}"/>`+
      freeze+
      `<sheetFormatPr defaultRowHeight="15"/>`+
      colsXml+
      `<sheetData>${bodyRows}</sheetData>`+
      filter+
      merge+
      `</worksheet>`;
  }

  function buildXlsx(sheets, filename){
    try{
      sheets=(sheets||[]).map((s,i)=>norm(s,i+1)).filter(s=>s&&Array.isArray(s.rows));
      if(!sheets.length) sheets=[norm(["Sheet1",[["Empty"]]],1)];
      const used={};
      sheets.forEach((s,i)=>{ let nm=safeSheetName(s.name,i+1), base=nm, k=1; while(used[nm]) nm=(base.slice(0,27)+" "+(++k)).slice(0,31); used[nm]=1; s.name=nm; });
      const now=new Date().toISOString();
      const files=[
        {name:"[Content_Types].xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/><Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`},
        {name:"_rels/.rels",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/></Relationships>`},
        {name:"docProps/core.xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:creator>Larsa Engineering</dc:creator><cp:lastModifiedBy>Larsa Engineering</cp:lastModifiedBy><dcterms:created xsi:type="dcterms:W3CDTF">${now}</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">${now}</dcterms:modified></cp:coreProperties>`},
        {name:"docProps/app.xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"><Application>Larsa Engineering</Application></Properties>`},
        {name:"xl/styles.xml",data:STYLES_XML},
        {name:"xl/workbook.xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><workbookPr/><sheets>${sheets.map((s,i)=>`<sheet name="${xmlEsc(s.name)}" sheetId="${i+1}" r:id="rId${i+2}"/>`).join("")}</sheets><calcPr calcId="0"/></workbook>`},
        {name:"xl/_rels/workbook.xml.rels",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>${sheets.map((_,i)=>`<Relationship Id="rId${i+2}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}</Relationships>`}
      ];
      sheets.forEach((s,i)=>files.push({name:`xl/worksheets/sheet${i+1}.xml`,data:sheetXml(s)}));
      const blob=zip(files);
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
      a.download=(filename||`Larsa_Workbook_${dateStr()}.xlsx`).replace(/\.xls$/i,".xlsx");
      document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);
      return true;
    }catch(e){
      console.error("Excel export failed",e);
      try{ alert(TX("Excel export failed. Please try again or use the JSON backup.","فشل تصدير Excel. حاول مرة أخرى أو استخدم نسخة JSON الاحتياطية.")); }catch(_){}
      return false;
    }
  }

  /* ---- cell helpers for the detailed builder ---- */
  const H=v=>({v,s:"h"});
  const SEC=v=>({v,s:"sec"});
  const TOT=v=>({v:r2(v),s:"tot"});
  const TOTL=v=>({v,s:"totlbl"});
  const INT=v=>({v:Number(v)||0,s:"int"});
  const M=v=>({v:r2(v),s:"money"});

  function ledger(coll, cols){
    const arr=(state[coll]||[]);
    return arr.map(r=>cols.map(c=>{ const val=typeof c.get==="function"?c.get(r):(r[c.get]); return c.money?M(val): (c.int?INT(val): (val==null?"":val)); }));
  }

  /* ---- detailed workbook ---- */
  function workbook(){
    const sheets=[];
    let z={}; try{ z=totals()||{}; }catch(e){ z={}; }
    const gen = `${TX("Generated","تاريخ الإنشاء")}: ${new Date().toLocaleString(AR()?"ar":"en")}`;

    /* 1) P&L summary */
    const margin = z.realRevenue>0 ? (z.net/z.realRevenue*100) : 0;
    sheets.push({ name:TX("Summary","الملخص"), title:`Larsa Engineering — ${TX("Profit & Loss Summary","ملخص الأرباح والخسائر")}  (${gen})`, headerIdx:0, rows:[
      [H(TX("Metric","البند")), H("USD")],
      [TX("Engineering Revenue","الإيراد الهندسي"), M(z.rev)],
      [TX("Consultancy Fees","أتعاب الاستشارة"), M(z.fees)],
      [TOTL(TX("Real Revenue","الإيراد الحقيقي")), TOT(z.realRevenue)],
      [TX("Operating Costs","مصاريف التشغيل"), M(z.opEx)],
      [TX("Payroll Company Cost","تكلفة الرواتب على الشركة"), M(z.payroll)],
      [TX("Sales Commissions","عمولات المبيعات"), M(z.commissions)],
      [TOTL(TX("Company Net","صافي الشركة")), TOT(z.net)],
      [TX("Net Margin %","نسبة هامش الربح"), {v:r2(margin),s:"money"}],
      [SEC(TX("Construction Trust (client funds)","أمانة التنفيذ (أموال الزبون)")), SEC("")],
      [TX("Gross Client Funding","إجمالي تمويل الزبائن"), M(z.fundingGross)],
      [TX("Net Construction Funds","صافي أموال التنفيذ"), M(z.netConstruction)],
      [TX("Construction Spend","الإنفاق الإنشائي"), M(z.constructionSpend)],
      [TOTL(TX("Client Funds Held","أموال الزبائن المحتجزة")), TOT(z.fundsHeld)],
    ]});

    /* 2) Projects overview */
    sheets.push({ name:TX("Projects","المشاريع"), rows:[
      [H(TX("Code","الرمز")),H(TX("Project","المشروع")),H(TX("Client","الزبون")),H(TX("Region","المنطقة")),H(TX("Type","النوع")),H(TX("Phase","المرحلة")),H(TX("Status","الحالة")),H(TX("Contract","العقد")),H("Currency"),H(TX("Contract (USD)","العقد بالدولار"))],
      ...(state.projects||[]).map(p=>[p.code||"",p.name||"",p.clientName||p.client||"",dvx(p.region),dvx(p.type),dvx(p.phase),dvx(p.status),M(p.contractValue),p.currency||"",M(toUSD(p.contractValue,p.currency))])
    ]});

    /* 3) Global ledgers (original + USD) */
    sheets.push({ name:TX("Funding","التمويل"), rows:[
      [H(TX("Date","التاريخ")),H(TX("Project","المشروع")),H(TX("Payer","الدافع")),H(TX("Source","المصدر")),H(TX("Gross","الإجمالي")),H("Currency"),H(TX("Fee","الأتعاب")),H(TX("Net Construction","صافي التنفيذ")),H(TX("Reference","المرجع")),H(TX("Status","الحالة")),H(TX("Gross (USD)","الإجمالي بالدولار"))],
      ...(state.funding||[]).map(r=>[r.date||"",pName(r.projectId),r.payerName||"",dvx(r.fundingSource),M(r.amount),r.currency||"",M(r.waived?0:r.consultancyFee),M(r.netConstruction),r.referenceNumber||"",dvx(r.status),M(toUSD(r.amount,r.currency,r.fxRate))])
    ]});

    sheets.push({ name:TX("Revenue","الإيرادات"), rows:[
      [H(TX("Date","التاريخ")),H(TX("Project","المشروع")),H(TX("Stream","المصدر")),H(TX("Description","البيان")),H(TX("Salesman","المندوب")),H(TX("Amount","المبلغ")),H("Currency"),H(TX("Status","الحالة")),H(TX("Amount (USD)","المبلغ بالدولار"))],
      ...(state.revenue||[]).map(r=>[r.date||"",pName(r.projectId),dvx(r.stream),r.description||"",r.salesman||"",M(r.amount),r.currency||"",dvx(r.status),M(toUSD(r.amount,r.currency,r.fxRate))])

    sheets.push({ name:TX("Operating","التشغيل"), rows:[

      (state.funding||[]).filter(r=>r.projectId===p.id).forEach(r=>rows.push([r.date||"",r.payerName||"",M(r.amount),M(r.consultancyFee),M(r.netConstruction),dvx(r.status)]));

      (state.expenses||[]).filter(r=>r.projectId===p.id).forEach(r=>rows.push([r.date||"",dvx(r.category),r.description||"",M(r.amount),dvx(r.status)]));
      rows.push([]);
      // Materials
      rows.push([SEC(TX("Materials","المواد")),SEC(""),SEC(""),SEC(""),SEC(""),SEC("")]);
      rows.push([H(TX("Date","التاريخ")),H(TX("Category","الفئة")),H(TX("Item","المادة")),H(TX("Qty","الكمية")),H(TX("Amount","المبلغ")),H(TX("Status","الحالة"))]);
      (state.materials||[]).filter(r=>r.projectId===p.id).forEach(r=>rows.push([r.date||"",dvx(r.materialCategory),r.itemName||r.description||"",INT(r.quantity),M(r.amount),dvx(r.status)]));

  }

  function exportFull(){ return buildXlsx(workbook(), `Larsa_Workbook_${dateStr()}.xlsx`); }
