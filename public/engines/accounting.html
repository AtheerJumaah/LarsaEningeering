<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Larsa">
<title>Larsa Engineering</title>
<style>
:root{
  --bg:#0a0a0d; --panel:#101015; --panel2:#16161c; --line:#23232c; --line2:#2c2c36;
  --txt:#f2f2f5; --muted:#8a8a94; --muted2:#6a6a74;
  --white:#ffffff; --accent:#ffffff;
  --green:#46d18a; --red:#ff6b6b; --blue:#5b9dff;
  --radius:14px; --radius-sm:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Segoe UI',-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5}
body.rtl{font-family:'Segoe UI',Tahoma,Arial,sans-serif}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
.muted{color:var(--muted)} .small{font-size:12px} .center{text-align:center} .nowrap{white-space:nowrap}
.pos{color:var(--green);font-weight:700} .neg{color:var(--red);font-weight:700} .sal{color:var(--blue);font-weight:700}

/* ---------- LOGIN ---------- */
#loginScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#16161d,#08080b);padding:20px;z-index:50}
.login-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:34px 30px;position:relative}
.login-card::before{content:"";position:absolute;inset-inline-start:0;top:26px;bottom:26px;width:3px;background:var(--white);border-radius:3px}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-inline-start:10px}
.login-logo img{height:46px}
.login-logo .lw{font-weight:900;font-size:22px;letter-spacing:2px}
#loginTitle{font-size:20px;font-weight:800;margin:0}
#loginSub{color:var(--muted);font-size:12.5px;margin:4px 0 22px;padding-inline-start:10px}
.login-card input{width:100%;padding:12px 14px;margin-bottom:12px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;color:var(--txt);font-size:14px}
#loginBtn{width:100%;padding:13px;background:var(--white);color:#000;border:0;border-radius:10px;font-weight:800;font-size:15px;letter-spacing:.3px}
#loginErr{color:var(--red);font-size:12.5px;min-height:18px;margin-top:8px;text-align:center}
.login-demos{margin-top:16px;font-size:11.5px;color:var(--muted2);text-align:center;line-height:1.8}
.login-lang{position:absolute;top:16px;inset-inline-end:16px;display:flex;gap:4px}
.login-lang button,.lang-toggle button{background:transparent;border:1px solid var(--line2);color:var(--muted);padding:4px 10px;border-radius:8px;font-weight:700;font-size:12px}
.login-lang button.active,.lang-toggle button.active{background:var(--white);color:#000;border-color:var(--white)}

/* ---------- APP SHELL ---------- */
#app{display:none;height:100%}
.sidebar{width:248px;flex-shrink:0;background:var(--panel);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;height:100%;overflow-y:auto}
.side-brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.side-brand img{height:49px}
.side-brand .sb-word{font-weight:900;font-size:17px;letter-spacing:1.5px}
.side-brand .sb-sub{font-size:10px;color:var(--muted2);letter-spacing:1px;text-transform:uppercase}
#nav{padding:12px 12px 24px;flex:1}
.nav-group{margin-bottom:16px}
.nav-group-title{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted2);padding:0 10px 7px;font-weight:700}
.nav-item{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:transparent;border:0;color:var(--muted);padding:9px 12px;border-radius:10px;font-size:13.5px;font-weight:600;text-align:start;margin-bottom:2px;position:relative}
.nav-item:hover{background:var(--panel2);color:var(--txt)}
.nav-item.active{background:var(--panel2);color:var(--white)}
.nav-item.active::before{content:"";position:absolute;inset-inline-start:0;top:8px;bottom:8px;width:3px;background:var(--white);border-radius:3px}
.badge{background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:20px;padding:1px 7px}

.main{flex:1;display:flex;flex-direction:column;height:100%;overflow:hidden;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--panel);flex-shrink:0}
.topbar .tb-left{display:flex;align-items:center;gap:12px;min-width:0}
#appTitle{font-size:15px;font-weight:800;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;align-items:center;gap:12px}
.lang-toggle{display:flex;gap:4px}
.user-chip{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.user-chip b{color:var(--txt)}
#signOutBtn{background:transparent;border:1px solid var(--line2);color:var(--muted);padding:6px 12px;border-radius:9px;font-weight:600;font-size:12.5px}
#navToggle{display:none;background:transparent;border:1px solid var(--line2);color:var(--txt);border-radius:9px;padding:6px 10px;font-size:16px}
.view-scroll{flex:1;overflow-y:auto;padding:24px}

/* ---------- COMPONENTS ---------- */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:22px;font-weight:800;margin:0;letter-spacing:.2px}
.head-sel,.filter-bar select,.head-sel{background:var(--panel2);border:1px solid var(--line2);color:var(--txt);padding:8px 12px;border-radius:10px;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px}
.card h2{font-size:14px;font-weight:700;margin:0 0 14px;letter-spacing:.3px}
.card h3{font-size:13px;margin:0 0 10px}
.notice{background:rgba(91,157,255,.08);border:1px solid rgba(91,157,255,.25);color:#bcd6ff;padding:11px 14px;border-radius:10px;font-size:12.5px;margin-bottom:16px}
.hint{font-size:11.5px;color:var(--muted2);margin-top:10px}
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media(max-width:1024px){.grid-2{grid-template-columns:minmax(0,1fr)}}
.grid-3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:18px}
@media(max-width:1280px){.grid-3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media(max-width:760px){.grid-3{grid-template-columns:minmax(0,1fr)}}

/* KPIs */
.kpi-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media(max-width:1200px){.kpi-row{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:620px){.kpi-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:15px 16px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset-inline-start:0;top:12px;bottom:12px;width:3px;background:var(--line2);border-radius:3px}
.kpi.good::before{background:var(--green)} .kpi.bad::before{background:var(--red)} .kpi.sal::before{background:var(--blue)}
.k-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.k-value{font-size:21px;font-weight:800;margin:6px 0 3px}
.k-sub{font-size:11px;color:var(--muted2)}

/* forms */
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.form-grid.tight{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:900px){.form-grid,.form-grid.tight{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.form-grid,.form-grid.tight{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:5px}
.field.wide{grid-column:span 2}
.field label{font-size:11.5px;color:var(--muted);font-weight:600}
.field input,.field select{background:var(--panel2);border:1px solid var(--line2);color:var(--txt);padding:9px 11px;border-radius:9px;font-size:13px;width:100%}
.field input:focus,.field select:focus{outline:none;border-color:#43434f}
.check{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:4px 0 12px;cursor:pointer}
.preview{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;margin-bottom:14px;display:flex;gap:26px;flex-wrap:wrap}
.prev-row{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.prev-row b{font-size:15px}
.btn{background:var(--white);color:#000;border:0;padding:11px 22px;border-radius:10px;font-weight:800;font-size:13.5px;letter-spacing:.2px}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line2)}
.btn.sm{padding:8px 16px;font-size:12.5px;margin-bottom:12px}
.rpt-actions{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}

/* tables */
.table-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line)}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;background:var(--panel2)}
td.right,th.right{text-align:end;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--panel2)}
tr.tot td{font-weight:800;border-top:2px solid var(--line2);background:var(--panel2)}
tr.grp-row td{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted2);font-weight:700;background:transparent;border:0;padding-top:16px}
tr.row-flag{background:rgba(255,107,107,.06)}
.pill{display:inline-block;background:var(--panel2);border:1px solid var(--line2);color:var(--muted);font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px}
.pill.ok{color:var(--green);border-color:rgba(70,209,138,.4)}
.mini{background:var(--panel2);border:1px solid var(--line2);color:var(--muted);font-size:11.5px;padding:4px 9px;border-radius:7px;font-weight:600}
.mini:hover{color:var(--txt)} .mini.flagged{color:var(--red);border-color:var(--red)}

/* charts */
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--muted)}
.legend.col{flex-direction:column;gap:6px}
.leg{display:inline-flex;align-items:center;gap:6px}
.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.hbars{display:flex;flex-direction:column;gap:11px}
.hbar-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;color:var(--muted)}
.hbar-track{height:9px;background:var(--panel2);border-radius:6px;overflow:hidden}
.hbar-fill{height:100%;border-radius:6px}
.insights{margin:0;padding-inline-start:18px;line-height:1.9;font-size:13px;color:var(--muted)}
.insights li{margin-bottom:4px}

/* filter bars / segmented */
.filter-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.filter-bar input[type=date],.filter-bar input[type=month]{background:var(--panel2);border:1px solid var(--line2);color:var(--txt);padding:7px 10px;border-radius:9px;font-size:12.5px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--muted);padding:7px 14px;font-size:12.5px;font-weight:600}
.seg button.on{background:var(--white);color:#000}
.filter-bar select{background:var(--panel2);border:1px solid var(--line2);color:var(--txt);padding:8px 12px;border-radius:9px;font-size:13px}

/* client meta */
.client-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media(max-width:700px){.client-meta{grid-template-columns:repeat(2,minmax(0,1fr))}}
.client-meta>div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.client-meta span{font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:.4px}
.client-meta b{font-size:14px}

/* mobile nav */
@media(max-width:860px){
  .sidebar{position:fixed;inset-inline-start:-260px;top:0;bottom:0;z-index:40;transition:inset-inline-start .25s}
  body.nav-open .sidebar{inset-inline-start:0;box-shadow:0 0 40px rgba(0,0,0,.6)}
  #navToggle{display:block}
}

/* theme button + clickable rows */
.icon-btn{background:transparent;border:1px solid var(--line2);color:var(--txt);border-radius:9px;padding:5px 10px;font-size:15px;line-height:1}
tr.clickable{cursor:pointer}
td.act .mini{margin-inline-start:2px}

/* segmented (big variant for settings) */
.seg.big button{padding:10px 18px;font-size:13.5px}
.page-head .btn{padding:9px 16px;font-size:13px}
.filter-bar.inline{margin:0}

/* Profit & Loss band on dashboard */
.pnl-band{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px}
.pnl-cell{background:var(--panel);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.pnl-cell span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.pnl-cell b{font-size:20px}
.pnl-cell.big{background:var(--panel2)}
.pnl-band.good .pnl-cell.big{box-shadow:inset 3px 0 0 var(--green)}
.pnl-band.bad .pnl-cell.big{box-shadow:inset 3px 0 0 var(--red)}
@media(max-width:760px){.pnl-band{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* receipt field */
.rec-field{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rec-field input[type=file]{font-size:11.5px;color:var(--muted);max-width:100%}
.field .ck{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
textarea{background:var(--panel2);border:1px solid var(--line2);color:var(--txt);border-radius:9px;padding:9px 11px;font-size:13px;font-family:inherit;resize:vertical}

/* MODAL editor */
body.modal-open{overflow:hidden}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;z-index:60;padding:18px}
.modal{width:100%;max-width:680px;max-height:90vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:15px;font-weight:800}
.modal-body{padding:18px 20px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:var(--panel2)}
.inwrap{display:flex;align-items:center;gap:6px}
@media(max-width:560px){.modal{max-height:94vh}.modal .form-grid{grid-template-columns:minmax(0,1fr)}}

/* LIGHT THEME */
body.light{
  --bg:#f4f5f7; --panel:#ffffff; --panel2:#f1f2f5; --line:#e3e5ea; --line2:#d4d7df;
  --txt:#15161a; --muted:#5d616c; --muted2:#878c98; --white:#111317; --accent:#111317;
  --green:#1f9d57; --red:#d8443a; --blue:#2d6fd6;
}
body.light .btn{background:#111317;color:#fff}
body.light .seg button.on{background:#111317;color:#fff}
body.light .login-card input,body.light .field input,body.light .field select,body.light textarea{background:#fbfbfd}
body.light #loginScreen{background:radial-gradient(1200px 600px at 50% -10%,#ffffff,#e9ebf0)}
body.light .nav-item.active,body.light .kpi::before{}
body.light #loginBtn{background:#111317;color:#fff}
body.light .side-brand .sb-word,body.light .login-logo .lw{color:#111317}
body.light .pill.ok{color:var(--green)}

/* enterprise depth additions — intentionally reuse the existing visual language */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:18px}
.tabs .mini{white-space:nowrap;padding:7px 12px}
.tabs .mini.on{background:var(--white);color:#000;border-color:var(--white)}
.detail-hero{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.detail-hero h1{margin:0 0 4px;font-size:22px}.detail-hero .meta{color:var(--muted);font-size:12px}
.detail-actions{display:flex;gap:8px;flex-wrap:wrap}
.warn{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.3);color:#ffaaaa;padding:10px 13px;border-radius:10px;margin-bottom:14px;font-size:12.5px}
.ok-note{background:rgba(70,209,138,.08);border:1px solid rgba(70,209,138,.25);color:#9ce8bf;padding:10px 13px;border-radius:10px;margin-bottom:14px;font-size:12.5px}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted);margin-inline-end:6px}
.status-dot.active{background:var(--green)}.status-dot.critical{background:var(--red)}
.sev-Critical{color:var(--red);border-color:var(--red)}.sev-High{color:#ffad66;border-color:#9c6337}
.sev-Medium{color:#f1d36d;border-color:#7b6d35}.sev-Low{color:var(--blue);border-color:#335c91}
.mini.danger{color:var(--red)}.mini.approve{color:var(--green);border-color:rgba(70,209,138,.45)}
.subtle-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.subtle-grid>div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.subtle-grid span{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
.subtle-grid b{display:block;margin-top:3px;font-size:13px;overflow-wrap:anywhere}
.permission-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.permission-grid label{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
@media(max-width:760px){.subtle-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.permission-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media(max-width:480px){.subtle-grid{grid-template-columns:minmax(0,1fr)}}

/* v3.2 accessibility, bilingual branding, permissions and reports */
.side-brand,.login-logo{direction:ltr!important;flex-direction:row!important;text-align:left!important}
.side-brand>div{direction:ltr!important;text-align:left!important}
.topbar{direction:ltr}.topbar .tb-left{direction:ltr}.topbar .tb-right{direction:ltr}
body.rtl .view-scroll,body.rtl .modal-body{direction:rtl;text-align:right}
body.rtl .table-wrap{direction:rtl}
body.rtl .page-head,body.rtl .detail-hero{direction:rtl}
.execution-ar{direction:rtl;text-align:right}
.execution-ar .kpi,.execution-ar .card,.execution-ar th,.execution-ar td{text-align:right}
.execution-ar td.right,.execution-ar th.right{text-align:left}
.permission-matrix{display:grid;grid-template-columns:minmax(190px,1.3fr) repeat(8,minmax(74px,.7fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:auto}
.permission-matrix>div{background:var(--panel);padding:8px 9px;min-width:74px;font-size:11.5px;display:flex;align-items:center;justify-content:center;gap:5px}
.permission-matrix>div.pm-head{background:var(--panel2);font-weight:800;color:var(--txt)}
.permission-matrix>div.pm-module{justify-content:flex-start;font-weight:700;min-width:190px}
.permission-matrix input{accent-color:var(--green)}
.report-mode{display:flex;gap:7px;flex-wrap:wrap}
.client-view-hero{background:linear-gradient(135deg,var(--panel),var(--panel2));border:1px solid var(--line2);border-radius:var(--radius);padding:22px;margin-bottom:18px}
.client-view-hero h2{font-size:20px;margin:0 0 5px}.client-view-hero p{margin:0;color:var(--muted)}
.report-filter-grid{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:10px}
@media(max-width:1050px){.report-filter-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:620px){.report-filter-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}

/* explicit color pairs prevent black-on-black and pale-on-pale in both languages */
body:not(.light) input,body:not(.light) select,body:not(.light) textarea{background:#17171d!important;color:#f5f5f7!important;border-color:#34343e!important}
body:not(.light) input::placeholder,body:not(.light) textarea::placeholder{color:#92929d!important}
body:not(.light) option{background:#17171d;color:#f5f5f7}
body.light input,body.light select,body.light textarea{background:#fff!important;color:#15161a!important;border-color:#cfd3db!important}
body.light option{background:#fff;color:#15161a}
body.light .mini,body.light .btn.ghost,body.light #signOutBtn,body.light .icon-btn{background:#fff;color:#1a1b20;border-color:#c7cbd3}
body:not(.light) .mini,body:not(.light) .btn.ghost{color:#f2f2f5}
body.light .pill{background:#f4f5f7;color:#34363e;border-color:#cfd3db}

/* Salesmen and their commissions: a repeating pair of rows, because one
   revenue can be split between several people on different rates. */
.sales-wrap{display:block;width:100%}
.sales-team{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.sales-row{display:grid;grid-template-columns:minmax(0,1fr) 96px 18px 34px;gap:8px;align-items:center}
.sales-row select,.sales-row input{width:100%;min-width:0}
.sales-row .sales-rate{text-align:right}
.sales-row .sales-pct{font-size:12px;font-weight:700;color:#7a8190;text-align:center}
.sales-row .mini{width:34px;height:34px;line-height:1;padding:0}
.sales-add{width:auto}
@media(max-width:620px){.sales-row{grid-template-columns:minmax(0,1fr) 76px 16px 32px}}

/* translate a single data value (case-insensitive, compound-aware) */
function dv(v){
  if(!isAR()) return v==null? "" : String(v);
  if(v==null) return "";
  const s=String(v).trim(); if(!s) return "";
  if(DV[s]) return DV[s];
  // case-insensitive
  const hit=Object.keys(DV).find(k=>k.toLowerCase()===s.toLowerCase());
  if(hit) return DV[hit];
  // compound on " / " or "/"
  if(s.includes("/")) return s.split("/").map(p=>dv(p.trim())).join(" / ");
  return s; // fall back to original (keeps numbers, codes, names)
}

function rate(){ return Math.max(1, num(state?.settings?.rate)); }
function usd(v,cur,fx){ return cur==="IQD" ? num(v)/(num(fx)>0?num(fx):rate()) : num(v); }
/* Convert one stored line using the rate captured on it. */
function usdRow(row,field){ if(!row) return 0; return usd(row[field||"amount"],row.currency,row.fxRate); }
function toIQD(v,cur){ return cur==="USD" ? num(v)*rate() : num(v); }
function fmt(v,cur){
  cur=cur||"USD";
  const n=new Intl.NumberFormat("en-US",{maximumFractionDigits:cur==="IQD"?0:2}).format(num(v));
  return isAR() ? (n+" "+(cur==="IQD"?"د.ع":"$")) : (cur==="IQD"? n+" IQD" : "$"+n);
}
function fmtUSD(v){ return fmt(usd(v.amount!=null?v.amount:v, v.currency), "USD"); }
/* Which currency the screen is reading in. Display only: every figure is still
   stored and summed in USD, and each line still converts from its own recorded
   rate. Switching this re-prints, it never rewrites data. */
function dispCur(){ return (state&&state.settings&&state.settings.dispCur==="IQD")?"IQD":"USD"; }
function setDispCur(c){
  if(!state) load();
  state.settings.dispCur = c==="IQD" ? "IQD" : "USD";
  save(); applyCurToggle(); render();
}
function applyCurToggle(){
  const iqd=$("curIqd"), usd_=$("curUsd"); if(!iqd||!usd_) return;
  const on=dispCur()==="IQD";
  iqd.classList.toggle("active", on);
  usd_.classList.toggle("active", !on);
  const t=$("curToggle"); if(t) t.title="1 USD = "+fmt(rate(),"IQD");
}
function money(v){ // v is already a USD number
  return dispCur()==="IQD" ? fmt(num(v)*rate(),"IQD") : fmt(v,"USD");
}
/* colored money: green positive, red negative */
function moneyC(v){
  const cls = v>0?"pos": v<0?"neg":"";
  return `<span class="${cls}">${money(v)}</span>`;
}
function monthKey(d){ return d? String(d).slice(0,7):""; }
function lastMonths(k){ const out=[],now=new Date(); for(let i=k-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1); out.push({key:localDateISO(d).slice(0,7),label:d.toLocaleDateString(isAR()?"ar":"en",{month:"short"})});} return out; }
function periodRange(preset){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth(), d=now.getDate();
  const iso=localDateISO;
  if(preset==="daily") return [today(),today()];
  if(preset==="weekly"){ const s=new Date(now); s.setDate(d-now.getDay()); const e=new Date(s); e.setDate(s.getDate()+6); return [iso(s),iso(e)]; }
  if(preset==="quarter"){ const q=Math.floor(m/3)*3; return [iso(new Date(y,q,1)),iso(new Date(y,q+3,0))]; }
  if(preset==="year") return [iso(new Date(y,0,1)),iso(new Date(y,11,31))];
  return [iso(new Date(y,m,1)),iso(new Date(y,m+1,0))]; // monthly
}
function recDate(r){ return r.date||r.payDate||r.receivedDate||r.created||""; }
function inRange(r,a,b){ const d=recDate(r); return (!a||d>=a)&&(!b||d<=b); }

/* ============================================================
   chart library (inline SVG, no deps)  — black/white/gray + r/g/b accents
   ============================================================ */
const C = { rev:"#5b9dff", exp:"#ff6b6b", profit:"#46d18a", salary:"#5b9dff", gray:"#8a8a92",
            pie:["#ffffff","#5b9dff","#46d18a","#b9b9c2","#7a7a82","#3f7fd6","#2f9e6a","#56565e"] };

function chLine(series, opts){ // series: [{name,color,data:[n...]}], labels
  const W=580,H=240,pl=44,pr=14,pt=18,pb=30, labels=opts.labels;
  const max=Math.max(1,...series.flatMap(s=>s.data));
  const x=i=>pl+(W-pl-pr)*(labels.length<=1?0.5:i/(labels.length-1));
  const y=v=>H-pb-(v/max)*(H-pt-pb);
  let grid="",axis="";
  for(let g=0;g<=4;g++){ const gy=pt+(H-pt-pb)*g/4; grid+=`<line x1="${pl}" y1="${gy}" x2="${W-pr}" y2="${gy}" stroke="#22222a"/>`;
    axis+=`<text x="${pl-8}" y="${gy+4}" text-anchor="end" fill="#6f6f78" font-size="10">${Math.round(max*(4-g)/4).toLocaleString()}</text>`; }
  labels.forEach((lb,i)=>{ grid+=`<text x="${x(i)}" y="${H-pb+16}" text-anchor="middle" fill="#7e7e87" font-size="10.5">${esc(lb)}</text>`; });
  let paths="";
  series.forEach(s=>{
    const pts=s.data.map((v,i)=>[x(i),y(v)]);
    const dpath=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
    const area=dpath+` L ${x(labels.length-1)} ${H-pb} L ${x(0)} ${H-pb} Z`;
    paths+=`<path d="${area}" fill="${s.color}" opacity="0.10"/>`;
    paths+=`<path d="${dpath}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
    paths+=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${s.color}"/>`).join("");
  });
  const leg=series.map(s=>`<span class="leg"><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${grid}${paths}${axis}</svg><div class="legend">${leg}</div>`;
}
function chDonut(items){
  const tot=items.reduce((s,x)=>s+x.value,0)||1, r=58, c=2*Math.PI*r, cx=80, cy=80;
  let off=0, arcs="";
  items.forEach((it,i)=>{ const len=it.value/tot*c, col=C.pie[i%C.pie.length];
    arcs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="22" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"/>`; off+=len; });
  const leg=items.map((it,i)=>`<span class="leg"><i style="background:${C.pie[i%C.pie.length]}"></i>${esc(it.label)} · ${money(it.value)}</span>`).join("");
  return `<div class="donut-wrap"><svg viewBox="0 0 160 160" width="150" height="150">${arcs}<circle cx="80" cy="80" r="40" fill="#0c0c10"/><text x="80" y="76" text-anchor="middle" fill="#8a8a92" font-size="9">${t("total").toUpperCase?t("total"):"TOTAL"}</text><text x="80" y="93" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">${money(tot).replace("$","").replace(" USD","")}</text></svg><div class="legend col">${leg}</div></div>`;
}
function chBars(items,opts){ // horizontal bars, optional signed (profit/loss colors)
  opts=opts||{}; const max=Math.max(1,...items.map(i=>Math.abs(i.value)));
  return `<div class="hbars">`+items.map((it,i)=>{
    const w=Math.abs(it.value)/max*100, col=opts.signed?(it.value>=0?C.profit:C.exp):(opts.color||C.pie[(i+1)%C.pie.length]);
    return `<div class="hbar"><div class="hbar-top"><span>${esc(it.label)}</span><span class="${opts.signed?(it.value>=0?'pos':'neg'):''}">${money(it.value)}</span></div><div class="hbar-track"><div class="hbar-fill" style="width:${w}%;background:${col}"></div></div></div>`;
  }).join("")+`</div>`;
}

/* migrate from the old multi-layer app's localStorage if present */
function migrateOld(old){
  try{
    const s=seedDemo(); // base shape + demo refs; we override arrays we can map
    if(Array.isArray(old.projects)&&old.projects.length){
      s.projects=old.projects.map(p=>({id:p.id||uid("prj"),code:p.code||"",name:(p.name||"").replace(/execution/ig,"Construction"),region:p.region||"Iraq",client:p.client||"",
        type:/design|engineer/i.test(p.type||"")?"Design / Engineering":"Construction",status:p.status||"Active",
        contractValue:num(p.contractValue),currency:p.currency||"IQD",consultancyRate:num(p.feePercent)||0.08,created:p.created||today()}));
    }
    if(Array.isArray(old.clientFunding)){
      s.funding=old.clientFunding.filter(x=>x).map(x=>{
        const isC=/construction/i.test(x.type||""); const amt=num(x.amount);
        const rt=isC?0.08:0, fee=Math.round(amt*rt);
        return {id:x.id||uid("fnd"),date:x.date||today(),projectId:x.projectId,type:isC?"Construction Funding":(x.type||"Design Fee"),
          description:x.description||"",amount:amt,currency:x.currency||"IQD",method:x.method||"Bank Transfer",status:x.status||"Received",
          consultancyRate:rt,consultancyFee:fee,waived:false,netConstruction:amt-fee};
      });
    }
    // best-effort: keep demo for the rest if old shapes unknown
    return s;
  }catch(e){ return seedDemo(); }
}

function load(){
  try{ const raw=localStorage.getItem(STORE_KEY); if(raw){ state=JSON.parse(raw); normalize(); return; } }catch(e){}
  try{ const oldRaw=localStorage.getItem(OLD_KEY); if(oldRaw){ state=migrateOld(JSON.parse(oldRaw)); normalize(); save(); return; } }catch(e){}
  state=seedDemo(); normalize(); save();
}
function normalize(){ const b=blankState(); for(const k in b){ if(state[k]==null) state[k]=b[k]; } for(const k in b.settings){ if(state.settings[k]==null) state.settings[k]=b.settings[k]; } }
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); return true; }
  catch(e){
    console.error("save failed",e);
    try{ alert((isAR&&isAR()?"تعذر الحفظ: مساحة التخزين ممتلئة. تم نقل الإيصالات لتخزين منفصل، لكن إن استمرت المشكلة فصدّر نسخة احتياطية.":"Save failed: storage is full. Receipts are stored separately, but if this persists please export a backup.")); }catch(_){}

}

/* ---------- IndexedDB receipt store (large, durable, survives forever) ---------- */
let _db=null;
function idb(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    try{
      const r=indexedDB.open("larsa_receipts",1);
      r.onupgradeneeded=()=>{ const db=r.result; if(!db.objectStoreNames.contains("receipts")) db.createObjectStore("receipts"); };
      r.onsuccess=()=>{ _db=r.result; res(_db); };
      r.onerror=()=>rej(r.error);
    }catch(e){ rej(e); }
  });
}
async function idbPut(key,val){ try{ const db=await idb(); return await new Promise((res,rej)=>{ const tx=db.transaction("receipts","readwrite"); tx.objectStore("receipts").put(val,key); tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error); }); }catch(e){ return false; } }
async function idbGet(key){ try{ const db=await idb(); return await new Promise((res)=>{ const tx=db.transaction("receipts","readonly"); const rq=tx.objectStore("receipts").get(key); rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>res(null); }); }catch(e){ return null; } }
async function idbDel(key){ try{ const db=await idb(); return await new Promise((res)=>{ const tx=db.transaction("receipts","readwrite"); tx.objectStore("receipts").delete(key); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false); }); }catch(e){ return false; } }

/* totals engine (everything to USD) */
function totals(){
  /* Every reduce passes the rate recorded on the line (fxRate). Collections
     that never carry one (operating, payroll) pass undefined and keep the
     current-rate behaviour — but recorded history stops moving whenever the
     day's rate setting is edited. */
  const rev = state.revenue.filter(r=>r.status==="Received").reduce((s,r)=>s+usd(r.amount,r.currency,r.fxRate),0);
  const fees = state.funding.filter(f=>["Approved","Received"].includes(f.status)&&!f.waived).reduce((s,f)=>s+usd(f.consultancyFee,f.currency,f.fxRate),0);
  const realRevenue = rev+fees;
  const actual=s=>["Approved","Paid","Received"].includes(s);
  const projExp = state.expenses.filter(e=>actual(e.status)&&e.paymentSource==="Client Funding").reduce((s,e)=>s+usd(e.amount,e.currency,e.fxRate),0)
    + (state.materials||[]).filter(e=>actual(e.status)&&e.paymentSource==="Client Funding").reduce((s,e)=>s+usd(e.amount,e.currency,e.fxRate),0)
    + (state.projectLabor||[]).filter(e=>actual(e.status)&&e.paymentSource==="Client Funding").reduce((s,e)=>s+usd(e.total,e.currency,e.fxRate),0);
  const opEx = state.operating.filter(o=>actual(o.status)).reduce((s,o)=>s+usd(o.amount,o.currency,o.fxRate),0)
    + state.expenses.filter(e=>actual(e.status)&&e.paymentSource==="Larsa Operating").reduce((s,e)=>s+usd(e.amount,e.currency,e.fxRate),0);
  const payroll = state.payroll.filter(p=>!["Void","Rejected","Reversed"].includes(p.status)).reduce((s,p)=>s+usd(p.totalCompanyCost||p.grossPay||p.gross||0,p.currency),0);
  const commissions = state.commissions.filter(c=>!["Void","Rejected","Reversed"].includes(c.status)).reduce((s,c)=>s+num(c.due),0);
  const commDue = state.commissions.reduce((s,c)=>s+Math.max(0,num(c.due)-num(c.paid)),0);
  const fundingGross = state.funding.filter(f=>["Approved","Received"].includes(f.status)).reduce((s,f)=>s+usd(f.amount,f.currency,f.fxRate),0);
  const netConstruction = state.funding.filter(f=>["Approved","Received"].includes(f.status)).reduce((s,f)=>s+usd(f.netConstruction,f.currency,f.fxRate),0);
  const fundsHeld = netConstruction - projExp;       // client construction trust balance
  const constructionSpend = projExp;                 // paid FROM client funds (not Larsa P&L)
  const larsaCosts = opEx + payroll + commissions;   // Larsa's own running costs
  const net = realRevenue - larsaCosts;              // Larsa profit & loss
  return {rev,fees,realRevenue,projExp,constructionSpend,opEx,payroll,commissions,larsaCosts,commDue,fundingGross,netConstruction,fundsHeld,net};
}

/* Losing a whole project or a person takes every transaction, document and
   audit line attached to it, so those two cannot be removed by one click on a
   row. They raise a request that has to be approved from the Reviews screen by
   someone holding approve rights, which leaves the request, the approver and
   the time in the audit log. Ordinary transaction rows delete as before. */
const XPROTECTED_DELETE = ["projects","users","employees"];
function xRecLabel(coll,id){
  const r=(state[coll]||[]).find(x=>x.id===id)||{};
  return String(r.name||r.code||r.email||id);
}
/* Approval has to come from authority over the thing being removed, not from
   any elevated permission at all. An earlier version OR-ed these together,
   which let someone holding only settings rights approve deleting a project.
   Deleting a person needs user management; deleting a project needs approval
   rights on projects. */
function canApproveDelete(coll){
  if(coll==="users"||coll==="employees") return can("manageUsers","settings");
  return can("approve","projects");
}
function requestDelete(coll,id){
  const pending=(state.reviewQueue||[]).find(f=>!f.resolved&&f.kind==="delete"&&f.ledger===coll&&f.refId===id);
  if(pending){ toast(T("Already waiting for approval in Reviews.","بانتظار الموافقة في المراجعات.")); render(); return; }
  state.reviewQueue.push({
    id:uid("rev"), kind:"delete", ledger:coll, refId:id,
    note:T("Deletion requested: ","طلب حذف: ")+xRecLabel(coll,id),
    at:new Date().toISOString(), by:currentUser?.email||"", resolved:false,
  });
  log("Deletion requested",coll+" "+id);
  toast(T("Sent for approval. It stays until someone approves it in Reviews.",
          "أُرسل للموافقة. يبقى حتى يوافق عليه أحد في المراجعات."));
  save(); render();
}
function approveDelete(fid){
  const f=(state.reviewQueue||[]).find(x=>x.id===fid);
  if(!f||f.resolved||f.kind!=="delete") return;
  if(!canApproveDelete(f.ledger)){ toast(T("You do not have approval rights for this.","لا تملك صلاحية الموافقة على هذا.")); return; }
  if(!confirm(T("Approve deletion of ","الموافقة على حذف ")+xRecLabel(f.ledger,f.refId)+"?")) return;
  state[f.ledger]=(state[f.ledger]||[]).filter(x=>x.id!==f.refId);
  f.resolved=true; f.resolvedAt=new Date().toISOString(); f.resolvedBy=currentUser?.email||"";
  log("Deletion approved",f.ledger+" "+f.refId+" by "+(currentUser?.email||""));
  save(); render();
}
function rejectDelete(fid){
  const f=(state.reviewQueue||[]).find(x=>x.id===fid);
  if(!f||f.kind!=="delete") return;
  if(!canApproveDelete(f.ledger)){ toast(T("You do not have approval rights for this.","لا تملك صلاحية الموافقة على هذا.")); return; }
  f.resolved=true; f.resolvedAt=new Date().toISOString(); f.rejected=true; f.resolvedBy=currentUser?.email||"";
  log("Deletion rejected",f.ledger+" "+f.refId);
  save(); render();
}
function delRec(coll,id){
  if(XPROTECTED_DELETE.indexOf(coll)>=0) return requestDelete(coll,id);
  if(!confirm(T("Delete this record? This cannot be undone.","حذف هذا السجل؟ لا يمكن التراجع."))) return;
  state[coll]=state[coll].filter(x=>x.id!==id); log("Deleted",coll+" "+id); save(); render(); }

/* ---- derive computed fields after edit/add ---- */
function deriveRecord(coll,r){
  if(coll==="funding"){
    const p=project(r.projectId);
    r.type="Construction Funding";
    r.consultancyRate=(p&&p.region==="Iraq"&&p.type==="Construction")?(num(p.consultancyRate)||DEFAULT_CONSULTANCY):0;
    r.consultancyFee=r.waived?0:Math.round(num(r.amount)*r.consultancyRate);
    r.netConstruction=num(r.amount)-r.consultancyFee;
    r.status=r.status||"Received";
  }
  if(coll==="payroll"){
    const e=state.employees.find(x=>x.id===r.employeeId); if(e){ r.employee=e.name; r.region=r.region||e.region; r.currency=r.currency||e.currency; }
    r.gross=num(r.regular)+num(r.allowances)+num(r.overtime)+num(r.bonus);
    r.net=r.gross-num(r.deductions);
  }
  if(coll==="commissions"){ r.due=num(r.base)*num(r.rate); }
  if(coll==="revenue"){
    /* A revenue can be split between several salesmen on different rates, so
       each one gets its own commission row keyed by sourceId + person. Rows
       for people since removed from the record are dropped, but anything
       already marked paid is left alone rather than silently deleted. */
    const team=Array.isArray(r.salesTeam)&&r.salesTeam.length
      ? r.salesTeam
      : (r.salesman?[{person:r.salesman,rate:num(r.commissionRate)}]:[]);
    const region=(r.stream||"").indexOf("USA")>=0?"USA":"Iraq";
    const base=usd(r.amount,r.currency);
    const live=r.status==="Received"?team.filter(s=>s.person&&num(s.rate)>0):[];
    const keep=new Set(live.map(s=>s.person));
    state.commissions=state.commissions.filter(c=>
      c.sourceId!==r.id || keep.has(c.person) || num(c.paid)>0);
    live.forEach(s=>{
      const due=base*num(s.rate);
      const exists=state.commissions.find(c=>c.sourceId===r.id&&c.person===s.person);
      if(exists) Object.assign(exists,{date:r.date,region,base,rate:num(s.rate),due,description:r.description});
      else state.commissions.unshift({id:uid("com"),date:r.date,sourceId:r.id,person:s.person,region,description:r.description,base,rate:num(s.rate),due,paid:0,status:"Pending"});
    });
  }
}

let edReceiptPending=null, coll0=null, id0=null;
function fieldInput(f,rec){
  const v=rec[f.k]; const id="ed_"+f.k; const wide=f.wide?"wide":"";
  let inner="";
  if(f.type==="text") inner=`<input id="${id}" value="${esc(v||"")}">`;
  else if(f.type==="number") inner=`<input id="${id}" type="number" value="${v!=null?v:0}">`;
  /* The USD rate on the day this line is entered, kept on the line itself.
     One company-wide rate re-valued every past project every time it moved;
     a rate stored per line means a 2026 payment keeps reporting at the rate
     that was actually paid. Pre-filled with the current setting so the
     accountant only types when the day differs. */
  else if(f.type==="fx") inner=`<input id="${id}" type="number" step="1" min="1" value="${num(v)>0?v:rate()}">`;
  else if(f.type==="percent") inner=`<input id="${id}" type="number" step="0.5" value="${v!=null?(num(v)*100):0}">`;
  else if(f.type==="date") inner=`<input id="${id}" type="date" value="${v||today()}">`;
  else if(f.type==="textarea") inner=`<textarea id="${id}" rows="2">${esc(v||"")}</textarea>`;
  else if(f.type==="cur") inner=`<select id="${id}">${["USD","IQD"].map(o=>`<option ${o===(v||"")?"selected":""}>${o}</option>`).join("")}</select>`;
  else if(f.type==="checkbox") inner=`<label class="ck"><input id="${id}" type="checkbox" ${v?"checked":""}> ${T("Yes","نعم")}</label>`;
  else if(f.type==="select") inner=`<select id="${id}">${f.opts.map(o=>`<option value="${esc(o)}" ${o===v?"selected":""}>${esc(dv(o))}</option>`).join("")}</select>`;
  else if(f.type==="projectSelect"){ const ps=state.projects.filter(p=>!f.filter||f.filter(p)); inner=`<select id="${id}">${ps.map(p=>`<option value="${p.id}" ${p.id===v?"selected":""}>${esc(dv(p.name))} · ${esc(p.code)}</option>`).join("")}</select>`; }
  else if(f.type==="empSelect") inner=`<select id="${id}" onchange="edEmpFill()">${state.employees.map(e=>`<option value="${e.id}" ${e.id===v?"selected":""}>${esc(dv(e.name))}</option>`).join("")}</select>`;
  else if(f.type==="jobText"){
    /* Free text plus a datalist of every job number already used, so a number
       can be typed once and picked from the list every time after. */
    const seen=[...new Set((state.revenue||[]).map(r=>r.jobNumber).filter(Boolean))].sort();
    inner=`<input id="${id}" list="${id}_list" value="${esc(v||"")}" placeholder="e.g. 26-104" autocomplete="off">
      <datalist id="${id}_list">${seen.map(j=>`<option value="${esc(j)}"></option>`).join("")}</datalist>`;
  }
  else if(f.type==="salesTeam"){
    /* One revenue can be shared by several salesmen on different rates, so
       this is a repeating pair of rows rather than a single name and percent.
       Older records carry a lone salesman/commissionRate; they are folded in
       here so nothing already entered is lost. */
    let rows=Array.isArray(rec.salesTeam)?rec.salesTeam.slice():[];
    if(!rows.length && rec.salesman) rows=[{person:rec.salesman,rate:num(rec.commissionRate)}];
    if(!rows.length) rows=[{person:"",rate:0}];
    inner=`<div class="sales-wrap"><div id="${id}" class="sales-team">${rows.map((r,i)=>edSalesRow(r,i)).join("")}</div>
      <button type="button" class="mini sales-add" onclick="edAddSales()">+ ${T("Add salesman","إضافة مندوب")}</button></div>`;
  }
  else if(f.type==="staffSelect"){
    /* Dropdown of real Larsa people (staff directory + employees + anyone
       already used as a salesman), same source list as the salesTeam field.
       The current value is kept in the list even if it's not a known name,
       so an existing project never loses its assigned engineer/PM/lead. */
    const people=edSalesPeople();
    const chosen=v||"";
    const opts=[""].concat(people.includes(chosen)||!chosen?people:[chosen].concat(people));
    inner=`<select id="${id}">${opts.map(n=>`<option value="${esc(n)}" ${n===chosen?"selected":""}>${n?esc(dv(n)):"—"}</option>`).join("")}</select>`;
  }
  else if(f.type==="receipt"){ const has=rec.receipt&&(rec.receipt.ref||rec.receipt.data);
    inner=`<div class="rec-field"><input id="${id}" type="file" accept="image/*,application/pdf" onchange="edPickReceipt(event)">
      <span id="ed_recstate" class="muted small">${has?esc(rec.receipt.name||t("receipt")):t("rec_none")}</span>
      ${has?`<button type="button" class="mini" onclick="edClearReceipt()">${T("Remove","إزالة")}</button>`:""}</div>`; }
  const live=(coll0==="funding"&&(f.k==="amount"||f.k==="waived"||f.k==="projectId"||f.k==="currency"))?` oninput="edFundPreview()" onchange="edFundPreview()"`:"";
  return `<div class="field ${wide}"><label>${f.label}</label><div class="inwrap"${live}>${inner}</div></div>`;
}
function edSalesPeople(){
  const names=new Set();
  try{
    const staff=JSON.parse(localStorage.getItem("larsaStaffV8")||"{}");
    (staff.users||[]).forEach(u=>{ if(u&&u.name&&u.enabled!==false) names.add(u.name); });
  }catch(e){ /* store not written yet on this device */ }
  (state.employees||[]).forEach(e=>{ if(e.name) names.add(e.name); });
  (state.revenue||[]).forEach(r=>{
    if(r.salesman) names.add(r.salesman);
    (r.salesTeam||[]).forEach(s=>{ if(s.person) names.add(s.person); });
  });
  return [...names].sort();
}
function edSalesRow(row,i){
  const people=edSalesPeople();
  const chosen=row.person||"";
  const opts=[""].concat(people.includes(chosen)||!chosen?people:[chosen].concat(people));
  return `<div class="sales-row" data-i="${i}">
    <select class="sales-person">${opts.map(n=>`<option value="${esc(n)}" ${n===chosen?"selected":""}>${n?esc(dv(n)):"—"}</option>`).join("")}</select>
    <input class="sales-rate" type="number" step="0.5" min="0" value="${row.rate!=null?(num(row.rate)*100):0}" aria-label="Commission %">
    <span class="sales-pct">%</span>
    <button type="button" class="mini" onclick="edRemoveSales(this)">✕</button>
  </div>`;
}
function edAddSales(){
  const wrap=$("ed_salesTeam"); if(!wrap) return;
  wrap.insertAdjacentHTML("beforeend", edSalesRow({person:"",rate:0}, wrap.children.length));
}
function edRemoveSales(btn){
  const wrap=$("ed_salesTeam"); if(!wrap) return;
  const row=btn.closest(".sales-row");
  if(wrap.children.length<=1){ row.querySelector(".sales-person").value=""; row.querySelector(".sales-rate").value=0; return; }
  row.remove();
}
function edReadSalesTeam(){
  const wrap=$("ed_salesTeam"); if(!wrap) return [];
  return [...wrap.querySelectorAll(".sales-row")].map(r=>({
    person:r.querySelector(".sales-person").value.trim(),
    rate:num(r.querySelector(".sales-rate").value)/100,
  })).filter(s=>s.person);
}
function openEditor(coll,id,seed){
  coll0=coll; id0=id||null; edReceiptPending=null;
  const rec=id? JSON.parse(JSON.stringify((state[coll]||[]).find(x=>x.id===id)||{})) : Object.assign({},seed||{});
  const sch=SCHEMA[coll]; if(!sch) return;
  const title=(id?t("ed_edit"):t("ed_add"))+" — "+t(TITLEKEY[coll]||"");
  const fields=sch.filter(f=>!f.when||f.when(rec)).map(f=>fieldInput(f,rec)).join("");
  const live=coll==="funding"?`<div id="ed_fundprev" class="preview"></div>`:"";
  setHTML("modalRoot",`<div class="modal-back" onclick="if(event.target===this)closeEditor()">
    <div class="modal"><div class="modal-head"><h3>${title}</h3><button class="mini" onclick="closeEditor()">✕</button></div>
      <div class="modal-body"><div class="form-grid">${fields}</div>${live}</div>
      <div class="modal-foot"><button class="btn ghost" onclick="closeEditor()">${t("ed_close")}</button><button class="btn" onclick="saveEditor()">${t("ed_save")}</button></div>
    </div></div>`);
  document.body.classList.add("modal-open");
  if(coll==="funding") setTimeout(edFundPreview,0);
}
function closeEditor(){ setHTML("modalRoot",""); document.body.classList.remove("modal-open"); coll0=null; }
function edEmpFill(){ const e=state.employees.find(x=>x.id===$("ed_employeeId")?.value); if(!e)return; if($("ed_regular")&&!num($("ed_regular").value))$("ed_regular").value=e.baseSalary; if($("ed_region"))$("ed_region").value=e.region; if($("ed_currency"))$("ed_currency").value=e.currency; }
function edPickReceipt(ev){ const f=ev.target.files[0]; if(!f)return; const rd=new FileReader(); rd.onload=()=>{ edReceiptPending={name:f.name,data:rd.result}; const s=$("ed_recstate"); if(s)s.textContent=f.name; }; rd.readAsDataURL(f); }
function edClearReceipt(){ edReceiptPending="REMOVE"; const s=$("ed_recstate"); if(s)s.textContent=t("rec_none"); }
function edFundPreview(){
  const pid=$("ed_projectId")?.value, p=project(pid), amt=num($("ed_amount")?.value), waive=$("ed_waived")?.checked;
  const rate=(p&&p.region==="Iraq"&&p.type==="Construction")?(num(p.consultancyRate)||DEFAULT_CONSULTANCY):0;
  const fee=waive?0:Math.round(amt*rate), cur=$("ed_currency")?.value||"IQD";
  setHTML("ed_fundprev",`<div class="prev-row"><span>${t("f_fee")} (${(rate*100).toFixed(1)}%)</span><b class="neg">${fmt(fee,cur)}</b></div>
    <div class="prev-row"><span>${t("f_netc")}</span><b class="pos">${fmt(amt-fee,cur)}</b></div>`);
}
async function saveEditor(){
  const coll=coll0, sch=SCHEMA[coll];
  const rec = id0? state[coll].find(x=>x.id===id0) : {id:uid(coll.slice(0,3))};
  for(const f of sch){
    if(f.type==="receipt"){
      if(edReceiptPending==="REMOVE"){ if(rec.receipt&&rec.receipt.ref) await idbDel(rec.receipt.ref); rec.receipt=null; }
      else if(edReceiptPending){ const refId=uid("rcp"); await idbPut(refId,{name:edReceiptPending.name,data:edReceiptPending.data}); rec.receipt={name:edReceiptPending.name,ref:refId}; }
      continue;
    }
    if(f.type==="salesTeam"){
      rec.salesTeam=edReadSalesTeam();
      // Keep the single-name fields in step so older screens and reports that
      // still read them show the lead salesman rather than nothing.
      rec.salesman=rec.salesTeam.length?rec.salesTeam[0].person:"";
      rec.commissionRate=rec.salesTeam.length?rec.salesTeam[0].rate:0;
      continue;
    }
    const el=$("ed_"+f.k); if(!el) continue;
    if(f.type==="checkbox") rec[f.k]=el.checked;
    else if(f.type==="number"||f.type==="fx") rec[f.k]=num(el.value);
    else if(f.type==="percent") rec[f.k]=num(el.value)/100;
    else rec[f.k]=el.value;
  }
  /* An exchange rate is required on every line that records money, whatever
     the company setting happens to say today. Without it a past entry would
     silently inherit whatever the rate is at the moment someone reads the
     report, and no closed month would stay closed. Refuse the save rather than
     store a line whose USD value is a guess. */
  if(XFX_COLLS.indexOf(coll)>=0 && num(rec.fxRate)<=0){
    toast(T("Enter the USD exchange rate for this transaction before saving.",
            "أدخل سعر صرف الدولار لهذه الحركة قبل الحفظ."));
    return;
  }
  deriveRecord(coll,rec);
  if(!id0) state[coll].unshift(rec);
  log(id0?"Edited":"Added", coll+" "+rec.id);
  save(); closeEditor(); render();
}

/* ============================================================
   DASHBOARD  (period selector + Profit & Loss inside)
   ============================================================ */
let dashPeriod="year";
function pnlFor(a,b){
  const F=arr=>arr.filter(r=>inRange(r,a,b));
  const rev=F(state.revenue).filter(r=>r.status==="Received").reduce((s,r)=>s+usd(r.amount,r.currency),0);
  const fees=F(state.funding).reduce((s,f)=>s+(f.waived?0:usd(f.consultancyFee,f.currency)),0);
  const op=F(state.operating).reduce((s,o)=>s+usd(o.amount,o.currency),0);
  const pay=F(state.payroll.map(p=>({...p,date:p.payDate}))).filter(p=>p.status!=="Void").reduce((s,p)=>s+usd(p.net,p.currency),0);
  const con=F(state.expenses).reduce((s,e)=>s+usd(e.amount,e.currency),0);
  return {rev,fees,realRevenue:rev+fees,op,pay,con,net:rev+fees-op-pay};
}
function setDashPeriod(p){ dashPeriod=p; render(); }
function renderDashboard(){
  const tt=totals();
  let pa="",pb=""; if(dashPeriod!=="all"){ [pa,pb]=periodRange(dashPeriod); }
  if(dashPeriod==="custom"){ pa=val("dash_from"); pb=val("dash_to"); }
  const P=pnlFor(pa,pb);
  const months=lastMonths(6);
  const revSeries=months.map(m=>state.revenue.filter(r=>r.status==="Received"&&monthKey(r.date)===m.key).reduce((s,r)=>s+usd(r.amount,r.currency),0)
                            + state.funding.filter(f=>!f.waived&&monthKey(f.date)===m.key).reduce((s,f)=>s+usd(f.consultancyFee,f.currency),0));
  const expSeries=months.map(m=>state.operating.filter(o=>monthKey(o.date)===m.key).reduce((s,o)=>s+usd(o.amount,o.currency),0)
                            + state.payroll.filter(p=>monthKey(p.payDate)===m.key).reduce((s,p)=>s+usd(p.net,p.currency),0));
  const netSeries=months.map((m,i)=>revSeries[i]-expSeries[i]);
  const opCat={}; state.operating.forEach(o=>{const k=o.category||"Other";opCat[k]=(opCat[k]||0)+usd(o.amount,o.currency);});
  const breakItems=[...Object.entries(opCat).map(([k,v])=>({label:dv(k),value:v})),{label:dv("Salary"),value:tt.payroll}].sort((a,b)=>b.value-a.value).slice(0,6);
  const streams={}; state.revenue.filter(r=>r.status==="Received").forEach(r=>{streams[r.stream]=(streams[r.stream]||0)+usd(r.amount,r.currency);}); streams["Construction Consultancy Fee"]=tt.fees;
  const streamItems=Object.entries(streams).map(([k,v])=>({label:dv(k),value:v})).filter(x=>x.value>0);
  const projProfit=state.projects.map(p=>{const rev=state.revenue.filter(r=>r.projectId===p.id&&r.status==="Received").reduce((s,r)=>s+usd(r.amount,r.currency),0)+state.funding.filter(f=>f.projectId===p.id&&!f.waived).reduce((s,f)=>s+usd(f.consultancyFee,f.currency),0);const exp=state.expenses.filter(e=>e.projectId===p.id).reduce((s,e)=>s+usd(e.amount,e.currency),0);return {label:dv(p.name),value:rev-exp};}).filter(x=>x.value!==0);
  const payReg={}; state.payroll.forEach(p=>{payReg[p.region]=(payReg[p.region]||0)+usd(p.net,p.currency);});
  const payRegItems=Object.entries(payReg).map(([k,v])=>({label:dv(k),value:v}));
  const presets=[["month","per_month"],["quarter","r_quarter"],["year","r_year"],["all","per_all"],["custom","per_custom"]];

  setHTML("view",`
    <div class="page-head"><h1>${t("nav_dashboard")}</h1>
      <div class="filter-bar inline"><div class="seg">${presets.map(([p,k])=>`<button class="${dashPeriod===p?'on':''}" onclick="setDashPeriod('${p}')">${t(k)}</button>`).join("")}</div>
        ${dashPeriod==="custom"?`<input id="dash_from" type="date" onchange="render()"> <input id="dash_to" type="date" onchange="render()">`:""}</div></div>
    <div class="pnl-band ${P.net>=0?'good':'bad'}">
      <div class="pnl-cell"><span>${t("d_revenue")}</span><b class="pos">${money(P.realRevenue)}</b></div>
      <div class="pnl-cell"><span>${t("nav_operating")}</span><b class="neg">${money(P.op)}</b></div>
      <div class="pnl-cell"><span>${t("nav_payroll")}</span><b class="sal">${money(P.pay)}</b></div>
      <div class="pnl-cell big"><span>${P.net>=0?dv("Profit"):dv("Loss")} · ${t("period")}</span><b class="${P.net>=0?'pos':'neg'}">${money(P.net)}</b></div>
    </div>
    <div class="kpi-row">
      ${kpi(t("d_revenue"),money(tt.realRevenue),T("All time","كل الفترات"),"")}
      ${kpi(t("d_net"),moneyC(tt.net),tt.net>=0?dv("Profit"):dv("Loss"),tt.net>=0?"good":"bad")}
      ${kpi(t("d_fees"),money(tt.fees),T("Consultancy","استشارات"),"")}
      ${kpi(t("d_funds"),money(tt.fundsHeld),T("Held in trust","محتجز كأمانة"),"")}
      ${kpi(t("d_comm"),money(tt.commDue),t("nav_commissions"),"sal")}
      ${kpi(t("d_payroll"),money(tt.payroll),dv("Salary"),"sal")}
    </div>
    <div class="grid-2">
      ${card(t("d_revexp"),chLine([{name:t("d_revenue"),color:C.rev,data:revSeries},{name:T("Running costs","التكاليف التشغيلية"),color:C.exp,data:expSeries},{name:t("d_net"),color:C.profit,data:netSeries}],{labels:months.map(m=>m.label)}))}
      ${card(T("Larsa Cost Breakdown","توزيع تكاليف لارسا"),breakItems.length?chDonut(breakItems):`<p class="muted">${t("none")}</p>`)}
    </div>
    <div class="grid-2">
      ${card(t("d_streams"),streamItems.length?chBars(streamItems,{color:C.rev}):`<p class="muted">${t("none")}</p>`)}
      ${card(t("d_projprofit"),projProfit.length?chBars(projProfit,{signed:true}):`<p class="muted">${t("none")}</p>`)}
    </div>
    <div class="grid-2">
      ${card(T("Construction Funds (client trust)","التمويل الإنشائي (أمانة الزبون)"),chBars([{label:T("Net funds in","صافي التمويل الوارد"),value:tt.netConstruction},{label:T("Spent","المصروف"),value:-tt.constructionSpend},{label:T("Held","المحتجز"),value:tt.fundsHeld}],{signed:true}))}
      ${card(t("d_payreg"),payRegItems.length?chDonut(payRegItems):`<p class="muted">${t("none")}</p>`)}
    </div>`);
}

    <tr class="tot"><td>${T("Funds held in trust","المحتجز كأمانة")}</td><td class="right">${moneyC(tt.fundsHeld)}</td></tr></tbody></table>`;
  const regions=["Iraq","USA","Shared"];
  let reg=`<table><thead><tr><th>${t("region")}</th><th class="right">${t("d_revenue")}</th><th class="right">${t("nav_operating")}</th><th class="right">${t("nav_payroll")}</th><th class="right">${t("net")}</th></tr></thead><tbody>`;
  regions.forEach(rg=>{const rv=state.revenue.filter(r=>r.status==="Received"&&project(r.projectId)?.region===rg).reduce((s,r)=>s+usd(r.amount,r.currency),0)+state.funding.filter(f=>!f.waived&&project(f.projectId)?.region===rg).reduce((s,f)=>s+usd(f.consultancyFee,f.currency),0);const op=state.operating.filter(o=>o.region===rg).reduce((s,o)=>s+usd(o.amount,o.currency),0);const pr=state.payroll.filter(p=>p.region===rg).reduce((s,p)=>s+usd(p.net,p.currency),0);reg+=`<tr><td>${dv(rg)}</td><td class="right pos">${money(rv)}</td><td class="right neg">${money(op)}</td><td class="right sal">${money(pr)}</td><td class="right">${moneyC(rv-op-pr)}</td></tr>`;});
  reg+=`</tbody></table>`;
  setHTML("view",`<div class="page-head"><h1>${t("nav_master")}</h1></div>

    {label:t("date"),get:r=>r.date},

    {label:t("description"),get:r=>esc(dv(r.description))},
    {label:t("salesman"),get:r=>{

}

let clientProj="";
function clientTotals(pid){
  /* Drafts and rejected funding are not client money, and construction
     spending is materials and labor as well as expenses — a client page
     that ignored both overstated the balance in both directions. */
  const fund=state.funding.filter(f=>f.projectId===pid&&["Approved","Received"].includes(f.status));
  const gross=fund.reduce((s,f)=>s+usd(f.amount,f.currency,f.fxRate),0);
  const fee=fund.reduce((s,f)=>s+(f.waived?0:usd(f.consultancyFee,f.currency,f.fxRate)),0);
  const net=fund.reduce((s,f)=>s+usd(f.netConstruction,f.currency,f.fxRate),0);
  const actualRow=e=>["Approved","Paid","Received"].includes(e.status)&&e.paymentSource==="Client Funding";
  const spent=state.expenses.filter(e=>e.projectId===pid&&actualRow(e)).reduce((s,e)=>s+usd(e.amount,e.currency,e.fxRate),0)
    + (state.materials||[]).filter(e=>e.projectId===pid&&actualRow(e)).reduce((s,e)=>s+usd(e.amount,e.currency,e.fxRate),0)
    + (state.projectLabor||[]).filter(e=>e.projectId===pid&&actualRow(e)).reduce((s,e)=>s+usd(e.total,e.currency,e.fxRate),0);
  return {gross,fee,net,spent,balance:net-spent,fund};
}

   REPORTS  (summary/detailed, daily/weekly/monthly/quarter/year, rich, color-coded)
   ============================================================ */
let rptPreset="monthly", rptDetail="summary";
function reportData(){
  let [a,b]=periodRange(rptPreset);
  if(rptPreset==="custom"){ a=val("rpt_from")||""; b=val("rpt_to")||""; }
  const F=arr=>arr.filter(r=>inRange(r,a,b));
  const rev=F(state.revenue).filter(r=>r.status==="Received");
  const actual=s=>["Approved","Paid","Received"].includes(s);
  const fund=F(state.funding).filter(f=>["Approved","Received"].includes(f.status));
  const exp=F(state.expenses).filter(e=>actual(e.status)&&e.paymentSource==="Client Funding");
  const op=F(state.operating).filter(o=>actual(o.status));
  const pay=F(state.payroll.map(p=>({...p,date:p.payDate}))).filter(p=>!["Void","Rejected","Reversed"].includes(p.status));
  const comm=F(state.commissions).filter(c=>!["Void","Rejected","Reversed"].includes(c.status));
  const revUSD=rev.reduce((s,r)=>s+usd(r.amount,r.currency,r.fxRate),0);
  const feeUSD=fund.reduce((s,f)=>s+(f.waived?0:usd(f.consultancyFee,f.currency,f.fxRate)),0);
  const expUSD=exp.reduce((s,e)=>s+usd(e.amount,e.currency,e.fxRate),0);
  const opUSD=op.reduce((s,o)=>s+usd(o.amount,o.currency,o.fxRate),0);
  const payUSD=pay.reduce((s,p)=>s+usd(p.totalCompanyCost||p.grossPay||p.gross||0,p.currency),0);
  const commUSD=comm.reduce((s,c)=>s+num(c.due),0);
  const net=revUSD+feeUSD-opUSD-payUSD-commUSD;
  const netConstruction=fund.reduce((s,f)=>s+usd(f.netConstruction,f.currency,f.fxRate),0);
  return {a,b,rev,fund,exp,op,pay,comm,revUSD,feeUSD,expUSD,opUSD,payUSD,commUSD,netConstruction,net};
}

/* ---------- WORKING Excel export: SpreadsheetML 2003 (.xls) multi-sheet ---------- */
function xlsCell(v){
  if(typeof v==="number"&&isFinite(v)) return `<Cell><Data ss:Type="Number">${v}</Data></Cell>`;
  return `<Cell><Data ss:Type="String">${esc(String(v==null?"":v))}</Data></Cell>`;
}
function xlsRow(cells){ return `<Row>${cells.map(xlsCell).join("")}</Row>`; }
function xlsSheet(name,headers,rows){
  return `<Worksheet ss:Name="${esc(name).slice(0,31)}"><Table>`+
    xlsRow(headers)+rows.map(r=>xlsRow(r)).join("")+
    `</Table></Worksheet>`;
}

function round2(n){ return Math.round(num(n)*100)/100; }
function downloadBlob(content, filename, mime){
  const blob=new Blob(["\ufeff"+content],{type:mime+";charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},200);
}
function downloadText(filename, content, mime){
  const blob=new Blob([content],{type:(mime||"application/json")+";charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},200);
}
function exportCSV(){

  const lines=[["Section","Date","A","B","Amount","Currency","USD"].join(",")];
  d.rev.forEach(r=>lines.push(["Revenue",r.date,r.stream,r.description,num(r.amount),r.currency,round2(usd(r.amount,r.currency,r.fxRate))].map(esc2).join(",")));

  d.exp.forEach(e=>lines.push(["Expense",e.date,e.category,e.supplier||"",num(e.amount),e.currency,round2(usd(e.amount,e.currency,e.fxRate))].map(esc2).join(",")));
  d.op.forEach(o=>lines.push(["Operating",o.date,o.region,o.category,num(o.amount),o.currency,round2(usd(o.amount,o.currency,o.fxRate))].map(esc2).join(",")));
  d.pay.forEach(p=>lines.push(["Payroll",p.payDate,p.employee,p.period,num(p.net),p.currency,round2(usd(p.net,p.currency))].map(esc2).join(",")));
  downloadBlob(lines.join("\n"), `Larsa_Report_${today()}.csv`, "text/csv");
}

function saveSettings(){ state.settings.rate=num(val("set_rate"))||1310; state.settings.consultancyRate=num(val("set_rate2"))/100||DEFAULT_CONSULTANCY; save(); render(); }
async function exportBackup(){
  const clone=JSON.parse(JSON.stringify(state));
  // embed receipts so the backup is fully portable & permanent
  for(const coll of Object.keys(clone)){
    if(!Array.isArray(clone[coll])) continue;
    for(const r of clone[coll]){
      if(r&&r.receipt&&r.receipt.ref){ const got=await idbGet(r.receipt.ref); if(got){ r.receipt.data=got.data; } }
    }
  }
  downloadBlob(JSON.stringify(clone,null,2), `Larsa_backup_${today()}.json`, "application/json");
}
function importBackup(ev){ const f=ev.target.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=async()=>{ try{
    const data=JSON.parse(rd.result);
    // restore receipts to IndexedDB, keep refs in state
    for(const coll of Object.keys(data)){
      if(!Array.isArray(data[coll])) continue;
      for(const r of data[coll]){
        if(r&&r.receipt&&r.receipt.data){ const ref=r.receipt.ref||uid("rcp"); await idbPut(ref,{name:r.receipt.name,data:r.receipt.data}); r.receipt={name:r.receipt.name,ref}; }
      }
    }
    state=data; normalize(); save(); alert(T("Backup imported.","تم استيراد النسخة.")); render();
  }catch(e){ alert(T("Invalid backup file.","ملف غير صالح.")); } };
  rd.readAsText(f);
}

/* Every money ledger gets a rate column, appended here rather than in each of
   the table definitions below, so funding, expenses, materials, labour and
   revenue all show it and none can be forgotten. It reports the rate the line
   was actually entered at; a line saved before the engine started asking shows
   the current setting in brackets, so it is obvious which is recorded and which
   is assumed. USD lines have no rate to show. */
const XFX_COLLS=["funding","revenue","expenses","materials","projectLabor"];
function xFxCell(r){
  if(String(r.currency||"USD").toUpperCase()!=="IQD") return "—";
  return num(r.fxRate)>0 ? fmt(num(r.fxRate),"IQD") : `(${fmt(rate(),"IQD")})`;
}
function xLedger(c,a,cols){
  const withFx = XFX_COLLS.indexOf(c)>=0 && !cols.some(col=>col.label==="USD rate")
    ? cols.concat([{label:"USD rate",r:1,get:xFxCell}])
    : cols;
  return ledgerTable(c,withFx,a.filter(xVisible));
}
